  <script>
    // สคริปต์วาดไอคอน PNG และสร้าง Manifest อัตโนมัติ
    (function() {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#2563eb';
      ctx.fillRect(0, 0, 512, 512); 
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(256, 100);
      ctx.bezierCurveTo(256, 100, 140, 280, 140, 360);
      ctx.arc(256, 360, 116, Math.PI, 0, true);
      ctx.fill();

      const iconUrl = canvas.toDataURL('image/png');
      const manifest = {
        name: "โรงงานน้ำดื่ม แม่จว้า หมู่ 8",
        short_name: "ระบบน้ำดื่ม",
        start_url: window.location.pathname,
        display: "standalone",
        background_color: "#2563eb",
        theme_color: "#2563eb",
        icons: [{ src: iconUrl, sizes: "512x512", type: "image/png", purpose: "any maskable" }]
      };

      const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
      const manifestUrl = URL.createObjectURL(blob);

      let m = document.createElement('link'); m.rel = 'manifest'; m.href = manifestUrl; document.head.appendChild(m);
      let a = document.createElement('link'); a.rel = 'apple-touch-icon'; a.href = iconUrl; document.head.appendChild(a);
    })();
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    // เปลี่ยนมานำเข้าฟังก์ชันสำหรับเก็บข้อมูลออฟไลน์ (Offline Persistence)
    import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, writeBatch, increment, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyADKt7-BEYafDN7gx16CCnMah_BKV-GJmQ",
      authDomain: "wttt-c46a5.firebaseapp.com",
      projectId: "wttt-c46a5",
      storageBucket: "wttt-c46a5.firebasestorage.app",
      messagingSenderId: "372907513409",
      appId: "1:372907513409:web:3501b786049ecdd20d18c0"
    };

    const app = initializeApp(firebaseConfig);
    // เปิดระบบ Offline Mode ให้แอปทำงานต่อได้แม้เน็ตหลุด
    const db = initializeFirestore(app, {
      localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()})
    });

    const SUPER_ADMIN_ACCOUNT = { id: 'super_admin_fixed_id', name: 'ผู้ดูแลระบบสูงสุด', pin: '1617', role: 'super_admin' };

    window.customers = [];
    window.transactions = [];
    window.users = []; 
    window.globalStock = { orange: 0, purple: 0, crate: 0, promptpayNumber: '' }; 
    window.currentUser = null; 

    window.currentView = 'loading';
    window.selectedZone = 'ทั้งหมด';
    window.searchQuery = '';
    window.selectedCustomerId = null;

    // Report States
    window.reportMode = 'daily'; 
    const initD = new Date();
    const dStr = initD.getFullYear() + '-' + String(initD.getMonth()+1).padStart(2,'0') + '-' + String(initD.getDate()).padStart(2,'0');
    const mStr = initD.getFullYear() + '-' + String(initD.getMonth()+1).padStart(2,'0') + '-01';
    window.reportDailyDate = dStr;
    window.reportCustomStart = mStr;
    window.reportCustomEnd = dStr;

    window.exportStartDate = mStr;
    window.exportEndDate = dStr;

    // Delivery States
    window.deliveries = { orange: 0, purple: 0, crate: 0 };
    window.returns = { orange: 0, purple: 0, crate: 0 };
    window.ownTakeWash = 0; 
    window.ownTakeRefill = 0; 
    window.ownDeliverDone = 0; 
    window.ownTakeUnpaid = 0;
    window.ownDeliverPayWash = 0;
    window.ownDeliverPayRefill = 0;
    window.ownBottlePayMode = 'pay_now'; 
    window.isRemoteArea = false;
    window.cashReceived = ''; 
    window.paymentStatus = 'paid';
    window.paymentMethod = 'cash'; 
    window.txNote = '';

    window.formName = ''; window.formPhone = ''; window.formZone = '';
    window.formDebt = 0; window.formStockOrange = 0; window.formStockPurple = 0; window.formStockCrate = 0; window.formStockOwnBottle = 0;

    window.editingUserId = null;
    window.newUserRole = 'staff'; window.newUserName = ''; window.newUserPin = '';

    window.prices = { orange: 15, purple: 15, crate: 30, ownWash: 5, ownRefill: 15 };

    let loaded = { cust: false, tx: false, users: false, stock: false };
    let isAppInitialized = false;

    // ฟังก์ชันสั่งมือถือสั่น (Haptic Feedback)
    window.vibrate = function(pattern = 30) {
      if (navigator.vibrate) {
        navigator.vibrate(pattern);
      }
    };

    // ฟังก์ชันสำหรับเก็บแป้นพิมพ์อัตโนมัติ แก้บัคจอค้าง
    window.hideKeyboard = function() {
      if (document.activeElement && typeof document.activeElement.blur === 'function') {
        document.activeElement.blur();
      }
    };

    onSnapshot(collection(db, "customers"), (snap) => { window.customers = snap.docs.map(d => ({ id: d.id, ...d.data() })); checkLoad('cust'); });
    onSnapshot(collection(db, "transactions"), (snap) => { window.transactions = snap.docs.map(d => ({ id: d.id, ...d.data() })); checkLoad('tx'); });
    onSnapshot(collection(db, "users"), (snap) => { 
      window.users = snap.docs.map(d => ({ id: d.id, ...d.data() })); 
      if (window.currentUser && window.currentUser.role !== 'super_admin') {
        const updatedMe = window.users.find(u => u.id === window.currentUser.id);
        if (updatedMe) window.currentUser = updatedMe;
      }
      checkLoad('users'); 
    });
    onSnapshot(doc(db, "system", "global_stock"), (docSnap) => { 
      if(docSnap.exists()) window.globalStock = docSnap.data(); 
      else window.globalStock = { orange: 0, purple: 0, crate: 0, promptpayNumber: '' };
      checkLoad('stock'); 
    });

    function checkLoad(module) {
      loaded[module] = true;
      if (loaded.cust && loaded.tx && loaded.users && loaded.stock) {
        const loader = document.getElementById('loading-screen');
        if (loader && !loader.classList.contains('hidden')) {
          setTimeout(() => {
            loader.style.opacity = '0';
            loader.style.transform = 'scale(1.05)';
            setTimeout(() => {
              loader.classList.add('hidden');
              document.getElementById('bottom-nav').classList.remove('hidden');
            }, 700);
          }, 800);
        }
        if (!isAppInitialized) {
          isAppInitialized = true;
          initializeAppFlow();
        } else {
          window.render();
        }
      }
    }

    function initializeAppFlow() {
      const savedUserId = localStorage.getItem('water_app_user_id');
      if (savedUserId === SUPER_ADMIN_ACCOUNT.id) {
        window.currentUser = SUPER_ADMIN_ACCOUNT;
        window.switchView('list');
        return;
      }
      if (savedUserId) {
        const user = window.users.find(u => u.id === savedUserId);
        if (user) {
          window.currentUser = user;
          window.switchView('list');
          return;
        }
      }
      window.switchView('login');
    }

    const safeNum = (val) => {
      const parsed = parseInt(val, 10);
      return isNaN(parsed) ? 0 : parsed;
    };
    window.safeNum = safeNum;

    window.formatDate = (ts) => {
      if (!ts) return '-';
      try {
        const d = new Date(ts);
        const dd = String(d.getDate()).padStart(2, '0');
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const yyyy = d.getFullYear() + 543; 
        const hr = String(d.getHours()).padStart(2, '0');
        const mn = String(d.getMinutes()).padStart(2, '0');
        return `${dd}/${mm}/${yyyy} ${hr}:${mn}`;
      } catch(e) { return '-'; }
    };

    window.generatePromptPayPayload = function(promptpayId, amount) {
      let id = promptpayId.replace(/[^0-9]/g, '');
      let billerId = '';
      if (id.length === 13) {
        billerId = '0213' + id; 
      } else if (id.length === 10) {
        billerId = '01130066' + id.substring(1); 
      } else {
        return null; 
      }

      let merchantInfo = '0016A000000677010111' + billerId;
      let payload = '00020101021229' + merchantInfo.length.toString().padStart(2, '0') + merchantInfo + '5802TH5303764';

      if (amount > 0) {
        let amountStr = Number(amount).toFixed(2);
        payload += '54' + amountStr.length.toString().padStart(2, '0') + amountStr;
      }
      payload += '6304';

      let crc = 0xFFFF;
      for (let i = 0; i < payload.length; i++) {
        crc ^= payload.charCodeAt(i) << 8;
        for (let j = 0; j < 8; j++) {
          if ((crc & 0x8000) !== 0) {
            crc = (crc << 1) ^ 0x1021;
          } else {
            crc = crc << 1;
          }
        }
      }
      crc = (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
      return payload + crc;
    };

    window.showToast = function(message, type = 'success') {
      window.vibrate(type === 'error' ? [50, 50, 50] : 30);
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = message;
      toast.className = `fixed top-4 left-1/2 z-50 px-6 py-3 rounded-full shadow-2xl font-bold flex items-center text-white pointer-events-none w-max max-w-[90%] ${type === 'error' ? 'bg-red-500' : 'bg-emerald-600'}`;
      document.getElementById('toast-icon').innerHTML = type === 'error' ? '<i data-lucide="alert-circle" class="w-5 h-5"></i>' : '<i data-lucide="check-circle" class="w-5 h-5"></i>';
      lucide.createIcons();
      toast.style.transform = 'translate(-50%, 0)';
      toast.style.opacity = '1';
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.style.transform = 'translate(-50%, -150px)';
        toast.style.opacity = '0';
      }, 2500);
    };

    let confirmCallback = null;
    window.showModal = function(title, msg, confirmText, danger, onConfirm) {
      window.vibrate(50);
      window.hideKeyboard(); // ดักจับให้แป้นพิมพ์พับลงก่อนกล่องข้อความเด้ง
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-title').className = `font-bold text-xl mb-2 ${danger ? 'text-red-600' : 'text-gray-800'}`;
      document.getElementById('modal-msg').innerHTML = msg; 
      document.getElementById('modal-btn-text').innerText = confirmText;
      const btn = document.getElementById('modal-confirm-btn');
      btn.className = `flex-1 text-white py-3.5 rounded-xl font-bold active:scale-95 transition-transform flex justify-center items-center ${danger ? 'bg-red-500' : 'bg-blue-600'}`;
      confirmCallback = onConfirm;
      document.getElementById('confirm-modal').classList.remove('hidden');
    };

    window.closeModal = function() {
      document.getElementById('confirm-modal').classList.add('hidden');
      document.getElementById('modal-spinner').classList.add('hidden');
      document.getElementById('modal-btn-text').classList.remove('hidden');
      confirmCallback = null;
    };

    document.getElementById('modal-confirm-btn').addEventListener('click', async () => {
      window.vibrate(30);
      if (confirmCallback) {
        document.getElementById('modal-spinner').classList.remove('hidden');
        document.getElementById('modal-btn-text').classList.add('hidden');
        await confirmCallback();
      }
      window.closeModal();
    });

    window.switchView = function(viewName, param = null) {
      window.vibrate(20);
      window.hideKeyboard(); // เคลียร์แป้นพิมพ์เวลาสลับเมนู

      if(window.currentUser && !['admin', 'super_admin'].includes(window.currentUser.role) && ['reports', 'adminStock', 'stockList'].includes(viewName)) {
        return window.showToast('คุณไม่มีสิทธิ์เข้าถึงหน้านี้', 'error');
      }

      window.currentView = viewName;
      if (param) window.selectedCustomerId = param;

      const appCont = document.getElementById('app-container');
      if (appCont) {
        appCont.classList.remove('page-transition');
        void appCont.offsetWidth; 
        appCont.classList.add('page-transition');
      }

      const navContainer = document.getElementById('bottom-nav');
      if (window.currentUser) {
        if (['admin', 'super_admin'].includes(window.currentUser.role)) {
          navContainer.innerHTML = `
            <button onclick="window.switchView('list')" class="flex flex-col items-center p-2 ${viewName==='list'?'text-blue-600':'text-gray-400'} active:scale-90 transition-all"><i data-lucide="home" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-bold">ลูกค้า</span></button>
            <button onclick="window.switchView('historyAll')" class="flex flex-col items-center p-2 ${viewName==='historyAll'?'text-blue-600':'text-gray-400'} active:scale-90 transition-all"><i data-lucide="file-text" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-bold">บิลล่าสุด</span></button>
            <button onclick="window.switchView('reports')" class="flex flex-col items-center p-2 ${viewName==='reports'?'text-blue-600':'text-gray-400'} active:scale-90 transition-all"><i data-lucide="bar-chart-2" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-bold">รายงาน</span></button>
            <button onclick="window.switchView('adminStock')" class="flex flex-col items-center p-2 ${viewName==='adminStock'?'text-blue-600':'text-gray-400'} active:scale-90 transition-all"><i data-lucide="database" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-bold">จัดการ</span></button>
          `;
        } else {
          navContainer.innerHTML = `
            <button onclick="window.switchView('list')" class="flex flex-col items-center p-2 ${viewName==='list'?'text-blue-600':'text-gray-400'} active:scale-90 transition-all"><i data-lucide="home" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-bold">ลูกค้า</span></button>
            <button onclick="window.switchView('historyAll')" class="flex flex-col items-center p-2 ${viewName==='historyAll'?'text-blue-600':'text-gray-400'} active:scale-90 transition-all"><i data-lucide="file-text" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-bold">บิลล่าสุด</span></button>
            <button onclick="window.switchView('stats')" class="flex flex-col items-center p-2 ${viewName==='stats'?'text-blue-600':'text-gray-400'} active:scale-90 transition-all"><i data-lucide="user" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-bold">โปรไฟล์ฉัน</span></button>
          `;
        }
      }

      if (['login', 'addCustomer', 'editCustomer', 'delivery', 'history', 'stockList'].includes(viewName)) {
        navContainer.classList.add('hidden');
      } else {
        navContainer.classList.remove('hidden');
      }

      window.render();
      window.scrollTo(0, 0); // เลื่อนจอกลับไปบนสุดเสมอเวลาเปลี่ยนหน้า
    };

    window.logout = function() {
      window.vibrate(50);
      localStorage.removeItem('water_app_user_id');
      window.currentUser = null;
      window.switchView('login');
      window.showToast('ออกจากระบบแล้ว');
    };

    window.loginUser = function(e) {
      e.preventDefault();
      window.vibrate(30);
      window.hideKeyboard(); // ดักจับให้แป้นพิมพ์พับลงก่อนเปลี่ยนหน้า

      const userId = document.getElementById('login-user-select').value;
      const pin = document.getElementById('login-pin').value.trim();
      
      if (!userId) {
        return window.showToast('กรุณาเลือกชื่อผู้ใช้งานด้วยครับ', 'error');
      }
      if (!pin) {
        return window.showToast('กรุณากรอกรหัส PIN', 'error');
      }

      if (userId === SUPER_ADMIN_ACCOUNT.id) {
        if (pin === SUPER_ADMIN_ACCOUNT.pin) {
          window.currentUser = SUPER_ADMIN_ACCOUNT;
          localStorage.setItem('water_app_user_id', SUPER_ADMIN_ACCOUNT.id);
          window.showToast('เข้าสู่ระบบสิทธิ์สูงสุดสำเร็จ');
          // หน่วงเวลา 50ms ให้มือถือเคลียร์การกดค้างบนคีย์บอร์ดก่อนลบจอทิ้ง แก้อาการหน้าค้าง
          setTimeout(() => window.switchView('list'), 50); 
        } else {
          window.showToast('รหัส PIN ผู้ดูแลระบบสูงสุดไม่ถูกต้อง', 'error');
        }
        return;
      }

      const user = window.users.find(u => u.id === userId);
      if (user && user.pin === pin) {
        window.currentUser = user;
        localStorage.setItem('water_app_user_id', user.id);
        window.showToast(`ยินดีต้อนรับคุณ ${user.name}`);
        setTimeout(() => window.switchView('list'), 50); // แก้บัคจอกดแล้วค้าง
      } else {
        window.showToast('รหัส PIN ไม่ถูกต้อง', 'error');

    window.submitDelivery = async function() {
      window.vibrate([30, 50, 30]);
      window.hideKeyboard(); // ดักจับให้แป้นพิมพ์พับลง

      const cust = window.customers.find(c => c.id === window.selectedCustomerId);
      if (!cust) return window.showToast('ไม่พบข้อมูลลูกค้า', 'error');

      const pOrange = window.prices.orange + (window.isRemoteArea ? 5 : 0);
      const pPurple = window.prices.purple + (window.isRemoteArea ? 5 : 0);
      const pCrate = window.prices.crate + (window.isRemoteArea ? 10 : 0);

      const factoryTotal = (window.deliveries.orange * pOrange) + (window.deliveries.purple * pPurple) + (window.deliveries.crate * pCrate);
      const ownServiceTotal = (window.ownTakeWash * window.prices.ownWash) + (window.ownTakeRefill * window.prices.ownRefill) + (window.ownDeliverPayWash * window.prices.ownWash) + (window.ownDeliverPayRefill * window.prices.ownRefill);
      const calcTotal = factoryTotal + ownServiceTotal;
      
      const currentDebt = safeNum(cust.debt);
      let addedDebt = 0, amountCollected = 0, newDebt = currentDebt;

      if (window.paymentStatus === 'paid') {
        amountCollected = calcTotal + currentDebt; addedDebt = -currentDebt; newDebt = 0;
      } else if (window.paymentStatus === 'support') {
        amountCollected = 0; addedDebt = 0; newDebt = currentDebt;
      } else {
        amountCollected = 0; addedDebt = calcTotal; newDebt = currentDebt + addedDebt;
      }

      const calcStock = (old, del, ret) => Math.max(0, safeNum(old) + safeNum(del) - safeNum(ret));
      const newOrange = calcStock(cust.stockOrange, window.deliveries.orange, window.returns.orange);
      const newPurple = calcStock(cust.stockPurple, window.deliveries.purple, window.returns.purple);
      const newCrate = calcStock(cust.stockCrate, window.deliveries.crate, window.returns.crate);
      
      const newOwnBottle = Math.max(0, safeNum(cust.stockOwnBottle) 
        + safeNum(window.ownTakeWash) + safeNum(window.ownTakeRefill) + safeNum(window.ownTakeUnpaid) 
        - safeNum(window.ownDeliverDone) - safeNum(window.ownDeliverPayWash) - safeNum(window.ownDeliverPayRefill));

      const btn = document.getElementById('btn-submit-delivery');
      if(btn) btn.innerHTML = '<div class="w-6 h-6 border-2 border-white border-t-transparent rounded-full animate-spin"></div>';

      try {
        const batch = writeBatch(db);
        batch.update(doc(db, "customers", cust.id), { debt: newDebt, stockOrange: newOrange, stockPurple: newPurple, stockCrate: newCrate, stockOwnBottle: newOwnBottle });

        const txRef = doc(collection(db, "transactions"));
        batch.set(txRef, {
          customerId: cust.id, customerName: cust.name, zone: cust.zone,
          deliveries: {...window.deliveries}, returns: {...window.returns}, 
          ownTakeWash: window.ownTakeWash, ownTakeRefill: window.ownTakeRefill, ownDeliverDone: window.ownDeliverDone,
          ownTakeUnpaid: window.ownTakeUnpaid, ownDeliverPayWash: window.ownDeliverPayWash, ownDeliverPayRefill: window.ownDeliverPayRefill,
          isRemoteArea: window.isRemoteArea,
          paymentStatus: window.paymentStatus, 
          paymentMethod: window.paymentStatus === 'paid' ? window.paymentMethod : null,
          totalAmount: calcTotal, 
          amountCollected, addedDebt, status: 'active', timestamp: Date.now(),
          note: window.txNote, createdBy: window.currentUser.name
        });

        const stockRef = doc(db, "system", "global_stock");
        batch.set(stockRef, {
          orange: increment(-window.deliveries.orange), purple: increment(-window.deliveries.purple), crate: increment(-window.deliveries.crate)
        }, { merge: true });

        await batch.commit();
        window.showToast(`บันทึกการส่งให้ ${cust.name} เรียบร้อย!`);
        window.switchView('list');
      } catch (error) {
        window.showToast('บันทึกไม่สำเร็จ ตรวจสอบอินเทอร์เน็ต', 'error');
        if(btn) btn.innerText = 'บันทึกรายการ';
      }
    };

    window.voidTransaction = function(txId) {
      window.vibrate(30);
      const tx = window.transactions.find(t => t.id === txId);
      if (!tx) return;

      window.showModal('ต้องการยกเลิกบิลนี้?', 'ระบบจะดึงสต๊อกและยอดหนี้กลับ (เฉพาะผู้ดูแลระบบ)', 'ยืนยันยกเลิกบิล', true, async () => {
        if(!['admin', 'super_admin'].includes(window.currentUser.role)) return window.showToast('สิทธิ์ไม่เพียงพอ แจ้งแอดมินเพื่อยกเลิก', 'error');

        try {
          const batch = writeBatch(db);
          const cust = window.customers.find(c => c.id === tx.customerId);
          
          if (cust) {
            const revOrange = Math.max(0, safeNum(cust.stockOrange) - safeNum(tx.deliveries?.orange) + safeNum(tx.returns?.orange));
            const revPurple = Math.max(0, safeNum(cust.stockPurple) - safeNum(tx.deliveries?.purple) + safeNum(tx.returns?.purple));
            const revCrate = Math.max(0, safeNum(cust.stockCrate) - safeNum(tx.deliveries?.crate) + safeNum(tx.returns?.crate));
            const revDebt = Math.max(0, safeNum(cust.debt) - safeNum(tx.addedDebt));
            const revOwn = Math.max(0, safeNum(cust.stockOwnBottle) 
              - safeNum(tx.ownTakeWash) - safeNum(tx.ownTakeRefill) - safeNum(tx.ownTakeUnpaid) 
              + safeNum(tx.ownDeliverDone) + safeNum(tx.ownDeliverPayWash) + safeNum(tx.ownDeliverPayRefill)
            );
            
            batch.update(doc(db, "customers", cust.id), { debt: revDebt, stockOrange: revOrange, stockPurple: revPurple, stockCrate: revCrate, stockOwnBottle: revOwn });
          }
          
          batch.set(doc(db, "system", "global_stock"), {
            orange: increment(safeNum(tx.deliveries?.orange)), purple: increment(safeNum(tx.deliveries?.purple)), crate: increment(safeNum(tx.deliveries?.crate))
          }, { merge: true });

          batch.update(doc(db, "transactions", tx.id), { status: 'voided' });
          await batch.commit();

          window.showToast('ยกเลิกบิลและดึงสต๊อกกลับสำเร็จ');
          window.render();
        } catch (error) { window.showToast('เกิดข้อผิดพลาดในการยกเลิก', 'error'); }
      });
    };

    window.downloadExcelRange = function() {
      window.vibrate(30);
      const startDateVal = document.getElementById('export-start-date').value;
      const endDateVal = document.getElementById('export-end-date').value;

      if (!startDateVal || !endDateVal) return window.showToast("กรุณาเลือกช่วงเวลาให้ครบถ้วน", "error");

      const startTimestamp = new Date(startDateVal + "T00:00:00").getTime();
      const endTimestamp = new Date(endDateVal + "T23:59:59").getTime();

      if (startTimestamp > endTimestamp) return window.showToast("วันที่เริ่มต้นต้องไม่มากกว่าสิ้นสุด", "error");

      const txList = window.transactions.filter(t => t.timestamp >= startTimestamp && t.timestamp <= endTimestamp);
      if(txList.length === 0) return window.showToast("ไม่มีบิลในช่วงเวลานี้", "error");

      const headers = [
        'วันที่และเวลา', 'ชื่อลูกค้า', 'โซน', 'พนักงานที่ส่ง', 'สถานะบิล', 'การจ่ายเงิน', 'พื้นที่ห่างไกล',
        'ส่งน้ำ(ส้ม)', 'รับคืน(ส้ม)', 'ส่งน้ำ(ม่วง)', 'รับคืน(ม่วง)', 'ส่งน้ำ(ลัง)', 'รับคืน(ลัง)', 
        'รับมาทำ(จ่ายเลย5฿)', 'รับมาทำ(จ่ายเลย15฿)', 'รับมาทำ(ยังไม่เก็บเงิน)', 
        'ส่งคืน(เก็บเงิน5฿)', 'ส่งคืน(เก็บเงิน15฿)', 'ส่งคืน(จ่ายเงินแล้ว)',
        'มูลค่าบิล(บาท)', 'เก็บเงินสด(บาท)', 'โอนQR(บาท)', 'ค้างจ่ายเพิ่ม(บาท)', 'หมายเหตุ'
      ];
      
      const rows = txList.map(tx => {
        const paymentStr = tx.paymentStatus === 'paid' ? 'จ่ายแล้ว' : (tx.paymentStatus === 'support' ? 'สนับสนุน(ฟรี)' : 'ค้างจ่าย');
        const cashAmt = (tx.paymentStatus === 'paid' && tx.paymentMethod !== 'qr') ? safeNum(tx.amountCollected) : 0;
        const qrAmt = (tx.paymentStatus === 'paid' && tx.paymentMethod === 'qr') ? safeNum(tx.amountCollected) : 0;

        return [
          `"${window.formatDate(tx.timestamp)}"`, `"${tx.customerName}"`, `"${tx.zone}"`, `"${tx.createdBy || '-'}"`, 
          tx.status === 'voided' ? 'ยกเลิก' : 'ปกติ', paymentStr, tx.isRemoteArea ? 'ใช่ (+ค่าส่ง)' : 'ปกติ',
          safeNum(tx.deliveries?.orange), safeNum(tx.returns?.orange), safeNum(tx.deliveries?.purple), safeNum(tx.returns?.purple), safeNum(tx.deliveries?.crate), safeNum(tx.returns?.crate), 
          safeNum(tx.ownTakeWash), safeNum(tx.ownTakeRefill), safeNum(tx.ownTakeUnpaid),
          safeNum(tx.ownDeliverPayWash), safeNum(tx.ownDeliverPayRefill), safeNum(tx.ownDeliverDone),
          safeNum(tx.totalAmount), cashAmt, qrAmt, safeNum(tx.addedDebt), `"${tx.note || ''}"`
        ].join(',');
      });

      const blob = new Blob(['\uFEFF' + headers.join(',') + '\n' + rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a'); link.href = url; link.download = `รายงานส่งน้ำ_${startDateVal}_ถึง_${endDateVal}.csv`; link.click(); URL.revokeObjectURL(url);
      window.showToast('ดาวน์โหลดไฟล์ Excel สำเร็จ');
    };

    let activeId = null;

    let cursorEnd = null;

    window.render = function() {
      if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA' || document.activeElement.tagName === 'SELECT')) {
        activeId = document.activeElement.id;
        try { cursorStart = document.activeElement.selectionStart; cursorEnd = document.activeElement.selectionEnd; } catch(e) {}
      } else { activeId = null; }

      const zc = document.getElementById('zone-scroll-container');
      if (zc) window.lastZoneScroll = zc.scrollLeft;

      const container = document.getElementById('app-container');
      if (!container) return;

      if (window.currentView === 'loading') container.innerHTML = '';
      else if (window.currentView === 'login') renderLogin(container);
      else if (window.currentView === 'list') renderList(container);
      else if (window.currentView === 'addCustomer' || window.currentView === 'editCustomer') renderCustomerForm(container);
      else if (window.currentView === 'delivery') renderDelivery(container);

    function renderTxCardHtml(tx, showCustomerName) {

      const oTW = safeNum(tx.ownTakeWash) || safeNum(tx.ownDeliverWash); 
      const oTR = safeNum(tx.ownTakeRefill) || safeNum(tx.ownDeliverRefill); 
      const oDD = safeNum(tx.ownDeliverDone) || safeNum(tx.ownReturn);
      const oTU = safeNum(tx.ownTakeUnpaid);
      const oDPW = safeNum(tx.ownDeliverPayWash);
      const oDPR = safeNum(tx.ownDeliverPayRefill);

      else statusBadge = `<span class="text-[10px] bg-orange-100 text-orange-700 px-2 py-0.5 rounded-md font-black inline-block">ค้างจ่าย</span>`;

      let moneyStr = '';
      if (tx.paymentStatus === 'support') moneyStr = `<span class="text-pink-600">สนับสนุน (ฟรี)</span>`;
      else if (tx.paymentStatus === 'paid') {
          moneyStr = `<span class="text-blue-600">${tx.paymentMethod === 'qr' ? 'โอนเข้าบัญชี ' : 'เก็บเงินสด '}${safeNum(tx.amountCollected)} ฿</span>`;
      }

            <div>
              ${showCustomerName ? `<h4 class="font-black text-blue-900 mb-1 flex items-center text-sm"><i data-lucide="user" class="w-3.5 h-3.5 mr-1.5 text-blue-500"></i> ${tx.customerName}</h4>` : ''}

              <div class="flex gap-1.5 mt-2 flex-wrap">

              </div>
            </div>
            ${tx.status !== 'voided' && ['admin', 'super_admin'].includes(window.currentUser.role) ? `<button onclick="window.voidTransaction('${tx.id}')" class="text-red-600 text-[10px] font-black flex items-center bg-red-50 px-2.5 py-1.5 rounded-lg active:scale-90 transition-all border border-red-100 shadow-sm"><i data-lucide="trash-2" class="w-3 h-3 mr-1"></i> ยกเลิกบิล</button>` : ''}

          <div class="grid grid-cols-2 gap-x-2 gap-y-3 text-xs text-gray-700">

              ${dP > 0 ? `<p class="flex justify-between font-bold"><span>ม่วง</span> <span class="text-purple-600">${dP}</span></p>` : ''}
              ${dC > 0 ? `<p class="flex justify-between font-bold"><span>ลัง</span> <span class="text-amber-700">${dC}</span></p>` : ''}

            <div>
              <p class="font-black text-[9px] text-gray-400 mb-1.5 uppercase tracking-widest">รับคืนเปล่า</p>
              ${rO > 0 ? `<p class="flex justify-between font-bold"><span>ส้ม</span> <span>${rO}</span></p>` : ''}
              ${rP > 0 ? `<p class="flex justify-between font-bold"><span>ม่วง</span> <span>${rP}</span></p>` : ''}
              ${rC > 0 ? `<p class="flex justify-between font-bold"><span>ลัง</span> <span>${rC}</span></p>` : ''}

                ${oTR > 0 ? `<p class="flex justify-between font-bold text-indigo-700"><span>รับมา (จ่ายเลย 15฿)</span> <span>${oTR}</span></p>` : ''}

                ${oDPW > 0 ? `<p class="flex justify-between font-bold text-indigo-700"><span>ส่งคืน (เก็บ 5฿)</span> <span>${oDPW}</span></p>` : ''}

          ${tx.note ? `<div class="mt-3 bg-yellow-50 text-yellow-800 p-2.5 rounded-xl text-[11px] font-bold border border-yellow-100 flex items-start"><i data-lucide="message-square" class="w-3.5 h-3.5 mr-1.5 mt-0.5 shrink-0 text-yellow-600"></i> ${tx.note}</div>` : ''}

          <div class="mt-4 pt-3 border-t border-gray-100 flex justify-between items-center font-black">
            <span class="text-gray-500 text-xs">รวมเงินบิลนี้ <span class="text-[9px] font-bold text-gray-400 ml-1">(${safeNum(tx.totalAmount)} ฿):</span></span>
            ${moneyStr}
          </div>
        </div>
      `;
    }

    function renderReports(container) {
      if(!['admin', 'super_admin'].includes(window.currentUser.role)) return;

      const validTx = window.transactions.filter(t => t.status !== 'voided');

      let reportHtml = '';

      if (window.reportMode === 'daily' || window.reportMode === 'custom') {
        let txForReport = [];
        if (window.reportMode === 'daily') {
          const targetStr = window.reportDailyDate;
          txForReport = validTx.filter(t => {
            const d = new Date(t.timestamp);
            const localStr = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
            return localStr === targetStr;
          });
        } else {
          const s = new Date(window.reportCustomStart + "T00:00:00").getTime();
          const e = new Date(window.reportCustomEnd + "T23:59:59").getTime();
          txForReport = validTx.filter(t => t.timestamp >= s && t.timestamp <= e);
        }

        const stats = txForReport.reduce((acc, tx) => {
          if (tx.paymentStatus === 'support') {
            acc.support += safeNum(tx.totalAmount);
          } else if (tx.paymentStatus === 'paid') {
            if (tx.paymentMethod === 'qr') acc.qrRev += safeNum(tx.amountCollected);
            else acc.cashRev += safeNum(tx.amountCollected);
            acc.rev += safeNum(tx.amountCollected);
          }
          acc.debt += safeNum(tx.addedDebt) > 0 ? safeNum(tx.addedDebt) : 0;

          acc.dO += safeNum(tx.deliveries?.orange); acc.dP += safeNum(tx.deliveries?.purple); acc.dC += safeNum(tx.deliveries?.crate);
          acc.rO += safeNum(tx.returns?.orange); acc.rP += safeNum(tx.returns?.purple); acc.rC += safeNum(tx.returns?.crate);
          
          acc.oW += safeNum(tx.ownTakeWash) + safeNum(tx.ownDeliverPayWash);
          acc.oR += safeNum(tx.ownTakeRefill) + safeNum(tx.ownDeliverPayRefill);
          acc.oRet += safeNum(tx.ownDeliverDone);
          acc.oTU += safeNum(tx.ownTakeUnpaid);
          
          const creator = tx.createdBy || 'ไม่ระบุ';
          if (!acc.staffCash[creator]) acc.staffCash[creator] = 0;
          if (tx.paymentStatus === 'paid' && tx.paymentMethod !== 'qr') {
              acc.staffCash[creator] += safeNum(tx.amountCollected);
          }

          return acc;
        }, { rev: 0, cashRev: 0, qrRev: 0, debt: 0, support: 0, dO: 0, dP: 0, dC: 0, rO: 0, rP: 0, rC: 0, oW: 0, oR: 0, oRet: 0, oTU: 0, staffCash: {} });

        const totalDel = stats.dO + stats.dP + stats.dC;
        const staffCashHTML = Object.keys(stats.staffCash).map(name => `
          <div class="flex justify-between items-center py-2.5 border-b border-emerald-100/50 last:border-0">
            <span class="text-sm font-bold text-emerald-800 flex items-center"><i data-lucide="truck" class="w-4 h-4 mr-2 text-emerald-600"></i> ${name}</span>
            <span class="text-base font-black text-emerald-700">${stats.staffCash[name].toLocaleString()} ฿</span>
          </div>
        `).join('') || '<p class="text-sm text-emerald-600/50 text-center py-2">ไม่มีข้อมูล</p>';

        reportHtml = `
          ${window.reportMode === 'daily' ? `
            <div class="mb-5 bg-white p-3 rounded-2xl shadow-sm border border-gray-100 flex items-center transition-all">
              <label class="text-xs font-bold text-gray-500 mr-3 w-16">เลือกวันที่:</label>
              <input type="date" value="${window.reportDailyDate}" onchange="window.reportDailyDate=this.value; window.render();" class="flex-1 px-4 py-2 text-sm font-bold rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 bg-gray-50 outline-none transition-all" />
            </div>
          ` : `
            <div class="mb-5 bg-white p-4 rounded-2xl shadow-sm border border-gray-100 transition-all">
              <div class="flex items-center mb-2">
                <label class="text-[10px] font-bold text-gray-400 w-12">ตั้งแต่:</label>
                <input type="date" value="${window.reportCustomStart}" onchange="window.reportCustomStart=this.value; window.render();" class="flex-1 px-3 py-1.5 text-sm font-bold rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 bg-gray-50 outline-none transition-all" />
              </div>
              <div class="flex items-center">
                <label class="text-[10px] font-bold text-gray-400 w-12">ถึง:</label>
                <input type="date" value="${window.reportCustomEnd}" onchange="window.reportCustomEnd=this.value; window.render();" class="flex-1 px-3 py-1.5 text-sm font-bold rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 bg-gray-50 outline-none transition-all" />
              </div>
            </div>
          `}

          <div class="grid grid-cols-2 gap-3 mb-5">
            <div class="bg-white p-4 rounded-[1.5rem] shadow-[0_2px_10px_rgb(0,0,0,0.02)] border border-emerald-50 flex flex-col justify-center items-center text-center transition-all hover:shadow-md">
              <span class="text-gray-500 text-[10px] font-black mb-1 flex items-center uppercase tracking-wider"><i data-lucide="banknote" class="w-3.5 h-3.5 mr-1 text-emerald-500"></i> รับเงินสด</span>
              <span class="text-2xl font-black text-emerald-600">${stats.cashRev.toLocaleString()}</span>
            </div>
            <div class="bg-white p-4 rounded-[1.5rem] shadow-[0_2px_10px_rgb(0,0,0,0.02)] border border-blue-50 flex flex-col justify-center items-center text-center transition-all hover:shadow-md">
              <span class="text-gray-500 text-[10px] font-black mb-1 flex items-center uppercase tracking-wider"><i data-lucide="qr-code" class="w-3.5 h-3.5 mr-1 text-blue-500"></i> โอน (QR)</span>
              <span class="text-2xl font-black text-blue-600">${stats.qrRev.toLocaleString()}</span>
            </div>
            <div class="bg-white p-4 rounded-[1.5rem] shadow-[0_2px_10px_rgb(0,0,0,0.02)] border border-red-50 flex flex-col justify-center items-center text-center transition-all hover:shadow-md">
              <span class="text-gray-500 text-[10px] font-black mb-1 flex items-center uppercase tracking-wider"><i data-lucide="alert-circle" class="w-3.5 h-3.5 mr-1 text-red-500"></i> ค้างจ่ายเพิ่ม</span>
              <span class="text-2xl font-black text-red-500">${stats.debt.toLocaleString()}</span>
            </div>
            <div class="bg-white p-4 rounded-[1.5rem] shadow-[0_2px_10px_rgb(0,0,0,0.02)] border border-pink-50 flex flex-col justify-center items-center text-center transition-all hover:shadow-md">
              <span class="text-gray-500 text-[10px] font-black mb-1 flex items-center uppercase tracking-wider"><i data-lucide="gift" class="w-3.5 h-3.5 mr-1 text-pink-500"></i> สนับสนุน</span>
              <span class="text-2xl font-black text-pink-500">${stats.support.toLocaleString()}</span>
            </div>
          </div>

          <div class="bg-gradient-to-br from-emerald-50 to-emerald-100/50 p-5 rounded-[1.5rem] shadow-sm border border-emerald-100 mb-5">
            <h3 class="font-black text-emerald-900 mb-3 flex items-center">
              <div class="bg-emerald-200/50 p-1.5 rounded-lg mr-2"><i data-lucide="wallet" class="w-4 h-4 text-emerald-700"></i></div> 
              ยอดเงินสดส่งโรงงาน <span class="text-[10px] font-bold text-emerald-600 bg-white px-2 py-0.5 rounded-md ml-2 shadow-sm border border-emerald-100">แยกพนักงาน</span>

            <div class="space-y-1 bg-white/60 p-2 rounded-xl border border-emerald-50">

            <h3 class="font-black text-gray-800 mb-4 flex items-center text-base"><i data-lucide="package" class="w-5 h-5 mr-2 text-blue-500"></i> ส่งน้ำใหม่ (ออก ${totalDel})</h3>
            <div class="space-y-4">
              <div>
                <div class="flex justify-between text-sm font-bold text-gray-700 mb-1.5"><span class="flex items-center text-orange-600"><i data-lucide="droplet" class="w-4 h-4 mr-1.5"></i> ถังส้ม</span><span>ส่ง <b class="text-gray-900">${stats.dO}</b> / คืน ${stats.rO}</span></div>
                <div class="w-full bg-gray-100 rounded-full h-2.5 flex"><div class="bg-orange-500 h-2.5 rounded-full transition-all duration-1000 ease-out" style="width: ${totalDel ? (stats.dO/totalDel)*100 : 0}%"></div></div>
              </div>
              <div>
                <div class="flex justify-between text-sm font-bold text-gray-700 mb-1.5"><span class="flex items-center text-purple-600"><i data-lucide="droplet" class="w-4 h-4 mr-1.5"></i> ถังม่วง</span><span>ส่ง <b class="text-gray-900">${stats.dP}</b> / คืน ${stats.rP}</span></div>
                <div class="w-full bg-gray-100 rounded-full h-2.5 flex"><div class="bg-purple-600 h-2.5 rounded-full transition-all duration-1000 ease-out" style="width: ${totalDel ? (stats.dP/totalDel)*100 : 0}%"></div></div>
              </div>
              <div>
                <div class="flex justify-between text-sm font-bold text-gray-700 mb-1.5"><span class="flex items-center text-amber-700"><i data-lucide="package" class="w-4 h-4 mr-1.5"></i> แบบลัง</span><span>ส่ง <b class="text-gray-900">${stats.dC}</b> / คืน ${stats.rC}</span></div>
                <div class="w-full bg-gray-100 rounded-full h-2.5 flex"><div class="bg-amber-700 h-2.5 rounded-full transition-all duration-1000 ease-out" style="width: ${totalDel ? (stats.dC/totalDel)*100 : 0}%"></div></div>
              </div>

          </div>

          <div class="bg-indigo-50/70 p-5 rounded-[1.5rem] shadow-sm border border-indigo-100 mb-6">
            <h3 class="font-black text-indigo-900 mb-3 flex items-center justify-between">
              <span class="flex items-center"><i data-lucide="archive" class="w-5 h-5 mr-2 text-indigo-600"></i> บริการถังส่วนตัว</span>

            <div class="space-y-1 text-[13px] font-bold text-indigo-800 bg-white/60 p-3 rounded-xl border border-indigo-50">

              <div class="flex justify-between py-1.5 border-b border-indigo-100/50"><span>ล้าง+เติม (15฿)</span><span>${stats.oR}</span></div>

              <div class="flex justify-between py-1.5 text-gray-500"><span>ส่งคืน (เสร็จแล้ว)</span><span>${stats.oRet}</span></div>
            </div>
          </div>
        `;
      } else if (window.reportMode === 'monthly' || window.reportMode === 'yearly') {
        const grouped = {};

             grouped[key] = { key, sortValue, rev:0, cashRev:0, qrRev:0, debt:0, support:0, dO:0, dP:0, dC:0 };

          if (tx.paymentStatus === 'support') {
            grouped[key].support += safeNum(tx.totalAmount);

            else grouped[key].cashRev += safeNum(tx.amountCollected);
            grouped[key].rev += safeNum(tx.amountCollected);
          }
          grouped[key].debt += safeNum(tx.addedDebt) > 0 ? safeNum(tx.addedDebt) : 0;

                    <option value="admin" ${window.newUserRole==='admin'?'selected':''}>แอดมิน (Admin)</option>
                  </select>
                  <button type="submit" class="bg-indigo-600 text-white px-5 py-3 rounded-xl font-black text-sm shadow-md shadow-indigo-600/30 active:scale-95 w-24 flex justify-center items-center transition-all">${window.editingUserId ? 'บันทึก' : 'เพิ่ม'}</button>
                </div>
              </form>

              <div class="space-y-2">
                <div class="flex justify-between items-center py-3 px-4 bg-red-50 rounded-2xl border border-red-100">
                  <div>
                    <span class="font-black text-red-900 text-[13px]">👑 ผู้ดูแลระบบสูงสุด</span>
                  </div>
                  <span class="text-[10px] font-mono font-bold text-gray-400 border border-gray-200 bg-white px-2 py-1 rounded-lg">PIN: ****</span>
                </div>

                ${window.users.map(u => `
                  <div class="flex justify-between items-center py-2.5 px-4 bg-gray-50 rounded-2xl border ${window.editingUserId === u.id ? 'border-indigo-400 bg-indigo-50 shadow-sm scale-[1.02]' : 'border-gray-100'} transition-all">
                    <div>
                      <span class="font-black text-gray-800 text-[13px]">${u.name}</span>
                      <span class="text-[9px] ml-2 px-2 py-0.5 rounded-md font-bold uppercase tracking-wider ${u.role === 'admin' ? 'bg-indigo-100 text-indigo-700' : 'bg-blue-100 text-blue-600'}">${u.role === 'admin' ? 'Admin' : 'Staff'}</span>
                    </div>
                    <div class="flex items-center gap-2">
                      <span class="text-[10px] font-mono font-bold text-gray-500 mr-1 border border-gray-200 bg-white px-2 py-1 rounded-lg">PIN: ${u.role === 'admin' && window.currentUser.role !== 'super_admin' ? '****' : u.pin}</span>
                      <button onclick="window.editStaff('${u.id}')" class="p-2 bg-white text-blue-600 rounded-xl shadow-sm border border-gray-200 active:scale-90 transition-all"><i data-lucide="edit-3" class="w-3.5 h-3.5"></i></button>
                      <button onclick="window.deleteStaff('${u.id}')" class="p-2 bg-white text-red-600 rounded-xl shadow-sm border border-gray-200 active:scale-90 transition-all"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            ${window.currentUser.role === 'super_admin' ? `
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-red-100">
              <h3 class="font-black text-red-700 mb-3 flex items-center text-base"><i data-lucide="alert-triangle" class="w-5 h-5 mr-2"></i> โซนล้างข้อมูล</h3>
              <p class="text-xs text-gray-500 mb-5 font-bold leading-relaxed bg-red-50 p-3 rounded-xl border border-red-100">ระบบจะทำการลบประวัติบิลทั้งหมดในอดีตอย่างถาวร เพื่อเคลียร์พื้นที่ <br><span class="text-red-600">*(ยอดค้างชำระปัจจุบัน และรายชื่อลูกค้า จะไม่หายไป)*</span></p>
              <button onclick="window.clearAllTransactions()" class="w-full bg-red-600 text-white font-black py-4 rounded-2xl shadow-md shadow-red-600/30 active:scale-95 transition-all text-sm flex justify-center items-center"><i data-lucide="trash-2" class="w-4 h-4 mr-2"></i> ล้างประวัติบิลทั้งหมด</button>
            </div>
            ` : ''}
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
