<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบงาน โรงงานน้ำดื่ม แม่จว้า หมู่ 8</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    button, input, select { -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    
    #toast {
      transform: translate(-50%, -150px);
      opacity: 0;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
    }
  </style>
</head>
<body class="bg-gray-100 font-sans text-gray-900 min-h-screen relative pb-20 selection:bg-blue-200">

  <div id="loading-screen" class="fixed inset-0 bg-white z-[60] flex flex-col items-center justify-center transition-opacity duration-500">
    <div class="w-12 h-12 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mb-4"></div>
    <p class="text-blue-800 font-bold">กำลังเชื่อมต่อฐานข้อมูล...</p>
  </div>

  <div id="toast" class="fixed top-4 left-1/2 z-50 px-6 py-3 rounded-full shadow-2xl font-bold flex items-center text-white pointer-events-none w-max max-w-[90%]">
    <span id="toast-icon" class="mr-2 flex items-center shrink-0"></span>
    <span id="toast-msg" class="text-sm"></span>
  </div>

  <div id="app-container" class="max-w-md mx-auto min-h-screen relative bg-gray-100"></div>

  <div id="bottom-nav" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 pb-safe pt-2 px-6 shadow-[0_-5px_10px_-5px_rgba(0,0,0,0.05)] max-w-md mx-auto z-40 flex justify-around items-center hidden"></div>

  <div id="confirm-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm hidden">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl">
      <h3 id="modal-title" class="font-bold text-xl mb-2 text-gray-800"></h3>
      <p id="modal-msg" class="text-gray-600 mb-6 leading-relaxed text-sm"></p>
      <div class="flex gap-3">
        <button onclick="window.closeModal()" class="flex-1 bg-gray-100 text-gray-700 py-3.5 rounded-xl font-bold active:bg-gray-200 transition-colors">ยกเลิก</button>
        <button id="modal-confirm-btn" class="flex-1 text-white py-3.5 rounded-xl font-bold active:scale-95 transition-transform bg-blue-600 flex justify-center items-center">
          <span id="modal-btn-text">ยืนยัน</span>
          <div id="modal-spinner" class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin hidden ml-2"></div>
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, writeBatch, increment, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyADKt7-BEYafDN7gx16CCnMah_BKV-GJmQ",
      authDomain: "wttt-c46a5.firebaseapp.com",
      projectId: "wttt-c46a5",
      storageBucket: "wttt-c46a5.firebasestorage.app",
      messagingSenderId: "372907513409",
      appId: "1:372907513409:web:3501b786049ecdd20d18c0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // บัญชี Super Admin (ฝังอยู่ในระบบ ไม่ถูกแสดง PIN ให้ใครเห็น)
    const SUPER_ADMIN_ACCOUNT = { id: 'super_admin_fixed_id', name: 'ผู้ดูแลระบบสูงสุด', pin: '1617', role: 'super_admin' };

    window.customers = [];
    window.transactions = [];
    window.users = []; 
    window.globalStock = { orange: 0, purple: 0, crate: 0 }; 
    window.currentUser = null; 

    window.currentView = 'loading';
    window.selectedZone = 'ทั้งหมด';
    window.searchQuery = '';
    window.reportPeriod = 'day';
    window.selectedCustomerId = null;

    window.deliveries = { orange: 0, purple: 0, crate: 0 };
    window.returns = { orange: 0, purple: 0, crate: 0 };
    window.ownTakeWash = 0; 
    window.ownTakeRefill = 0; 
    window.ownDeliverDone = 0; 
    window.ownTakeUnpaid = 0;
    window.ownDeliverPayWash = 0;
    window.ownDeliverPayRefill = 0;
    window.ownBottlePayMode = 'pay_now'; 
    window.paymentStatus = 'paid';
    window.txNote = '';

    window.formName = ''; window.formPhone = ''; window.formZone = '';
    window.formDebt = 0; window.formStockOrange = 0; window.formStockPurple = 0; window.formStockCrate = 0; window.formStockOwnBottle = 0;

    window.editingUserId = null;
    window.newUserRole = 'staff'; window.newUserName = ''; window.newUserPin = '';

    const initDate = new Date();
    window.exportStartDate = new Date(initDate.getFullYear(), initDate.getMonth(), 1).toISOString().split('T')[0];
    window.exportEndDate = initDate.toISOString().split('T')[0];

    window.prices = { orange: 15, purple: 15, crate: 30, ownWash: 5, ownRefill: 15 };

    let loaded = { cust: false, tx: false, users: false, stock: false };
    let isAppInitialized = false;

    onSnapshot(collection(db, "customers"), (snap) => { window.customers = snap.docs.map(d => ({ id: d.id, ...d.data() })); checkLoad('cust'); });
    onSnapshot(collection(db, "transactions"), (snap) => { window.transactions = snap.docs.map(d => ({ id: d.id, ...d.data() })); checkLoad('tx'); });
    onSnapshot(collection(db, "users"), (snap) => { 
      window.users = snap.docs.map(d => ({ id: d.id, ...d.data() })); 
      if (window.currentUser && window.currentUser.role !== 'super_admin') {
        const updatedMe = window.users.find(u => u.id === window.currentUser.id);
        if (updatedMe) window.currentUser = updatedMe;
      }
      checkLoad('users'); 
    });
    onSnapshot(doc(db, "system", "global_stock"), (docSnap) => { 
      if(docSnap.exists()) window.globalStock = docSnap.data(); 
      else window.globalStock = { orange: 0, purple: 0, crate: 0 };
      checkLoad('stock'); 
    });

    function checkLoad(module) {
      loaded[module] = true;
      if (loaded.cust && loaded.tx && loaded.users && loaded.stock) {
        const loader = document.getElementById('loading-screen');
        if (loader && !loader.classList.contains('hidden')) {
          loader.style.opacity = '0';
          setTimeout(() => {
            loader.classList.add('hidden');
            document.getElementById('bottom-nav').classList.remove('hidden');
          }, 500);
        }
        if (!isAppInitialized) {
          isAppInitialized = true;
          initializeAppFlow();
        } else {
          window.render();
        }
      }
    }

    function initializeAppFlow() {
      const savedUserId = localStorage.getItem('water_app_user_id');
      if (savedUserId === SUPER_ADMIN_ACCOUNT.id) {
        window.currentUser = SUPER_ADMIN_ACCOUNT;
        window.switchView('list');
        return;
      }
      if (savedUserId) {
        const user = window.users.find(u => u.id === savedUserId);
        if (user) {
          window.currentUser = user;
          window.switchView('list');
          return;
        }
      }
      window.switchView('login');
    }

    const safeNum = (val) => (isNaN(Number(val)) ? 0 : Number(val));
    window.safeNum = safeNum;

    window.formatDate = (ts) => {
      if (!ts) return '-';
      try {
        const d = new Date(ts);
        const dd = String(d.getDate()).padStart(2, '0');
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const yy = (d.getFullYear() + 543).toString().slice(-2);
        const hr = String(d.getHours()).padStart(2, '0');
        const mn = String(d.getMinutes()).padStart(2, '0');
        return `${dd}/${mm}/${yy} ${hr}:${mn}`;
      } catch(e) { return '-'; }
    };

    let toastTimer = null;
    window.showToast = function(message, type = 'success') {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = message;
      toast.className = `fixed top-4 left-1/2 z-50 px-6 py-3 rounded-full shadow-2xl font-bold flex items-center text-white pointer-events-none w-max max-w-[90%] ${type === 'error' ? 'bg-red-500' : 'bg-green-600'}`;
      document.getElementById('toast-icon').innerHTML = type === 'error' ? '<i data-lucide="alert-circle" class="w-5 h-5"></i>' : '<i data-lucide="check-circle" class="w-5 h-5"></i>';
      lucide.createIcons();
      toast.style.transform = 'translate(-50%, 0)';
      toast.style.opacity = '1';
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.style.transform = 'translate(-50%, -150px)';
        toast.style.opacity = '0';
      }, 2500);
    };

    let confirmCallback = null;
    window.showModal = function(title, msg, confirmText, danger, onConfirm) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-title').className = `font-bold text-xl mb-2 ${danger ? 'text-red-600' : 'text-gray-800'}`;
      document.getElementById('modal-msg').innerHTML = msg; 
      document.getElementById('modal-btn-text').innerText = confirmText;
      const btn = document.getElementById('modal-confirm-btn');
      btn.className = `flex-1 text-white py-3.5 rounded-xl font-bold active:scale-95 transition-transform flex justify-center items-center ${danger ? 'bg-red-500' : 'bg-blue-600'}`;
      confirmCallback = onConfirm;
      document.getElementById('confirm-modal').classList.remove('hidden');
    };

    window.closeModal = function() {
      document.getElementById('confirm-modal').classList.add('hidden');
      document.getElementById('modal-spinner').classList.add('hidden');
      document.getElementById('modal-btn-text').classList.remove('hidden');
      confirmCallback = null;
    };

    document.getElementById('modal-confirm-btn').addEventListener('click', async () => {
      if (confirmCallback) {
        document.getElementById('modal-spinner').classList.remove('hidden');
        document.getElementById('modal-btn-text').classList.add('hidden');
        await confirmCallback();
      }
      window.closeModal();
    });

    window.switchView = function(viewName, param = null) {
      if(window.currentUser && !['admin', 'super_admin'].includes(window.currentUser.role) && ['reports', 'adminStock', 'stockList'].includes(viewName)) {
        return window.showToast('คุณไม่มีสิทธิ์เข้าถึงหน้านี้', 'error');
      }

      window.currentView = viewName;
      if (param) window.selectedCustomerId = param;

      const navContainer = document.getElementById('bottom-nav');
      if (window.currentUser) {
        if (['admin', 'super_admin'].includes(window.currentUser.role)) {
          navContainer.innerHTML = `
            <button onclick="window.switchView('list')" class="flex flex-col items-center p-2 ${viewName==='list'?'text-blue-600':'text-gray-400'} transition-colors"><i data-lucide="home" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-bold">ลูกค้า</span></button>
            <button onclick="window.switchView('historyAll')" class="flex flex-col items-center p-2 ${viewName==='historyAll'?'text-blue-600':'text-gray-400'} transition-colors"><i data-lucide="file-text" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-bold">บิลล่าสุด</span></button>
            <button onclick="window.switchView('reports')" class="flex flex-col items-center p-2 ${viewName==='reports'?'text-blue-600':'text-gray-400'} transition-colors"><i data-lucide="bar-chart-2" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-bold">รายงาน</span></button>
            <button onclick="window.switchView('adminStock')" class="flex flex-col items-center p-2 ${viewName==='adminStock'?'text-blue-600':'text-gray-400'} transition-colors"><i data-lucide="database" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-bold">จัดการ</span></button>
          `;
        } else {
          navContainer.innerHTML = `
            <button onclick="window.switchView('list')" class="flex flex-col items-center p-2 ${viewName==='list'?'text-blue-600':'text-gray-400'} transition-colors"><i data-lucide="home" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-bold">ลูกค้า</span></button>
            <button onclick="window.switchView('historyAll')" class="flex flex-col items-center p-2 ${viewName==='historyAll'?'text-blue-600':'text-gray-400'} transition-colors"><i data-lucide="file-text" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-bold">บิลล่าสุด</span></button>
            <button onclick="window.switchView('stats')" class="flex flex-col items-center p-2 ${viewName==='stats'?'text-blue-600':'text-gray-400'} transition-colors"><i data-lucide="user" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-bold">โปรไฟล์ฉัน</span></button>
          `;
        }
      }

      if (['login', 'addCustomer', 'editCustomer', 'delivery', 'history', 'stockList'].includes(viewName)) {
        navContainer.classList.add('hidden');
      } else {
        navContainer.classList.remove('hidden');
      }

      window.render();
    };

    window.logout = function() {
      localStorage.removeItem('water_app_user_id');
      window.currentUser = null;
      window.switchView('login');
      window.showToast('ออกจากระบบแล้ว');
    };

    window.loginUser = function(e) {
      e.preventDefault();
      const userId = document.getElementById('login-user-select').value;
      const pin = document.getElementById('login-pin').value.trim();
      if (!userId || !pin) return;

      if (userId === SUPER_ADMIN_ACCOUNT.id) {
        if (pin === SUPER_ADMIN_ACCOUNT.pin) {
          window.currentUser = SUPER_ADMIN_ACCOUNT;
          localStorage.setItem('water_app_user_id', SUPER_ADMIN_ACCOUNT.id);
          window.showToast('เข้าสู่ระบบสิทธิ์สูงสุดสำเร็จ');
          window.switchView('list');
        } else {
          window.showToast('รหัส PIN ผู้ดูแลระบบสูงสุดไม่ถูกต้อง', 'error');
        }
        return;
      }

      const user = window.users.find(u => u.id === userId);
      if (user && user.pin === pin) {
        window.currentUser = user;
        localStorage.setItem('water_app_user_id', user.id);
        window.showToast(`ยินดีต้อนรับคุณ ${user.name}`);
        window.switchView('list');
      } else {
        window.showToast('รหัส PIN ไม่ถูกต้อง', 'error');
      }
    };

    window.saveStaff = async function(e) {
      e.preventDefault();
      if(!window.newUserName || !window.newUserPin) return window.showToast('กรุณากรอกข้อมูลให้ครบ', 'error');
      
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const originalText = submitBtn.innerText;
      submitBtn.innerHTML = '<div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>';
      submitBtn.disabled = true;

      try {
        if (window.editingUserId) {
          await updateDoc(doc(db, "users", window.editingUserId), { name: window.newUserName, pin: window.newUserPin, role: window.newUserRole });
          window.showToast('แก้ไขข้อมูลพนักงานสำเร็จ');
        } else {
          await addDoc(collection(db, "users"), { name: window.newUserName, pin: window.newUserPin, role: window.newUserRole });
          window.showToast('เพิ่มผู้ใช้งานสำเร็จ');
        }
        window.cancelEditStaff();
      } catch(error) { 
        window.showToast('เกิดข้อผิดพลาด', 'error'); 
        submitBtn.innerText = originalText; submitBtn.disabled = false;
      }
    };

    window.editStaff = function(id) {
      const u = window.users.find(x => x.id === id);
      if(!u) return;
      window.editingUserId = u.id; 
      window.newUserName = u.name; 
      window.newUserPin = u.pin; 
      window.newUserRole = u.role;
      window.render();
    };

    window.cancelEditStaff = function() {
      window.editingUserId = null; window.newUserName = ''; window.newUserPin = ''; window.newUserRole = 'staff';
      window.render();
    };

    window.deleteStaff = function(id) {
      if (id === window.currentUser.id) return window.showToast('ไม่สามารถลบบัญชีตัวเองได้', 'error');
      const u = window.users.find(x => x.id === id);
      if(!u) return;
      window.showModal('ลบพนักงาน?', `คุณต้องการลบผู้ใช้งานชื่อ "${u.name}" ใช่หรือไม่?`, 'ลบข้อมูล', true, async () => {
        try {
          await deleteDoc(doc(db, "users", id));
          window.showToast('ลบพนักงานสำเร็จ');
        } catch(error) { window.showToast('เกิดข้อผิดพลาดในการลบ', 'error'); }
      });
    };

    window.clearAllTransactions = function() {
      if(window.currentUser.role !== 'super_admin') return;
      
      const pass = prompt("โซนอันตรายเฉพาะผู้ดูแลระบบสูงสุด!\nกรุณาพิมพ์รหัส PIN '1617' เพื่อยืนยันการล้างประวัติบิลทั้งหมด:");
      if (pass !== "1617") {
        return window.showToast("รหัสยืนยันไม่ถูกต้อง ยกเลิกการทำรายการ", "error");
      }

      window.showModal('ยืนยันขั้นสุดท้าย?', 'รายการบิลที่ผ่านมาทั้งหมดจะถูกลบทิ้งอย่างถาวร (ยอดหนี้และสต๊อกลูกค้าปัจจุบันจะไม่หาย) คุณแน่ใจหรือไม่?', 'ล้างบิลทั้งหมด', true, async () => {
        window.showToast('กำลังล้างข้อมูลบิล กรุณารอสักครู่...');
        try {
          const batchArray = [];
          let currentBatch = writeBatch(db);
          let count = 0;

          for (const tx of window.transactions) {
            currentBatch.delete(doc(db, "transactions", tx.id));
            count++;
            if (count === 400) {
              batchArray.push(currentBatch);
              currentBatch = writeBatch(db);
              count = 0;
            }
          }
          if (count > 0) batchArray.push(currentBatch);
          for (const b of batchArray) await b.commit();
          window.showToast('ล้างประวัติบิลสำเร็จเรียบร้อย');
        } catch (error) { window.showToast('เกิดข้อผิดพลาดในการล้างข้อมูล', 'error'); }
      });
    };

    window.setGlobalStock = async function(item, val) {
      if(!['admin', 'super_admin'].includes(window.currentUser.role)) return;
      try { 
        const newVal = Math.max(0, safeNum(val));
        await setDoc(doc(db, "system", "global_stock"), { [item]: newVal }, { merge: true }); 
      } catch(e) { window.showToast('อัปเดตสต๊อกไม่สำเร็จ', 'error'); }
    };

    window.updateGlobalStock = async function(item, delta) {
      if(!['admin', 'super_admin'].includes(window.currentUser.role)) return;
      try { await setDoc(doc(db, "system", "global_stock"), { [item]: increment(delta) }, { merge: true }); } 
      catch(e) { window.showToast('อัปเดตสต๊อกไม่สำเร็จ', 'error'); }
    };

    window.setQty = function(targetObj, item, val) {
      window[targetObj][item] = Math.max(0, safeNum(val));
      window.render();
    };

    window.setOwnQty = function(field, val) {
      window[field] = Math.max(0, safeNum(val));
      window.render();
    };

    window.updateQty = function(targetObj, item, delta) {
      window[targetObj][item] = Math.max(0, safeNum(window[targetObj][item]) + delta);
      window.render();
    };

    window.updateOwnQty = function(field, delta) {
      window[field] = Math.max(0, safeNum(window[field]) + delta);
      window.render();
    };

    window.openAddCustomer = function() {
      window.formName = ''; window.formPhone = ''; 
      window.formZone = window.selectedZone === 'ทั้งหมด' ? '' : window.selectedZone;
      window.formDebt = 0; window.formStockOrange = 0; window.formStockPurple = 0; window.formStockCrate = 0; window.formStockOwnBottle = 0;
      window.selectedCustomerId = null;
      window.switchView('addCustomer');
    };

    window.openEditCustomer = function() {
      const cust = window.customers.find(c => c.id === window.selectedCustomerId);
      if (cust) {
        window.formName = cust.name;
        window.formPhone = cust.phone || '';
        window.formZone = cust.zone === 'อื่นๆ' ? '' : (cust.zone || '');
        window.formDebt = safeNum(cust.debt);
        window.formStockOrange = safeNum(cust.stockOrange);
        window.formStockPurple = safeNum(cust.stockPurple);
        window.formStockCrate = safeNum(cust.stockCrate);
        window.formStockOwnBottle = safeNum(cust.stockOwnBottle);
        window.switchView('editCustomer');
      } else {
        window.showToast('ไม่พบข้อมูลลูกค้า', 'error');
      }
    };

    window.deleteCustomer = function() {
      if(!['admin', 'super_admin'].includes(window.currentUser.role)) return window.showToast('เฉพาะผู้ดูแลระบบเท่านั้นที่ลบลูกค้าได้', 'error');
      const cust = window.customers.find(c => c.id === window.selectedCustomerId);
      if (!cust) return;
      window.showModal('ลบลูกค้ารายนี้?', `คุณต้องการลบรายชื่อ "${cust.name}" ใช่หรือไม่? (ประวัติบิลจะยังคงอยู่)`, 'ลบข้อมูล', true, async () => {
        try {
          await deleteDoc(doc(db, "customers", window.selectedCustomerId));
          window.showToast('ลบลูกค้าออกจากระบบแล้ว');
          window.switchView('list');
        } catch (error) { window.showToast('เกิดข้อผิดพลาดในการลบข้อมูล', 'error'); }
      });
    };

    window.saveCustomer = async function(e, isEdit) {
      e.preventDefault();
      const name = document.getElementById('form-name').value.trim();
      const phone = document.getElementById('form-phone').value.trim();
      const zone = document.getElementById('form-zone').value.trim() || 'อื่นๆ';
      if (!name) return;

      window.formName = name; window.formPhone = phone; window.formZone = zone;

    window.goToDelivery = function(custId) {
      window.selectedCustomerId = custId;
      window.deliveries = { orange: 0, purple: 0, crate: 0 };
      window.returns = { orange: 0, purple: 0, crate: 0 };
      window.ownTakeWash = 0; window.ownTakeRefill = 0; window.ownDeliverDone = 0;
      window.ownTakeUnpaid = 0; window.ownDeliverPayWash = 0; window.ownDeliverPayRefill = 0;
      window.ownBottlePayMode = 'pay_now'; 
      window.paymentStatus = 'paid'; window.txNote = '';
      window.switchView('delivery');
    };

    window.submitDelivery = async function() {
      const cust = window.customers.find(c => c.id === window.selectedCustomerId);
      if (!cust) return window.showToast('ไม่พบข้อมูลลูกค้า', 'error');

      const btn = document.getElementById('btn-submit-delivery');
      if(btn) btn.innerHTML = '<div class="w-6 h-6 border-2 border-white border-t-transparent rounded-full animate-spin"></div>';

      const factoryTotal = (window.deliveries.orange * window.prices.orange) + (window.deliveries.purple * window.prices.purple) + (window.deliveries.crate * window.prices.crate);
      const ownServiceTotal = (window.ownTakeWash * window.prices.ownWash) + (window.ownTakeRefill * window.prices.ownRefill) + (window.ownDeliverPayWash * window.prices.ownWash) + (window.ownDeliverPayRefill * window.prices.ownRefill);
      const calcTotal = factoryTotal + ownServiceTotal;
      
      const currentDebt = safeNum(cust.debt);
      let addedDebt = 0, amountCollected = 0, newDebt = currentDebt;

      if (window.paymentStatus === 'paid') {
        amountCollected = calcTotal + currentDebt; addedDebt = -currentDebt; newDebt = 0;
      } else if (window.paymentStatus === 'support') {
        amountCollected = 0; addedDebt = 0; newDebt = currentDebt;
      } else {
        amountCollected = 0; addedDebt = calcTotal; newDebt = currentDebt + addedDebt;
      }

      const calcStock = (old, del, ret) => Math.max(0, safeNum(old) + safeNum(del) - safeNum(ret));
      const newOrange = calcStock(cust.stockOrange, window.deliveries.orange, window.returns.orange);
      const newPurple = calcStock(cust.stockPurple, window.deliveries.purple, window.returns.purple);
      const newCrate = calcStock(cust.stockCrate, window.deliveries.crate, window.returns.crate);
      
      const newOwnBottle = Math.max(0, safeNum(cust.stockOwnBottle) 
        + safeNum(window.ownTakeWash) + safeNum(window.ownTakeRefill) + safeNum(window.ownTakeUnpaid) 
        - safeNum(window.ownDeliverDone) - safeNum(window.ownDeliverPayWash) - safeNum(window.ownDeliverPayRefill));

      try {
        const batch = writeBatch(db);
        batch.update(doc(db, "customers", cust.id), { debt: newDebt, stockOrange: newOrange, stockPurple: newPurple, stockCrate: newCrate, stockOwnBottle: newOwnBottle });

        const txRef = doc(collection(db, "transactions"));
        batch.set(txRef, {
          customerId: cust.id, customerName: cust.name, zone: cust.zone,
          deliveries: {...window.deliveries}, returns: {...window.returns}, 
          ownTakeWash: window.ownTakeWash, ownTakeRefill: window.ownTakeRefill, ownDeliverDone: window.ownDeliverDone,
          ownTakeUnpaid: window.ownTakeUnpaid, ownDeliverPayWash: window.ownDeliverPayWash, ownDeliverPayRefill: window.ownDeliverPayRefill,
          paymentStatus: window.paymentStatus, totalAmount: calcTotal, 
          amountCollected, addedDebt, status: 'active', timestamp: Date.now(),
          note: window.txNote, createdBy: window.currentUser.name
        });

        const stockRef = doc(db, "system", "global_stock");
        batch.set(stockRef, {
          orange: increment(-window.deliveries.orange), purple: increment(-window.deliveries.purple), crate: increment(-window.deliveries.crate)
        }, { merge: true });

        await batch.commit();
        window.showToast(`บันทึกการส่งให้ ${cust.name} เรียบร้อย!`);
        window.switchView('list');
      } catch (error) {
        window.showToast('บันทึกไม่สำเร็จ ตรวจสอบอินเทอร์เน็ต', 'error');
        if(btn) btn.innerText = 'บันทึกรายการ';
      }
    };

    window.voidTransaction = function(txId) {
      const tx = window.transactions.find(t => t.id === txId);
      if (!tx) return;

      window.showModal('ต้องการยกเลิกบิลนี้?', 'ระบบจะดึงสต๊อกและยอดหนี้กลับ (เฉพาะผู้ดูแลระบบ)', 'ยืนยันยกเลิกบิล', true, async () => {
        if(!['admin', 'super_admin'].includes(window.currentUser.role)) return window.showToast('สิทธิ์ไม่เพียงพอ แจ้งผู้ดูแลระบบเพื่อยกเลิก', 'error');

        try {
          const batch = writeBatch(db);
          const cust = window.customers.find(c => c.id === tx.customerId);
          
          if (cust) {
            const revOrange = Math.max(0, safeNum(cust.stockOrange) - safeNum(tx.deliveries?.orange) + safeNum(tx.returns?.orange));
            const revPurple = Math.max(0, safeNum(cust.stockPurple) - safeNum(tx.deliveries?.purple) + safeNum(tx.returns?.purple));
            const revCrate = Math.max(0, safeNum(cust.stockCrate) - safeNum(tx.deliveries?.crate) + safeNum(tx.returns?.crate));
            const revDebt = Math.max(0, safeNum(cust.debt) - safeNum(tx.addedDebt));
            const revOwn = Math.max(0, safeNum(cust.stockOwnBottle) 
              - safeNum(tx.ownTakeWash) - safeNum(tx.ownTakeRefill) - safeNum(tx.ownTakeUnpaid) 
              + safeNum(tx.ownDeliverDone) + safeNum(tx.ownDeliverPayWash) + safeNum(tx.ownDeliverPayRefill)
              + safeNum(tx.ownDeliverWash) + safeNum(tx.ownDeliverRefill) - safeNum(tx.ownReturn) 
            );
            
            batch.update(doc(db, "customers", cust.id), { debt: revDebt, stockOrange: revOrange, stockPurple: revPurple, stockCrate: revCrate, stockOwnBottle: revOwn });
          }
          
          batch.set(doc(db, "system", "global_stock"), {
            orange: increment(safeNum(tx.deliveries?.orange)), purple: increment(safeNum(tx.deliveries?.purple)), crate: increment(safeNum(tx.deliveries?.crate))
          }, { merge: true });

          batch.update(doc(db, "transactions", tx.id), { status: 'voided' });
          await batch.commit();

          window.showToast('ยกเลิกบิลและดึงสต๊อกกลับสำเร็จ');
          window.render();
        } catch (error) { window.showToast('เกิดข้อผิดพลาดในการยกเลิก', 'error'); }
      });
    };

    window.downloadExcelRange = function() {
      const startDateVal = document.getElementById('export-start-date').value;
      const endDateVal = document.getElementById('export-end-date').value;

      if (!startDateVal || !endDateVal) return window.showToast("กรุณาเลือกช่วงเวลาให้ครบถ้วน", "error");

      const startTimestamp = new Date(startDateVal + "T00:00:00").getTime();
      const endTimestamp = new Date(endDateVal + "T23:59:59").getTime();

      if (startTimestamp > endTimestamp) return window.showToast("วันที่เริ่มต้นต้องไม่มากกว่าสิ้นสุด", "error");

      const txList = window.transactions.filter(t => t.timestamp >= startTimestamp && t.timestamp <= endTimestamp);
      if(txList.length === 0) return window.showToast("ไม่มีบิลในช่วงเวลานี้", "error");

      const headers = [
        'วันที่และเวลา', 'ชื่อลูกค้า', 'โซน', 'พนักงานที่ส่ง', 'สถานะบิล', 'การจ่ายเงิน', 
        'ส่งน้ำ(ส้ม)', 'รับคืน(ส้ม)', 'ส่งน้ำ(ม่วง)', 'รับคืน(ม่วง)', 'ส่งน้ำ(ลัง)', 'รับคืน(ลัง)', 
        'รับมาทำ(จ่ายเลย5฿)', 'รับมาทำ(จ่ายเลย15฿)', 'รับมาทำ(ยังไม่เก็บเงิน)', 
        'ส่งคืน(เก็บเงิน5฿)', 'ส่งคืน(เก็บเงิน15฿)', 'ส่งคืน(จ่ายเงินแล้ว)',
        'ยอดบิลรวม(บาท)', 'เงินสดที่เก็บ(บาท)', 'ค้างจ่ายเพิ่ม(บาท)', 'หมายเหตุ'
      ];
      
      const rows = txList.map(tx => {
        const paymentStr = tx.paymentStatus === 'paid' ? 'จ่ายแล้ว' : (tx.paymentStatus === 'support' ? 'สนับสนุน(ฟรี)' : 'ค้างจ่าย');
        return [
          `"${window.formatDate(tx.timestamp)}"`, `"${tx.customerName}"`, `"${tx.zone}"`, `"${tx.createdBy || '-'}"`, 
          tx.status === 'voided' ? 'ยกเลิก' : 'ปกติ', paymentStr,
          safeNum(tx.deliveries?.orange), safeNum(tx.returns?.orange), safeNum(tx.deliveries?.purple), safeNum(tx.returns?.purple), safeNum(tx.deliveries?.crate), safeNum(tx.returns?.crate), 
          (safeNum(tx.ownTakeWash) + safeNum(tx.ownDeliverWash)), (safeNum(tx.ownTakeRefill) + safeNum(tx.ownDeliverRefill)), safeNum(tx.ownTakeUnpaid),
          safeNum(tx.ownDeliverPayWash), safeNum(tx.ownDeliverPayRefill), (safeNum(tx.ownDeliverDone) + safeNum(tx.ownReturn)),
          safeNum(tx.totalAmount), safeNum(tx.amountCollected), safeNum(tx.addedDebt), `"${tx.note || ''}"`
        ].join(',');
      });

      const blob = new Blob(['\uFEFF' + headers.join(',') + '\n' + rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a'); link.href = url; link.download = `รายงานส่งน้ำ_${startDateVal}_ถึง_${endDateVal}.csv`; link.click(); URL.revokeObjectURL(url);
      window.showToast('ดาวน์โหลดไฟล์ Excel สำเร็จ');
    };

      const zc = document.getElementById('zone-scroll-container');
      if (zc) window.lastZoneScroll = zc.scrollLeft;

      const container = document.getElementById('app-container');

          el.focus();
          try { if (cursorStart !== null && cursorEnd !== null) el.setSelectionRange(cursorStart, cursorEnd); } catch(e) {}

    function renderTxCardHtml(tx, showCustomerName) {

      const rO = safeNum(tx.returns?.orange); const rP = safeNum(tx.returns?.purple); const rC = safeNum(tx.returns?.crate);
      
      const oTW = safeNum(tx.ownTakeWash); 
      const oTR = safeNum(tx.ownTakeRefill); 
      const oDD = safeNum(tx.ownDeliverDone);
      const oTU = safeNum(tx.ownTakeUnpaid);
      const oDPW = safeNum(tx.ownDeliverPayWash);
      const oDPR = safeNum(tx.ownDeliverPayRefill);

      let statusBadge = '';
      if (tx.status === 'voided') statusBadge = `<span class="text-[10px] bg-red-100 text-red-600 px-2 py-0.5 rounded-md font-bold inline-block">ยกเลิกแล้ว</span>`;
      else if (tx.paymentStatus === 'paid') statusBadge = `<span class="text-[10px] bg-green-100 text-green-700 px-2 py-0.5 rounded-md font-bold inline-block">จ่ายแล้ว</span>`;
      else if (tx.paymentStatus === 'support') statusBadge = `<span class="text-[10px] bg-pink-100 text-pink-700 px-2 py-0.5 rounded-md font-bold inline-block">สนับสนุน(ฟรี)</span>`;
      else statusBadge = `<span class="text-[10px] bg-orange-100 text-orange-700 px-2 py-0.5 rounded-md font-bold inline-block">ค้างจ่าย</span>`;

      let moneyStr = '';

      else moneyStr = `<span class="${safeNum(tx.addedDebt) > 0 ? 'text-red-500' : 'text-blue-600'}">${safeNum(tx.amountCollected) > 0 ? `เก็บสด ${safeNum(tx.amountCollected)} ฿` : `ค้าง ${safeNum(tx.addedDebt)} ฿`}</span>`;

      return `
        <div class="p-4 rounded-3xl shadow-sm border transition-all ${tx.status === 'voided' ? 'bg-gray-100 border-gray-200 opacity-60' : 'bg-white border-gray-100'}">
          <div class="flex justify-between items-start mb-3 border-b border-gray-100 pb-3">
            <div>
              ${showCustomerName ? `<h4 class="font-bold text-blue-900 mb-1 flex items-center"><i data-lucide="user" class="w-3.5 h-3.5 mr-1"></i> ${tx.customerName}</h4>` : ''}
              <p class="text-sm font-bold text-gray-500 flex items-center"><i data-lucide="history" class="w-3.5 h-3.5 mr-1"></i> ${window.formatDate(tx.timestamp)}</p>
              <div class="flex gap-2 mt-1">
                ${statusBadge}
                <span class="text-[10px] bg-gray-100 text-gray-600 px-2 py-0.5 rounded-md font-bold inline-flex items-center"><i data-lucide="truck" class="w-3 h-3 mr-1"></i> ${tx.createdBy || 'ไม่ระบุ'}</span>
              </div>
            </div>
            ${tx.status !== 'voided' && ['admin', 'super_admin'].includes(window.currentUser.role) ? `<button onclick="window.voidTransaction('${tx.id}')" class="text-red-500 text-[10px] font-bold flex items-center bg-red-50 px-2.5 py-1.5 rounded-lg active:bg-red-100 border border-red-100"><i data-lucide="trash-2" class="w-3 h-3 mr-1"></i> Void</button>` : ''}
          </div>
          
          <div class="grid grid-cols-2 gap-x-2 gap-y-3 text-xs text-gray-600">
            <div>
              <p class="font-semibold text-[10px] text-gray-400 mb-1 uppercase tracking-wider">ส่งน้ำ</p>
              ${dO > 0 ? `<p class="flex justify-between"><span>ส้ม</span> <span>${dO}</span></p>` : ''}
              ${dP > 0 ? `<p class="flex justify-between"><span>ม่วง</span> <span>${dP}</span></p>` : ''}
              ${dC > 0 ? `<p class="flex justify-between"><span>ลัง</span> <span>${dC}</span></p>` : ''}
              ${dO===0&&dP===0&&dC===0 ? `<p class="text-gray-300">-</p>` : ''}
            </div>
            <div>
              <p class="font-semibold text-[10px] text-gray-400 mb-1 uppercase tracking-wider">รับคืนเปล่า</p>
              ${rO > 0 ? `<p class="flex justify-between"><span>ส้ม</span> <span>${rO}</span></p>` : ''}
              ${rP > 0 ? `<p class="flex justify-between"><span>ม่วง</span> <span>${rP}</span></p>` : ''}
              ${rC > 0 ? `<p class="flex justify-between"><span>ลัง</span> <span>${rC}</span></p>` : ''}
              ${rO===0&&rP===0&&rC===0 ? `<p class="text-gray-300">-</p>` : ''}
            </div>
            ${(oTW>0 || oTR>0 || oDD>0 || oTU>0 || oDPW>0 || oDPR>0) ? `
              <div class="col-span-2 pt-2 border-t border-gray-50">
                <p class="font-semibold text-[10px] text-indigo-400 mb-1 uppercase tracking-wider flex items-center"><i data-lucide="archive" class="w-3 h-3 mr-1"></i> ถังส่วนตัวลูกค้า</p>
                ${oTW > 0 ? `<p class="flex justify-between text-indigo-700"><span>รับมา (จ่ายเลย 5฿)</span> <span>${oTW}</span></p>` : ''}
                ${oTR > 0 ? `<p class="flex justify-between text-indigo-700"><span>รับมา (จ่ายเลย 15฿)</span> <span>${oTR}</span></p>` : ''}

                ${oDD > 0 ? `<p class="flex justify-between text-gray-500"><span>ส่งคืน (เสร็จแล้ว)</span> <span>${oDD}</span></p>` : ''}
                ${oDPW > 0 ? `<p class="flex justify-between text-indigo-700"><span>ส่งคืน (เก็บ 5฿)</span> <span>${oDPW}</span></p>` : ''}

              </div>

          ${tx.note ? `<div class="mt-3 bg-yellow-50 text-yellow-800 p-2 rounded-lg text-[11px] font-medium border border-yellow-100 flex items-start"><i data-lucide="message-square" class="w-3.5 h-3.5 mr-1.5 mt-0.5 shrink-0 text-yellow-600"></i> ${tx.note}</div>` : ''}

            ${moneyStr}
          </div>
        </div>
      `;
    }

    function renderReports(container) {
      if(!['admin', 'super_admin'].includes(window.currentUser.role)) return;

      const d = new Date();
      let startDate = 0;
      let endDate = Date.now();

      if (window.reportPeriod === 'day') {
        startDate = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
      } else if (window.reportPeriod === 'week') { 
        const wd = new Date(d); wd.setDate(d.getDate() - d.getDay()); wd.setHours(0,0,0,0); startDate = wd.getTime(); 
      } else if (window.reportPeriod === 'month') {
        startDate = new Date(d.getFullYear(), d.getMonth(), 1).getTime();
      } else if (window.reportPeriod === 'year') {
        startDate = new Date(d.getFullYear(), 0, 1).getTime();
      }

      const txForReport = window.transactions.filter(t => t.timestamp >= startDate && t.timestamp <= endDate);
      const validTx = txForReport.filter(t => t.status !== 'voided');

      const stats = validTx.reduce((acc, tx) => {
        if (tx.paymentStatus === 'support') {
          acc.support += safeNum(tx.totalAmount);
        } else {
          acc.rev += safeNum(tx.amountCollected); 
          acc.debt += safeNum(tx.addedDebt) > 0 ? safeNum(tx.addedDebt) : 0;
        }

        acc.dO += safeNum(tx.deliveries?.orange); acc.dP += safeNum(tx.deliveries?.purple); acc.dC += safeNum(tx.deliveries?.crate);
        acc.rO += safeNum(tx.returns?.orange); acc.rP += safeNum(tx.returns?.purple); acc.rC += safeNum(tx.returns?.crate);
        
        acc.oW += safeNum(tx.ownTakeWash) + safeNum(tx.ownDeliverPayWash);
        acc.oR += safeNum(tx.ownTakeRefill) + safeNum(tx.ownDeliverPayRefill);
        acc.oRet += safeNum(tx.ownDeliverDone);
        acc.oTU += safeNum(tx.ownTakeUnpaid);
        
        const creator = tx.createdBy || 'ไม่ระบุ';
        acc.staffCash[creator] = (acc.staffCash[creator] || 0) + safeNum(tx.amountCollected);

        return acc;
      }, { rev: 0, debt: 0, support: 0, dO: 0, dP: 0, dC: 0, rO: 0, rP: 0, rC: 0, oW: 0, oR: 0, oRet: 0, oTU: 0, staffCash: {} });

      const totalDel = stats.dO + stats.dP + stats.dC;

      const staffCashHTML = Object.keys(stats.staffCash).map(name => `

          <span class="text-base font-black text-green-700">${stats.staffCash[name].toLocaleString()} ฿</span>

      const activeCustomers = window.customers.filter(c => safeNum(c.debt) > 0 || safeNum(c.stockOrange) > 0 || safeNum(c.stockPurple) > 0 || safeNum(c.stockCrate) > 0 || safeNum(c.stockOwnBottle) > 0)
        .sort((a, b) => safeNum(b.debt) - safeNum(a.debt));

      const totalCurrentDebt = activeCustomers.reduce((sum, c) => sum + safeNum(c.debt), 0);
      const tO = activeCustomers.reduce((sum, c) => sum + safeNum(c.stockOrange), 0);
      const tP = activeCustomers.reduce((sum, c) => sum + safeNum(c.stockPurple), 0);
      const tC = activeCustomers.reduce((sum, c) => sum + safeNum(c.stockCrate), 0);
      const tOwn = activeCustomers.reduce((sum, c) => sum + safeNum(c.stockOwnBottle), 0);

      container.innerHTML = `
        <div class="p-4 max-w-md mx-auto pb-24">
          <div class="mb-6 flex items-end justify-between bg-blue-600 text-white p-5 rounded-b-3xl shadow-md -mt-4 -mx-4 pt-8">
            <div><h1 class="text-2xl font-black tracking-tight">รายงานและบัญชี</h1></div>

            <h3 class="text-sm font-bold text-gray-800 mb-3 flex items-center"><i data-lucide="calendar" class="w-4 h-4 mr-2 text-blue-500"></i> โหลดข้อมูลเข้า Excel</h3>
            <div class="grid grid-cols-2 gap-2 mb-3">

                <label class="text-[10px] font-bold text-gray-400 ml-1">ตั้งแต่วันที่</label>

              <button onclick="window.reportPeriod='${p}'; window.render();" class="flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${window.reportPeriod === p ? 'bg-white text-blue-700 shadow-sm' : 'text-gray-500'}">

              <span class="text-gray-500 text-[10px] font-bold mb-1 flex items-center uppercase"><i data-lucide="check-circle" class="w-3 h-3 mr-1 text-green-500"></i> เงินสด</span>
              <span class="text-lg font-black text-green-600">${stats.rev.toLocaleString()}</span>
            </div>
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-center items-center text-center">
              <span class="text-gray-500 text-[10px] font-bold mb-1 flex items-center uppercase"><i data-lucide="alert-circle" class="w-3 h-3 mr-1 text-red-500"></i> ค้างจ่าย</span>
              <span class="text-lg font-black text-red-500">${stats.debt.toLocaleString()}</span>
            </div>
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-center items-center text-center">
              <span class="text-gray-500 text-[10px] font-bold mb-1 flex items-center uppercase"><i data-lucide="gift" class="w-3 h-3 mr-1 text-pink-500"></i> สนับสนุน</span>
              <span class="text-lg font-black text-pink-500">${stats.support.toLocaleString()}</span>

          <div class="bg-green-50 p-5 rounded-3xl shadow-sm border border-green-100 mb-4">
            <h3 class="font-bold text-green-900 mb-3 flex items-center">

              <div>

                    <span class="font-bold text-red-500 text-sm shrink-0">${safeNum(c.debt) > 0 ? `${safeNum(c.debt).toLocaleString()} ฿` : '0 ฿'}</span>
                  </div>
                  <div class="flex gap-1.5 text-[9px] font-bold flex-wrap">
                    ${safeNum(c.stockOrange) > 0 ? `<span class="flex items-center text-orange-600 bg-orange-100/50 px-1 rounded"><i data-lucide="droplet" class="w-2.5 h-2.5 mr-0.5"></i> ${c.stockOrange}</span>` : ''}
                    ${safeNum(c.stockPurple) > 0 ? `<span class="flex items-center text-purple-600 bg-purple-100/50 px-1 rounded"><i data-lucide="droplet" class="w-2.5 h-2.5 mr-0.5"></i> ${c.stockPurple}</span>` : ''}
                    ${safeNum(c.stockCrate) > 0 ? `<span class="flex items-center text-amber-700 bg-amber-100/50 px-1 rounded"><i data-lucide="package" class="w-2.5 h-2.5 mr-0.5"></i> ${c.stockCrate}</span>` : ''}
                    ${safeNum(c.stockOwnBottle) > 0 ? `<span class="flex items-center text-indigo-600 bg-indigo-100/50 px-1 rounded border border-indigo-200/50"><i data-lucide="archive" class="w-2.5 h-2.5 mr-0.5"></i> ส่วนตัว ${c.stockOwnBottle}</span>` : ''}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderStats(container) {
      if(!window.currentUser || ['admin', 'super_admin'].includes(window.currentUser.role)) return; 

      const d = new Date();
      d.setHours(0,0,0,0);
      const startOfDay = d.getTime();
      
      const myTx = window.transactions.filter(t => t.createdBy === window.currentUser.name && t.timestamp >= startOfDay && t.status !== 'voided');
      const myCash = myTx.reduce((acc, t) => acc + safeNum(t.amountCollected), 0);
      const mySupport = myTx.reduce((acc, t) => acc + (t.paymentStatus === 'support' ? safeNum(t.totalAmount) : 0), 0);
      const myDels = myTx.reduce((acc, t) => acc + safeNum(t.deliveries?.orange) + safeNum(t.deliveries?.purple) + safeNum(t.deliveries?.crate), 0);
      const myOwn = myTx.reduce((acc, t) => acc + safeNum(t.ownTakeWash) + safeNum(t.ownTakeRefill) + safeNum(t.ownTakeUnpaid) + safeNum(t.ownDeliverDone) + safeNum(t.ownDeliverPayWash) + safeNum(t.ownDeliverPayRefill), 0);
      const myReturns = myTx.reduce((acc, t) => acc + safeNum(t.returns?.orange) + safeNum(t.returns?.purple) + safeNum(t.returns?.crate), 0);

      container.innerHTML = `
        <div class="p-4 max-w-md mx-auto pb-24">
          <div class="mb-6 flex items-end bg-indigo-600 text-white p-5 rounded-b-3xl shadow-md -mt-4 -mx-4 pt-8">
            <div><h1 class="text-2xl font-black tracking-tight flex items-center"><i data-lucide="user" class="w-6 h-6 mr-2"></i> โปรไฟล์ของฉัน</h1></div>
          </div>
          
          <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 mb-4 text-center relative overflow-hidden">
            <div class="w-20 h-20 bg-indigo-50 text-indigo-600 rounded-full mx-auto flex items-center justify-center mb-3 border-4 border-white shadow-sm"><i data-lucide="user" class="w-10 h-10"></i></div>
            <h2 class="font-black text-2xl text-gray-800">${window.currentUser.name}</h2>
            <p class="text-sm font-bold text-gray-400 mb-5">พนักงานส่งน้ำ</p>
            
            <div class="bg-gray-50 rounded-2xl p-4 mb-5 border border-gray-100 text-left">
              <p class="text-xs font-bold text-gray-500 mb-2 text-center border-b border-gray-200 pb-2">ผลงานของฉันวันนี้</p>
              
              <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-bold text-gray-700">เงินที่ต้องส่งโรงงาน:</span>
                <span class="text-xl font-black text-green-600">${myCash.toLocaleString()} ฿</span>
              </div>
              
              <div class="flex justify-between items-center mb-2 pb-2 border-b border-gray-200">
                <span class="text-sm font-bold text-gray-700">สนับสนุน (ให้ฟรี):</span>
                <span class="text-lg font-black text-pink-500">${mySupport.toLocaleString()} ฿</span>
              </div>
              
              <div class="flex justify-between items-center mb-1">
                <span class="text-xs font-bold text-gray-600"><i data-lucide="droplet" class="w-3 h-3 inline mr-1 text-blue-500"></i>น้ำโรงงาน (ส่งแล้ว):</span>
                <span class="text-sm font-black text-blue-600">${myDels} ถัง/ลัง</span>
              </div>
              
              <div class="flex justify-between items-center mb-1">
                <span class="text-xs font-bold text-gray-600"><i data-lucide="check-circle" class="w-3 h-3 inline mr-1 text-gray-400"></i>น้ำโรงงาน (รับคืน):</span>
                <span class="text-sm font-black text-gray-600">${myReturns} ถัง/ลัง</span>
              </div>

              <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-gray-600"><i data-lucide="archive" class="w-3 h-3 inline mr-1 text-indigo-500"></i>ถังส่วนตัว (รับมา/ส่งคืน):</span>
                <span class="text-sm font-black text-indigo-600">${myOwn} ใบ</span>
              </div>
            </div>

            <button onclick="window.logout()" class="w-full py-3.5 bg-red-50 text-red-600 rounded-2xl font-bold text-sm active:bg-red-100 transition-colors">ออกจากระบบ</button>
          </div>
        </div>
      `;
    }

    function renderAdminStock(container) {
      if(!['admin', 'super_admin'].includes(window.currentUser.role)) {
        window.switchView('list'); return;
      }

      container.innerHTML = `
        <div class="p-4 max-w-md mx-auto pb-24">
          <div class="mb-6 flex items-end bg-slate-800 text-white p-5 rounded-b-3xl shadow-md -mt-4 -mx-4 pt-8 justify-between">
            <div><h1 class="text-2xl font-black tracking-tight flex items-center"><i data-lucide="database" class="w-6 h-6 mr-2"></i> จัดการโรงงาน</h1><p class="text-xs text-slate-300 font-bold mt-1">บทบาท: ${window.currentUser.name}</p></div>
            <button onclick="window.logout()" class="p-2 bg-red-500/20 text-red-300 rounded-xl hover:bg-red-500/40"><i data-lucide="log-out" class="w-5 h-5"></i></button>
          </div>

          <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 mb-4">
            <div class="flex justify-between items-center mb-4">
              <h3 class="font-bold text-gray-800 flex items-center"><i data-lucide="package-check" class="w-5 h-5 mr-2 text-blue-600"></i> สต๊อกพร้อมขาย (กลาง)</h3>
            </div>
            <p class="text-[10px] text-gray-400 mb-3 leading-tight bg-gray-50 p-2 rounded-lg">* เมื่อพนักงานกดบันทึกการส่งน้ำ ยอดในสต๊อกนี้จะถูกหักออกอัตโนมัติ</p>
            <div class="space-y-3">
              ${['orange', 'purple', 'crate'].map(item => `
                <div class="flex justify-between items-center p-3 rounded-2xl border ${item==='orange'?'bg-orange-50/50 border-orange-100':item==='purple'?'bg-purple-50/50 border-purple-100':'bg-amber-50/50 border-amber-100'}">
                  <div class="flex items-center font-bold text-sm ${item==='orange'?'text-orange-700':item==='purple'?'text-purple-700':'text-amber-800'}">
                    <i data-lucide="${item==='crate'?'package':'droplet'}" class="w-5 h-5 mr-2"></i> ${item==='orange'?'ถังส้ม':item==='purple'?'ถังม่วง':'แบบลัง'}
                  </div>
                  <div class="flex items-center gap-1">
                    <button onclick="window.updateGlobalStock('${item}', -1)" class="w-8 h-8 rounded-full bg-white shadow-sm flex items-center justify-center text-gray-600 active:scale-95 shrink-0"><i data-lucide="minus" class="w-4 h-4"></i></button>
                    <input type="number" id="global-stock-${item}" inputmode="numeric" pattern="[0-9]*" value="${window.globalStock[item] || 0}" onchange="window.setGlobalStock('${item}', this.value)" onfocus="this.select()" class="w-14 text-center font-black text-2xl text-gray-800 bg-transparent border-none p-0 focus:ring-0 outline-none" />
                    <button onclick="window.updateGlobalStock('${item}', 1)" class="w-8 h-8 rounded-full bg-white shadow-sm flex items-center justify-center text-gray-600 active:scale-95 shrink-0"><i data-lucide="plus" class="w-4 h-4"></i></button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
            <h3 class="font-bold text-gray-800 mb-4 flex items-center"><i data-lucide="users" class="w-5 h-5 mr-2 text-indigo-600"></i> จัดการพนักงาน</h3>
            
            <form onsubmit="window.saveStaff(event)" class="mb-4 bg-indigo-50 p-4 rounded-2xl border ${window.editingUserId ? 'border-indigo-400 shadow-md' : 'border-indigo-100'}">
              <div class="flex justify-between items-center mb-2">
                <h4 class="text-xs font-bold text-indigo-800">${window.editingUserId ? 'แก้ไขข้อมูลพนักงาน' : 'เพิ่มพนักงานใหม่'}</h4>
                ${window.editingUserId ? `<button type="button" onclick="window.cancelEditStaff()" class="text-[10px] text-red-500 font-bold bg-red-100 px-2 py-0.5 rounded active:bg-red-200">ยกเลิก</button>` : ''}
              </div>
              <div class="grid grid-cols-2 gap-2 mb-2">
                <input type="text" id="staff-name-input" value="${window.newUserName}" oninput="window.newUserName=this.value;" placeholder="ชื่อเล่น/ชื่อจริง" class="px-3 py-2 rounded-xl border border-white focus:outline-none text-sm font-bold shadow-sm outline-none" required>
                <input type="password" id="staff-pin-input" pattern="[0-9]*" inputmode="numeric" value="${window.newUserPin}" oninput="window.newUserPin=this.value;" placeholder="PIN 4 หลัก" class="px-3 py-2 rounded-xl border border-white focus:outline-none text-sm font-bold shadow-sm text-center tracking-widest outline-none" required>
              </div>
              <div class="flex gap-2">
                <select id="staff-role-input" onchange="window.newUserRole=this.value; window.render();" class="flex-1 px-3 py-2 rounded-xl border border-white text-sm font-bold shadow-sm text-gray-600 bg-white outline-none">
                  <option value="staff" ${window.newUserRole==='staff'?'selected':''}>พนักงาน (Staff)</option>
                  <option value="admin" ${window.newUserRole==='admin'?'selected':''}>แอดมิน (Admin)</option>
                </select>
                <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-xl font-bold text-sm shadow-md active:scale-95 w-20 flex justify-center items-center">${window.editingUserId ? 'บันทึก' : 'เพิ่ม'}</button>
              </div>
            </form>

            <div class="space-y-2">
              <div class="flex justify-between items-center py-2.5 px-3 bg-red-50/60 rounded-xl border border-red-100">
                <div>
                  <span class="font-black text-red-900 text-sm">👑 ผู้ดูแลระบบสูงสุด</span>
                </div>
                <span class="text-[10px] font-mono text-gray-400 border bg-white px-2 py-0.5 rounded">PIN: ****</span>
              </div>

              ${window.users.map(u => `
                <div class="flex justify-between items-center py-2 px-3 bg-gray-50 rounded-xl border ${window.editingUserId === u.id ? 'border-indigo-400 bg-indigo-50' : 'border-gray-100'}">
                  <div>
                    <span class="font-bold text-gray-800 text-sm">${u.name}</span>
                    <span class="text-[10px] ml-2 px-2 py-0.5 rounded-full font-bold ${u.role === 'admin' ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'}">${u.role === 'admin' ? 'Admin' : 'Staff'}</span>
                  </div>
                  <div class="flex items-center gap-2">
                    <span class="text-[10px] font-mono text-gray-400 mr-1 border bg-white px-1.5 rounded">PIN: ${u.role === 'admin' && window.currentUser.role !== 'super_admin' ? '****' : u.pin}</span>
                    <button onclick="window.editStaff('${u.id}')" class="p-1.5 bg-blue-50 text-blue-600 rounded-lg active:bg-blue-100"><i data-lucide="edit-3" class="w-3.5 h-3.5"></i></button>
                    <button onclick="window.deleteStaff('${u.id}')" class="p-1.5 bg-red-50 text-red-600 rounded-lg active:bg-red-100"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          ${window.currentUser.role === 'super_admin' ? `
          <div class="bg-red-50 p-5 rounded-3xl shadow-sm border border-red-100 mt-4">
            <h3 class="font-bold text-red-800 mb-2 flex items-center"><i data-lucide="alert-triangle" class="w-5 h-5 mr-2"></i> โซนล้างข้อมูล (Super Admin)</h3>
            <p class="text-xs text-red-600 mb-4 font-medium leading-relaxed">การกระทำนี้จะทำการ <b class="font-black text-red-800">"ล้างประวัติบิลทั้งหมดในอดีต"</b> ออกจากระบบอย่างถาวร เพื่อเคลียร์พื้นที่ <br>*(ยอดค้างชำระปัจจุบัน และรายชื่อลูกค้า จะไม่หายไป)*</p>
            <button onclick="window.clearAllTransactions()" class="w-full bg-red-600 text-white font-bold py-3.5 rounded-2xl shadow-md active:scale-95 transition-transform flex justify-center items-center"><i data-lucide="trash-2" class="w-4 h-4 mr-2"></i> ล้างประวัติบิลทั้งหมด</button>
          </div>
          ` : ''}
        </div>
      `;
    }
  </script>
</body>
</html>
