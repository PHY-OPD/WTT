<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบส่งน้ำดื่ม</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    button, input, select { -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    #toast {
      transform: translate(-50%, -150px);
      opacity: 0;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
    }
  </style>
</head>
<body class="bg-gray-100 font-sans text-gray-900 min-h-screen relative pb-20 selection:bg-blue-200">

  <!-- Loading Screen (โชว์ตอนกำลังดึงข้อมูลจาก Firebase) -->
  <div id="loading-screen" class="fixed inset-0 bg-white z-[60] flex flex-col items-center justify-center transition-opacity duration-500">
    <div class="w-12 h-12 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mb-4"></div>
    <p class="text-blue-800 font-bold">กำลังเชื่อมต่อฐานข้อมูล...</p>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-4 left-1/2 z-50 px-6 py-3 rounded-full shadow-2xl font-bold flex items-center text-white pointer-events-none">
    <span id="toast-icon" class="mr-2 flex items-center"></span>
    <span id="toast-msg" class="text-sm"></span>
  </div>

  <!-- App Container -->
  <div id="app-container" class="max-w-md mx-auto min-h-screen relative"></div>

  <!-- Bottom Navigation -->
  <div id="bottom-nav" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 pb-safe pt-2 px-6 shadow-[0_-5px_10px_-5px_rgba(0,0,0,0.05)] max-w-md mx-auto z-40 flex justify-around items-center hidden">
    <button onclick="window.switchView('list')" id="nav-list" class="flex flex-col items-center p-2 text-blue-600 transition-colors">
      <i data-lucide="home" class="w-6 h-6 mb-1"></i>
      <span class="text-[10px] font-bold">ลูกค้า</span>
    </button>
    <button onclick="window.switchView('historyAll')" id="nav-historyAll" class="flex flex-col items-center p-2 text-gray-400 transition-colors">
      <i data-lucide="file-text" class="w-6 h-6 mb-1"></i>
      <span class="text-[10px] font-bold">บิลล่าสุด</span>
    </button>
    <button onclick="window.switchView('reports')" id="nav-reports" class="flex flex-col items-center p-2 text-gray-400 transition-colors">
      <i data-lucide="bar-chart-2" class="w-6 h-6 mb-1"></i>
      <span class="text-[10px] font-bold">รายงาน</span>
    </button>
    <button onclick="window.switchView('stats')" id="nav-stats" class="flex flex-col items-center p-2 text-gray-400 transition-colors">
      <i data-lucide="trending-up" class="w-6 h-6 mb-1"></i>
      <span class="text-[10px] font-bold">สถิติ</span>
    </button>
  </div>

  <!-- Modal Confirmation -->
  <div id="confirm-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm hidden">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl">
      <h3 id="modal-title" class="font-bold text-xl mb-2 text-gray-800"></h3>
      <p id="modal-msg" class="text-gray-600 mb-6 leading-relaxed text-sm"></p>
      <div class="flex gap-3">
        <button onclick="window.closeModal()" class="flex-1 bg-gray-100 text-gray-700 py-3.5 rounded-xl font-bold active:bg-gray-200 transition-colors">ยกเลิก</button>
        <button id="modal-confirm-btn" class="flex-1 text-white py-3.5 rounded-xl font-bold active:scale-95 transition-transform bg-blue-600 flex justify-center items-center">
          <span id="modal-btn-text">ยืนยัน</span>
          <div id="modal-spinner" class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin hidden ml-2"></div>
        </button>
      </div>
    </div>
  </div>

  <!-- FIREBASE MODULE SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // ตั้งค่า Firebase ตามที่คุณให้มา
    const firebaseConfig = {
      apiKey: "AIzaSyADKt7-BEYafDN7gx16CCnMah_BKV-GJmQ",
      authDomain: "wttt-c46a5.firebaseapp.com",
      projectId: "wttt-c46a5",
      storageBucket: "wttt-c46a5.firebasestorage.app",
      messagingSenderId: "372907513409",
      appId: "1:372907513409:web:3501b786049ecdd20d18c0",
      measurementId: "G-DY53QB2KBR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Global State
    window.customers = [];
    window.transactions = [];
    window.currentView = 'list';
    window.selectedZone = 'ทั้งหมด';
    window.searchQuery = '';
    window.reportPeriod = 'day';
    window.selectedCustomerId = null;

    window.deliveries = { orange: 0, purple: 0, crate: 0 };
    window.returns = { orange: 0, purple: 0, crate: 0 };
    window.paymentStatus = 'paid';

    window.formName = '';
    window.formPhone = '';
    window.formZone = '';

    window.prices = { orange: 15, purple: 15, crate: 30 };

    let isCustomersLoaded = false;
    let isTransactionsLoaded = false;

    // --- Firebase Listeners (ดึงข้อมูล Real-time) ---
    onSnapshot(collection(db, "customers"), (snapshot) => {
      window.customers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      isCustomersLoaded = true;
      checkLoading();
      window.render();
    });

    onSnapshot(collection(db, "transactions"), (snapshot) => {
      window.transactions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      isTransactionsLoaded = true;
      checkLoading();
      window.render();
    });

    function checkLoading() {
      if (isCustomersLoaded && isTransactionsLoaded) {
        const loader = document.getElementById('loading-screen');
        if (loader && !loader.classList.contains('hidden')) {
          loader.style.opacity = '0';
          setTimeout(() => {
            loader.classList.add('hidden');
            document.getElementById('bottom-nav').classList.remove('hidden');
          }, 500);
        }
      }
    }

    // --- Helper Functions ---
    const safeNum = (val) => (isNaN(Number(val)) ? 0 : Number(val));
    window.safeNum = safeNum;

    window.formatDate = (ts) => {
      if (!ts) return '-';
      try {
        const d = new Date(ts);
        if (isNaN(d.getTime())) return '-';
        const dd = String(d.getDate()).padStart(2, '0');
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const yy = (d.getFullYear() + 543).toString().slice(-2);
        const hr = String(d.getHours()).padStart(2, '0');
        const mn = String(d.getMinutes()).padStart(2, '0');
        return `${dd}/${mm}/${yy} ${hr}:${mn}`;
      } catch(e) { return '-'; }
    };

    let toastTimer = null;
    window.showToast = function(message, type = 'success') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      const toastIcon = document.getElementById('toast-icon');

      if (toastTimer) clearTimeout(toastTimer);

      toastMsg.innerText = message;
      toast.className = `fixed top-4 left-1/2 z-50 px-6 py-3 rounded-full shadow-2xl font-bold flex items-center text-white pointer-events-none ${type === 'error' ? 'bg-red-500' : 'bg-green-600'}`;
      toastIcon.innerHTML = type === 'error' ? '<i data-lucide="alert-circle" class="w-5 h-5"></i>' : '<i data-lucide="check-circle" class="w-5 h-5"></i>';
      lucide.createIcons();

      toast.style.transform = 'translate(-50%, 0)';
      toast.style.opacity = '1';

      toastTimer = setTimeout(() => {
        toast.style.transform = 'translate(-50%, -150px)';
        toast.style.opacity = '0';
      }, 2500);
    }

    let confirmCallback = null;
    window.showModal = function(title, msg, confirmText, danger, onConfirm) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-title').className = `font-bold text-xl mb-2 ${danger ? 'text-red-600' : 'text-gray-800'}`;
      document.getElementById('modal-msg').innerText = msg;
      
      const btn = document.getElementById('modal-confirm-btn');
      document.getElementById('modal-btn-text').innerText = confirmText;
      btn.className = `flex-1 text-white py-3.5 rounded-xl font-bold active:scale-95 transition-transform flex justify-center items-center ${danger ? 'bg-red-500' : 'bg-blue-600'}`;
      
      confirmCallback = onConfirm;
      document.getElementById('confirm-modal').classList.remove('hidden');
    }

    window.closeModal = function() {
      document.getElementById('confirm-modal').classList.add('hidden');
      document.getElementById('modal-spinner').classList.add('hidden');
      document.getElementById('modal-btn-text').classList.remove('hidden');
      confirmCallback = null;
    }

    document.getElementById('modal-confirm-btn').addEventListener('click', async () => {
      if (confirmCallback) {
        document.getElementById('modal-spinner').classList.remove('hidden');
        document.getElementById('modal-btn-text').classList.add('hidden');
        await confirmCallback();
      }
      window.closeModal();
    });

    window.switchView = function(viewName, custId = null) {
      window.currentView = viewName;
      if (custId) window.selectedCustomerId = custId;

      const navs = ['list', 'historyAll', 'reports', 'stats'];
      navs.forEach(n => {
        const btn = document.getElementById(`nav-${n}`);
        if (btn) {
          btn.className = (n === viewName)
            ? "flex flex-col items-center p-2 text-blue-600 transition-colors"
            : "flex flex-col items-center p-2 text-gray-400 transition-colors";
        }
      });

      const navContainer = document.getElementById('bottom-nav');
      if (['addCustomer', 'editCustomer', 'delivery', 'history', 'stockList'].includes(viewName)) {
        navContainer.classList.add('hidden');
      } else {
        navContainer.classList.remove('hidden');
      }

      window.render();
    }

    // --- Firebase Actions (เพิ่ม/แก้ไข/ลบ ข้อมูลในฐานข้อมูล) ---
    window.saveCustomer = async function(e, isEdit) {
      e.preventDefault();
      const name = document.getElementById('form-name').value.trim();
      const phone = document.getElementById('form-phone').value.trim();
      const zone = document.getElementById('form-zone').value.trim() || 'อื่นๆ';

      if (!name) return;

      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.innerHTML = '<div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>';
      submitBtn.disabled = true;

      try {
        if (isEdit) {
          await updateDoc(doc(db, "customers", window.selectedCustomerId), {
            name, phone, zone
          });
          window.showToast('อัปเดตข้อมูลลูกค้าเรียบร้อยแล้ว');
        } else {
          await addDoc(collection(db, "customers"), {
            name, phone, zone, debt: 0, stockOrange: 0, stockPurple: 0, stockCrate: 0
          });
          window.showToast('เพิ่มลูกค้าใหม่เรียบร้อยแล้ว');
        }
        window.selectedZone = zone;
        window.searchQuery = '';
        window.switchView('list');
      } catch (error) {
        window.showToast('เกิดข้อผิดพลาดในการบันทึก', 'error');
        submitBtn.innerText = 'บันทึกข้อมูล';
        submitBtn.disabled = false;
      }
    }

    window.deleteCustomer = function() {
      const cust = window.customers.find(c => c.id === window.selectedCustomerId);
      if (!cust) return;

      window.showModal('ลบลูกค้ารายนี้?', `คุณต้องการลบรายชื่อ "${cust.name}" ออกจากระบบใช่หรือไม่? (ประวัติการส่งจะยังคงอยู่)`, 'ลบข้อมูล', true, async () => {
        try {
          await deleteDoc(doc(db, "customers", window.selectedCustomerId));
          window.showToast('ลบลูกค้ารายนี้ออกจากระบบแล้ว');
          window.switchView('list');
        } catch (error) {
          window.showToast('เกิดข้อผิดพลาดในการลบข้อมูล', 'error');
        }
      });
    }

    window.submitDelivery = async function() {
      const cust = window.customers.find(c => c.id === window.selectedCustomerId);
      if (!cust) return;

      const btn = document.getElementById('btn-submit-delivery');
      if(btn) {
        btn.innerHTML = '<div class="w-6 h-6 border-2 border-white border-t-transparent rounded-full animate-spin"></div>';
        btn.disabled = true;
      }

      const calcTotal = (window.deliveries.orange * window.prices.orange) + (window.deliveries.purple * window.prices.purple) + (window.deliveries.crate * window.prices.crate);
      const currentDebt = safeNum(cust.debt);
      let addedDebt = 0, amountCollected = 0, newDebt = currentDebt;

      if (window.paymentStatus === 'paid') {
        amountCollected = calcTotal + currentDebt; addedDebt = -currentDebt; newDebt = 0;
      } else {
        addedDebt = calcTotal; newDebt = currentDebt + addedDebt;
      }

      const calcStock = (old, del, ret) => Math.max(0, safeNum(old) + safeNum(del) - safeNum(ret));
      const newOrange = calcStock(cust.stockOrange, window.deliveries.orange, window.returns.orange);
      const newPurple = calcStock(cust.stockPurple, window.deliveries.purple, window.returns.purple);
      const newCrate = calcStock(cust.stockCrate, window.deliveries.crate, window.returns.crate);

      try {
        await updateDoc(doc(db, "customers", cust.id), {
          debt: newDebt, stockOrange: newOrange, stockPurple: newPurple, stockCrate: newCrate
        });

        await addDoc(collection(db, "transactions"), {
          customerId: cust.id, customerName: cust.name, zone: cust.zone,
          deliveries: {...window.deliveries}, returns: {...window.returns}, 
          paymentStatus: window.paymentStatus, totalAmount: calcTotal, 
          amountCollected, addedDebt, status: 'active', timestamp: Date.now()
        });

        window.showToast(`บันทึกการส่งให้ ${cust.name} เรียบร้อย!`);
        window.switchView('list');
      } catch (error) {
        window.showToast('บันทึกไม่สำเร็จ ตรวจสอบอินเทอร์เน็ต', 'error');
        if(btn) { btn.innerText = 'บันทึกรายการ'; btn.disabled = false; }
      }
    }

    window.voidTransaction = function(txId) {
      const tx = window.transactions.find(t => t.id === txId);
      if (!tx) return;

      window.showModal('ต้องการยกเลิกบิลนี้?', 'สต๊อก ถัง/ลัง และยอดหนี้จะถูกดึงกลับไปเหมือนก่อนบันทึกบิลนี้ คุณแน่ใจหรือไม่?', 'ยืนยันยกเลิกบิล', true, async () => {
        try {
          const cust = window.customers.find(c => c.id === tx.customerId);
          if (cust) {
            const revOrange = Math.max(0, safeNum(cust.stockOrange) - safeNum(tx.deliveries?.orange) + safeNum(tx.returns?.orange));
            const revPurple = Math.max(0, safeNum(cust.stockPurple) - safeNum(tx.deliveries?.purple) + safeNum(tx.returns?.purple));
            const revCrate = Math.max(0, safeNum(cust.stockCrate) - safeNum(tx.deliveries?.crate) + safeNum(tx.returns?.crate));
            const revDebt = Math.max(0, safeNum(cust.debt) - safeNum(tx.addedDebt));
            
            await updateDoc(doc(db, "customers", cust.id), {
              debt: revDebt, stockOrange: revOrange, stockPurple: revPurple, stockCrate: revCrate
            });
          }
          await updateDoc(doc(db, "transactions", tx.id), { status: 'voided' });
          window.showToast('ยกเลิกบิลสำเร็จ สต๊อกและหนี้ถูกดึงกลับแล้ว');
        } catch (error) {
          window.showToast('เกิดข้อผิดพลาดในการยกเลิก', 'error');
        }
      });
    }

    // --- Render Engine ---
    window.render = function() {
      const container = document.getElementById('app-container');
      if (!container) return; // ป้องกันตอนที่หน้าจอยังโหลดไม่เสร็จ
      
      if (window.currentView === 'list') renderList(container);
      else if (window.currentView === 'addCustomer' || window.currentView === 'editCustomer') renderCustomerForm(container);
      else if (window.currentView === 'delivery') renderDelivery(container);
      else if (window.currentView === 'history') renderHistory(container);
      else if (window.currentView === 'historyAll') renderHistoryAll(container);
      else if (window.currentView === 'reports') renderReports(container);
      else if (window.currentView === 'stats') renderStats(container);
      else if (window.currentView === 'stockList') renderStockList(container);

      lucide.createIcons();
    }

    // Component Renderers
    function renderList(container) {
      const allZones = window.customers.map(c => c.zone || 'อื่นๆ');
      const uniqueZones = ['ทั้งหมด', ...[...new Set(allZones)].filter(z => z !== 'อื่นๆ').sort(), 'อื่นๆ'];

      let filtered = [...window.customers].sort((a, b) => a.name.localeCompare(b.name, 'th'));
      if (window.selectedZone !== 'ทั้งหมด') filtered = filtered.filter(c => c.zone === window.selectedZone);
      if (window.searchQuery.trim()) {
        const q = window.searchQuery.toLowerCase();
        filtered = filtered.filter(c => c.name.toLowerCase().includes(q) || (c.zone || '').toLowerCase().includes(q) || (c.phone || '').includes(q));
      }

      let zoneButtonsHtml = '';
      if (!window.searchQuery && uniqueZones.length > 1) {
        zoneButtonsHtml = `
          <div class="flex overflow-x-auto gap-2 mb-4 pb-2 -mx-4 px-4 no-scrollbar">
            ${uniqueZones.map(z => `
              <button onclick="window.selectedZone='${z}'; window.render();" class="px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap shadow-sm transition-colors ${window.selectedZone === z ? 'bg-blue-600 text-white' : 'bg-white text-gray-500 border border-gray-200'}">${z}</button>
            `).join('')}
          </div>
        `;
      }

      let customerListHtml = '';
      if (filtered.length === 0) {
        customerListHtml = `<div class="text-center py-10 bg-white rounded-2xl border border-gray-100"><p class="text-gray-500">ไม่มีข้อมูลลูกค้า</p></div>`;
      } else {
        customerListHtml = filtered.map(cust => `
          <div onclick="window.goToDelivery('${cust.id}')" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center active:scale-[0.98] transition-transform cursor-pointer relative overflow-hidden">
            ${safeNum(cust.debt) > 0 ? `<div class="absolute left-0 top-0 bottom-0 w-1 bg-red-500"></div>` : ''}
            <div class="pl-1">
              <h3 class="font-bold text-lg text-gray-800 flex items-center">${cust.name}</h3>
              <div class="flex items-center gap-2 mt-1 flex-wrap">
                ${(window.selectedZone === 'ทั้งหมด' || window.searchQuery) && cust.zone && cust.zone !== 'อื่นๆ' ? `<span class="text-[11px] text-blue-600 bg-blue-50 px-2 py-0.5 rounded-md flex items-center font-semibold"><i data-lucide="map-pin" class="w-2.5 h-2.5 mr-1"></i> ${cust.zone}</span>` : ''}
                ${cust.phone ? `<a href="tel:${cust.phone}" onclick="event.stopPropagation()" class="text-[11px] text-green-700 bg-green-50 px-2 py-0.5 rounded-md flex items-center font-semibold border border-green-100"><i data-lucide="phone-call" class="w-2.5 h-2.5 mr-1"></i> โทร</a>` : ''}
              </div>
              <div class="flex gap-3 text-xs mt-2 text-gray-500 font-semibold bg-gray-50 px-2 py-1.5 rounded-lg w-fit">
                <span class="flex items-center"><i data-lucide="droplet" class="w-3.5 h-3.5 text-orange-500 mr-1"></i> ${safeNum(cust.stockOrange)}</span>
                <span class="flex items-center"><i data-lucide="droplet" class="w-3.5 h-3.5 text-purple-500 mr-1"></i> ${safeNum(cust.stockPurple)}</span>
                <span class="flex items-center"><i data-lucide="package" class="w-3.5 h-3.5 text-amber-700 mr-1"></i> ${safeNum(cust.stockCrate)}</span>
              </div>
            </div>
            <div class="text-right flex flex-col items-end justify-center">
              ${safeNum(cust.debt) > 0 ? `<span class="text-red-600 font-bold text-sm bg-red-50 px-2.5 py-1 rounded-lg mb-1 shadow-sm">ค้าง ${safeNum(cust.debt)} ฿</span>` : `<span class="text-green-600 font-bold text-sm bg-green-50 px-2.5 py-1 rounded-lg mb-1">ปกติ</span>`}
              <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300 mt-1"></i>
            </div>
          </div>
        `).join('');
      }

      container.innerHTML = `
        <div class="p-4 pb-24">
          <div class="mb-4 flex justify-between items-end bg-white p-4 rounded-b-3xl shadow-sm -mt-4 -mx-4 pt-6">
            <div>
              <h1 class="text-2xl font-black text-blue-900 tracking-tight">ระบบส่งน้ำดื่ม</h1>
              <p class="text-sm text-gray-500 font-medium mt-1">${new Date().toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' })}</p>
            </div>
            <div class="bg-blue-100 text-blue-800 p-3 rounded-2xl"><i data-lucide="droplet" class="w-6 h-6"></i></div>
          </div>

          <div class="relative mb-4">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i data-lucide="search" class="w-4 h-4 text-gray-400"></i></div>
            <input type="text" id="search-input" value="${window.searchQuery}" oninput="window.searchQuery=this.value; window.render();" placeholder="ค้นหาชื่อ, โซน หรือเบอร์โทร..." class="w-full pl-10 pr-10 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm text-sm" />
            ${window.searchQuery ? `<button onclick="window.searchQuery=''; window.render();" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400"><i data-lucide="x" class="w-4 h-4"></i></button>` : ''}
          </div>

          <div class="mb-3 flex justify-between items-center">
            <h2 class="text-gray-800 font-bold flex items-center text-lg"><i data-lucide="user" class="w-5 h-5 mr-2 text-blue-500"></i> รายชื่อลูกค้า</h2>

    function renderReports(container) {
      const d = new Date();
      let startDate = 0;
      if (window.reportPeriod === 'day') startDate = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
      else if (window.reportPeriod === 'week') { const wd = new Date(d); wd.setDate(d.getDate() - d.getDay()); wd.setHours(0,0,0,0); startDate = wd.getTime(); }
      else if (window.reportPeriod === 'month') startDate = new Date(d.getFullYear(), d.getMonth(), 1).getTime();
      else if (window.reportPeriod === 'year') startDate = new Date(d.getFullYear(), 0, 1).getTime();

      const txForReport = window.transactions.filter(t => t.timestamp >= startDate);
      const validTx = txForReport.filter(t => t.status !== 'voided');

      const stats = validTx.reduce((acc, tx) => {
        acc.rev += safeNum(tx.amountCollected); 
        acc.debt += safeNum(tx.addedDebt) > 0 ? safeNum(tx.addedDebt) : 0;
        acc.dO += safeNum(tx.deliveries?.orange); acc.dP += safeNum(tx.deliveries?.purple); acc.dC += safeNum(tx.deliveries?.crate);
        acc.rO += safeNum(tx.returns?.orange); acc.rP += safeNum(tx.returns?.purple); acc.rC += safeNum(tx.returns?.crate);
        return acc;
      }, { rev: 0, debt: 0, dO: 0, dP: 0, dC: 0, rO: 0, rP: 0, rC: 0 });

      const totalDel = stats.dO + stats.dP + stats.dC;

      const activeCustomers = window.customers.filter(c => safeNum(c.debt) > 0 || safeNum(c.stockOrange) > 0 || safeNum(c.stockPurple) > 0 || safeNum(c.stockCrate) > 0)
        .sort((a, b) => safeNum(b.debt) - safeNum(a.debt));

      const totalCurrentDebt = activeCustomers.reduce((sum, c) => sum + safeNum(c.debt), 0);
      const totalCurrentOrange = activeCustomers.reduce((sum, c) => sum + safeNum(c.stockOrange), 0);
      const totalCurrentPurple = activeCustomers.reduce((sum, c) => sum + safeNum(c.stockPurple), 0);

            </div>
            <div class="bg-white p-4 rounded-3xl shadow-sm border border-gray-100 flex flex-col justify-center">
              <span class="text-gray-500 text-xs font-bold mb-1 flex items-center"><i data-lucide="alert-circle" class="w-3 h-3 mr-1 text-red-500"></i> ค้างจ่ายเพิ่ม</span>

              <div>

                <div class="w-full bg-gray-100 rounded-full h-2 overflow-hidden flex"><div class="bg-orange-500 h-2 transition-all duration-500" style="width: ${totalDel ? (stats.dO/totalDel)*100 : 0}%"></div></div>

                  </div>
                  <div class="flex gap-2 text-[10px] font-bold">
                    ${safeNum(c.stockOrange) > 0 ? `<span class="flex items-center text-orange-600"><i data-lucide="droplet" class="w-3 h-3 mr-0.5"></i> ส้ม ${c.stockOrange}</span>` : ''}
                    ${safeNum(c.stockPurple) > 0 ? `<span class="flex items-center text-purple-600"><i data-lucide="droplet" class="w-3 h-3 mr-0.5"></i> ม่วง ${c.stockPurple}</span>` : ''}
                    ${safeNum(c.stockCrate) > 0 ? `<span class="flex items-center text-amber-700"><i data-lucide="package" class="w-3 h-3 mr-0.5"></i> ลัง ${c.stockCrate}</span>` : ''}
                    ${safeNum(c.stockOrange) === 0 && safeNum(c.stockPurple) === 0 && safeNum(c.stockCrate) === 0 ? `<span class="text-gray-400">ไม่มี ถัง/ลัง ค้าง</span>` : ''}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderStats(container) {
      const totalDebt = window.customers.reduce((s, c) => s + safeNum(c.debt), 0);
      const topDebtors = [...window.customers].filter(c => safeNum(c.debt) > 0).sort((a, b) => safeNum(b.debt) - safeNum(a.debt)).slice(0, 5);
      const totalOrange = window.customers.reduce((s, c) => s + safeNum(c.stockOrange), 0);
      const totalPurple = window.customers.reduce((s, c) => s + safeNum(c.stockPurple), 0);
      const totalCrate = window.customers.reduce((s, c) => s + safeNum(c.stockCrate), 0);

      container.innerHTML = `
        <div class="p-4 max-w-md mx-auto pb-24">
          <div class="mb-6 flex items-end bg-indigo-600 text-white p-5 rounded-b-3xl shadow-md -mt-4 -mx-4 pt-8">
            <div><h1 class="text-2xl font-black tracking-tight flex items-center"><i data-lucide="trending-up" class="w-6 h-6 mr-2"></i> สถิติระบบ</h1></div>
          </div>
          <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 mb-4 flex items-center justify-between">
            <div><span class="text-gray-500 text-sm font-bold flex items-center mb-1"><i data-lucide="credit-card" class="w-4 h-4 mr-1 text-red-500"></i> หนี้สะสมในตลาดรวม</span><span class="text-3xl font-black text-red-600">${totalDebt.toLocaleString()} <span class="text-base font-bold">บาท</span></span></div>
          </div>
          <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 mb-4">
            <h3 class="font-bold text-gray-800 mb-4 flex items-center"><i data-lucide="alert-circle" class="w-4.5 h-4.5 mr-2 text-indigo-500"></i> 5 อันดับลูกค้าค้างจ่ายสูงสุด</h3>
            <div class="space-y-2">
              ${topDebtors.length === 0 ? `<p class="text-sm text-gray-400 text-center py-4">ไม่มีลูกค้ายอดค้างชำระ 🎉</p>` : topDebtors.map((c, i) => `
                <div onclick="window.goToDelivery('${c.id}')" class="flex justify-between items-center py-3 px-2 border-b border-gray-50 last:border-0 active:bg-gray-50 rounded-xl cursor-pointer transition-colors">
                  <div class="flex items-center"><span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold mr-3 shadow-sm ${i===0?'bg-red-100 text-red-600':i===1?'bg-orange-100 text-orange-600':'bg-gray-100 text-gray-500'}">${i + 1}</span><span class="text-sm font-bold text-gray-700">${c.name}</span></div>
                  <div class="flex items-center"><span class="text-red-500 font-bold mr-2">${safeNum(c.debt).toLocaleString()} ฿</span><i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i></div>
                </div>
              `).join('')}
            </div>
          </div>
          <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 mb-4">
            <div class="flex justify-between items-center mb-4">
              <h3 class="font-bold text-gray-800 flex items-center"><i data-lucide="award" class="w-4.5 h-4.5 mr-2 text-indigo-500"></i> ถัง/ลัง คงค้างบ้านลูกค้า</h3>
              <button onclick="window.switchView('stockList')" class="text-[10px] text-indigo-600 font-bold bg-indigo-50 px-3 py-1.5 rounded-lg flex items-center active:bg-indigo-100 transition-colors">ดูรายบ้าน <i data-lucide="chevron-right" class="w-3 h-3 ml-1"></i></button>
            </div>
            <div class="grid grid-cols-3 gap-3 text-center">
              <div class="bg-orange-50 p-3 rounded-2xl"><span class="block text-xs font-bold text-orange-600 mb-1">ถังส้ม</span><span class="text-xl font-black text-orange-700">${totalOrange}</span></div>
              <div class="bg-purple-50 p-3 rounded-2xl"><span class="block text-xs font-bold text-purple-600 mb-1">ถังม่วง</span><span class="text-xl font-black text-purple-700">${totalPurple}</span></div>
              <div class="bg-amber-50 p-3 rounded-2xl"><span class="block text-xs font-bold text-amber-700 mb-1">แบบลัง</span><span class="text-xl font-black text-amber-800">${totalCrate}</span></div>
            </div>
          </div>
        </div>
      `;
    }

    function renderStockList(container) {
      const customersWithStock = window.customers.filter(c => safeNum(c.stockOrange) > 0 || safeNum(c.stockPurple) > 0 || safeNum(c.stockCrate) > 0)
        .sort((a, b) => (safeNum(b.stockOrange)+safeNum(b.stockPurple)+safeNum(b.stockCrate)) - (safeNum(a.stockOrange)+safeNum(a.stockPurple)+safeNum(a.stockCrate)));

      container.innerHTML = `
        <div class="p-4 max-w-md mx-auto pb-24">
          <div class="flex items-center mb-6 pt-2">
            <button onclick="window.switchView('stats')" class="p-2 mr-2 bg-white rounded-full shadow-sm text-gray-600 active:bg-gray-100"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
            <div><h2 class="font-bold text-xl text-gray-800">รายละเอียดค้าง ถัง/ลัง</h2><p class="text-sm text-gray-500">แยกรายบ้านลูกค้า</p></div>
          </div>
          <div class="space-y-3">
            ${customersWithStock.length === 0 ? `<div class="text-center py-10 bg-white rounded-2xl border border-gray-100"><p class="text-gray-500">ไม่มี ถัง/ลัง ค้างที่ลูกค้า</p></div>` : customersWithStock.map(cust => `
              <div onclick="window.goToDelivery('${cust.id}')" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center active:scale-95 transition-transform cursor-pointer">
                <div>
                  <h3 class="font-bold text-gray-800 text-base">${cust.name}</h3>
                  <div class="flex gap-3 text-xs mt-2 text-gray-500 font-semibold bg-gray-50 px-2 py-1.5 rounded-lg w-fit">
                    ${safeNum(cust.stockOrange) > 0 ? `<span class="flex items-center"><i data-lucide="droplet" class="w-3.5 h-3.5 text-orange-500 mr-1"></i> ${cust.stockOrange}</span>` : ''}
                    ${safeNum(cust.stockPurple) > 0 ? `<span class="flex items-center"><i data-lucide="droplet" class="w-3.5 h-3.5 text-purple-500 mr-1"></i> ${cust.stockPurple}</span>` : ''}
                    ${safeNum(cust.stockCrate) > 0 ? `<span class="flex items-center"><i data-lucide="package" class="w-3.5 h-3.5 text-amber-700 mr-1"></i> ${cust.stockCrate}</span>` : ''}
                  </div>
                </div>
                <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderTxCardHtml(tx, showCustomerName) {
      const dO = safeNum(tx.deliveries?.orange); const dP = safeNum(tx.deliveries?.purple); const dC = safeNum(tx.deliveries?.crate);
      const rO = safeNum(tx.returns?.orange); const rP = safeNum(tx.returns?.purple); const rC = safeNum(tx.returns?.crate);

      return `
        <div class="p-4 rounded-3xl shadow-sm border transition-all ${tx.status === 'voided' ? 'bg-gray-100 border-gray-200 opacity-60' : 'bg-white border-gray-100'}">
          <div class="flex justify-between items-start mb-3 border-b border-gray-100 pb-3">
            <div>
              ${showCustomerName ? `<h4 class="font-bold text-blue-900 mb-1 flex items-center"><i data-lucide="user" class="w-3.5 h-3.5 mr-1"></i> ${tx.customerName}</h4>` : ''}
              <p class="text-sm font-bold text-gray-500 flex items-center"><i data-lucide="history" class="w-3.5 h-3.5 mr-1"></i> ${formatDate(tx.timestamp)}</p>
              ${tx.status === 'voided' ? `<span class="text-[10px] bg-red-100 text-red-600 px-2 py-0.5 rounded-md font-bold mt-1 inline-block">ยกเลิกแล้ว</span>` : `<span class="text-[10px] px-2 py-0.5 rounded-md font-bold mt-1 inline-block ${tx.paymentStatus === 'paid' ? 'bg-green-100 text-green-700' : 'bg-orange-100 text-orange-700'}">${tx.paymentStatus === 'paid' ? 'จ่ายแล้ว' : 'ค้างจ่าย'}</span>`}
            </div>
            ${tx.status !== 'voided' ? `<button onclick="window.voidTransaction('${tx.id}')" class="text-red-500 text-xs font-bold flex items-center bg-red-50 px-2.5 py-1.5 rounded-lg active:bg-red-100"><i data-lucide="trash-2" class="w-3 h-3 mr-1"></i> ยกเลิกบิล</button>` : ''}
          </div>
          <div class="grid grid-cols-2 gap-2 text-sm text-gray-600">
            <div>
              <p class="font-semibold text-xs text-gray-400 mb-1">รายการส่ง</p>
              ${dO > 0 ? `<p class="flex justify-between"><span>ส้ม</span> <span>${dO} ถัง</span></p>` : ''}
              ${dP > 0 ? `<p class="flex justify-between"><span>ม่วง</span> <span>${dP} ถัง</span></p>` : ''}
              ${dC > 0 ? `<p class="flex justify-between"><span>ลัง</span> <span>${dC} ลัง</span></p>` : ''}
              ${dO===0&&dP===0&&dC===0 ? `<p class="text-gray-400">-</p>` : ''}
            </div>
            <div>
              <p class="font-semibold text-xs text-gray-400 mb-1">รับคืน</p>
              ${rO > 0 ? `<p class="flex justify-between"><span>ส้ม</span> <span>${rO} ถัง</span></p>` : ''}
              ${rP > 0 ? `<p class="flex justify-between"><span>ม่วง</span> <span>${rP} ถัง</span></p>` : ''}
              ${rC > 0 ? `<p class="flex justify-between"><span>ลัง</span> <span>${rC} ลัง</span></p>` : ''}
              ${rO===0&&rP===0&&rC===0 ? `<p class="text-gray-400">-</p>` : ''}
            </div>
          </div>
          <div class="mt-3 pt-3 border-t border-gray-50 flex justify-between items-center font-bold">
            <span class="text-gray-500 text-sm">ยอดเงิน/หนี้:</span>
            <span class="${safeNum(tx.addedDebt) > 0 ? 'text-red-500' : 'text-blue-600'}">${safeNum(tx.amountCollected) > 0 ? `เก็บเงิน ${safeNum(tx.amountCollected)} ฿` : `ค้างเพิ่ม ${safeNum(tx.addedDebt)} ฿`}</span>
          </div>
        </div>
      `;
    }

    // Attach to Window for inline HTML onclick handlers
    window.downloadExcel = downloadExcel;

    // --- Firebase Initialization (ES Module) ---
  </script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyADKt7-BEYafDN7gx16CCnMah_BKV-GJmQ",
      authDomain: "wttt-c46a5.firebaseapp.com",
      projectId: "wttt-c46a5",
      storageBucket: "wttt-c46a5.firebasestorage.app",
      messagingSenderId: "372907513409",
      appId: "1:372907513409:web:3501b786049ecdd20d18c0",
      measurementId: "G-DY53QB2KBR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let isCustomersLoaded = false;
    let isTransactionsLoaded = false;

    // --- Firebase Listeners (ดึงข้อมูล Real-time) ---
    onSnapshot(collection(db, "customers"), (snapshot) => {
      window.customers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      isCustomersLoaded = true;
      checkLoading();
    });

    onSnapshot(collection(db, "transactions"), (snapshot) => {
      window.transactions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      isTransactionsLoaded = true;
      checkLoading();
    });

    function checkLoading() {
      if (isCustomersLoaded && isTransactionsLoaded) {
        const loader = document.getElementById('loading-screen');
        if (loader && !loader.classList.contains('hidden')) {
          loader.style.opacity = '0';
          setTimeout(() => {
            loader.classList.add('hidden');
            document.getElementById('bottom-nav').classList.remove('hidden');
            window.render();
          }, 500);
        } else {
          window.render();
        }
      }
    }

    // --- Firebase Database Functions ---
    window.saveCustomer = async function(e, isEdit) {
      e.preventDefault();
      const name = document.getElementById('form-name').value.trim();
      const phone = document.getElementById('form-phone').value.trim();
      const zone = document.getElementById('form-zone').value.trim() || 'อื่นๆ';

      if (!name) return;

      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.innerHTML = '<div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>';
      submitBtn.disabled = true;

      try {
        if (isEdit) {
          await updateDoc(doc(db, "customers", window.selectedCustomerId), { name, phone, zone });
          window.showToast('อัปเดตข้อมูลลูกค้าเรียบร้อยแล้ว');
        } else {
          await addDoc(collection(db, "customers"), { name, phone, zone, debt: 0, stockOrange: 0, stockPurple: 0, stockCrate: 0 });
          window.showToast('เพิ่มลูกค้าใหม่เรียบร้อยแล้ว');
        }
        window.selectedZone = zone;
        window.searchQuery = '';
        window.switchView('list');
      } catch (error) {
        window.showToast('เกิดข้อผิดพลาดในการบันทึก', 'error');
        submitBtn.innerText = 'บันทึกข้อมูล';
        submitBtn.disabled = false;
      }
    }

    window.deleteCustomer = function() {
      const cust = window.customers.find(c => c.id === window.selectedCustomerId);
      if (!cust) return;

      window.showModal('ลบลูกค้ารายนี้?', `คุณต้องการลบรายชื่อ "${cust.name}" ออกจากระบบใช่หรือไม่? (ประวัติการส่งจะยังคงอยู่)`, 'ลบข้อมูล', true, async () => {
        try {
          await deleteDoc(doc(db, "customers", window.selectedCustomerId));
          window.showToast('ลบลูกค้ารายนี้ออกจากระบบแล้ว');
          window.switchView('list');
        } catch (error) {
          window.showToast('เกิดข้อผิดพลาดในการลบข้อมูล', 'error');
        }
      });
    }

    window.submitDelivery = async function() {
      const cust = window.customers.find(c => c.id === window.selectedCustomerId);
      if (!cust) return;

      const btn = document.getElementById('btn-submit-delivery');
      if(btn) {
        btn.innerHTML = '<div class="w-6 h-6 border-2 border-white border-t-transparent rounded-full animate-spin"></div>';
        btn.disabled = true;
      }

      const calcTotal = (window.deliveries.orange * window.prices.orange) + (window.deliveries.purple * window.prices.purple) + (window.deliveries.crate * window.prices.crate);
      const currentDebt = safeNum(cust.debt);
      let addedDebt = 0, amountCollected = 0, newDebt = currentDebt;

      if (window.paymentStatus === 'paid') {
        amountCollected = calcTotal + currentDebt; addedDebt = -currentDebt; newDebt = 0;
      } else {
        addedDebt = calcTotal; newDebt = currentDebt + addedDebt;
      }

      const calcStock = (old, del, ret) => Math.max(0, safeNum(old) + safeNum(del) - safeNum(ret));
      const newOrange = calcStock(cust.stockOrange, window.deliveries.orange, window.returns.orange);
      const newPurple = calcStock(cust.stockPurple, window.deliveries.purple, window.returns.purple);
      const newCrate = calcStock(cust.stockCrate, window.deliveries.crate, window.returns.crate);

      try {
        await updateDoc(doc(db, "customers", cust.id), {
          debt: newDebt, stockOrange: newOrange, stockPurple: newPurple, stockCrate: newCrate
        });

        await addDoc(collection(db, "transactions"), {
          customerId: cust.id, customerName: cust.name, zone: cust.zone,
          deliveries: {...window.deliveries}, returns: {...window.returns}, 
          paymentStatus: window.paymentStatus, totalAmount: calcTotal, 
          amountCollected, addedDebt, status: 'active', timestamp: Date.now()
        });

        window.showToast(`บันทึกการส่งให้ ${cust.name} เรียบร้อย!`);
        window.switchView('list');
      } catch (error) {
        window.showToast('บันทึกไม่สำเร็จ ตรวจสอบอินเทอร์เน็ต', 'error');
        if(btn) { btn.innerText = 'บันทึกรายการ'; btn.disabled = false; }
      }
    }

    window.voidTransaction = function(txId) {
      const tx = window.transactions.find(t => t.id === txId);
      if (!tx) return;

      window.showModal('ต้องการยกเลิกบิลนี้?', 'สต๊อก ถัง/ลัง และยอดหนี้จะถูกดึงกลับไปเหมือนก่อนบันทึกบิลนี้ คุณแน่ใจหรือไม่?', 'ยืนยันยกเลิกบิล', true, async () => {
        try {
          const cust = window.customers.find(c => c.id === tx.customerId);
          if (cust) {
            const revOrange = Math.max(0, safeNum(cust.stockOrange) - safeNum(tx.deliveries?.orange) + safeNum(tx.returns?.orange));
            const revPurple = Math.max(0, safeNum(cust.stockPurple) - safeNum(tx.deliveries?.purple) + safeNum(tx.returns?.purple));
            const revCrate = Math.max(0, safeNum(cust.stockCrate) - safeNum(tx.deliveries?.crate) + safeNum(tx.returns?.crate));
            const revDebt = Math.max(0, safeNum(cust.debt) - safeNum(tx.addedDebt));
            
            await updateDoc(doc(db, "customers", cust.id), {
              debt: revDebt, stockOrange: revOrange, stockPurple: revPurple, stockCrate: revCrate
            });
          }
          await updateDoc(doc(db, "transactions", tx.id), { status: 'voided' });
          window.showToast('ยกเลิกบิลสำเร็จ สต๊อกและหนี้ถูกดึงกลับแล้ว');
        } catch (error) {
          window.showToast('เกิดข้อผิดพลาดในการยกเลิก', 'error');
        }
      });
    }
  </script>
</body>
</html>
