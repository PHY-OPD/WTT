<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบงาน โรงงานน้ำดื่ม แม่จว้า หมู่ 8</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    button, input, select { -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* ซ่อนลูกศรขึ้นลงในช่องกรอกตัวเลข (Input Number) */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    
    #toast {
      transform: translate(-50%, -150px);
      opacity: 0;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
    }
  </style>
</head>
<body class="bg-gray-100 font-sans text-gray-900 min-h-screen relative pb-20 selection:bg-blue-200">

  <!-- Loading Screen -->
  <div id="loading-screen" class="fixed inset-0 bg-white z-[60] flex flex-col items-center justify-center transition-opacity duration-500">
    <div class="w-12 h-12 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mb-4"></div>
    <p class="text-blue-800 font-bold">กำลังเชื่อมต่อฐานข้อมูล...</p>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-4 left-1/2 z-50 px-6 py-3 rounded-full shadow-2xl font-bold flex items-center text-white pointer-events-none w-max max-w-[90%]">
    <span id="toast-icon" class="mr-2 flex items-center shrink-0"></span>
    <span id="toast-msg" class="text-sm"></span>
  </div>

  <!-- App Container -->
  <div id="app-container" class="max-w-md mx-auto min-h-screen relative bg-gray-100"></div>

  <!-- Bottom Navigation -->
  <div id="bottom-nav" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 pb-safe pt-2 px-6 shadow-[0_-5px_10px_-5px_rgba(0,0,0,0.05)] max-w-md mx-auto z-40 flex justify-around items-center hidden">
  </div>

  <!-- Modal Confirmation -->
  <div id="confirm-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm hidden">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl">
      <h3 id="modal-title" class="font-bold text-xl mb-2 text-gray-800"></h3>
      <p id="modal-msg" class="text-gray-600 mb-6 leading-relaxed text-sm"></p>
      <div class="flex gap-3">
        <button onclick="window.closeModal()" class="flex-1 bg-gray-100 text-gray-700 py-3.5 rounded-xl font-bold active:bg-gray-200 transition-colors">ยกเลิก</button>
        <button id="modal-confirm-btn" class="flex-1 text-white py-3.5 rounded-xl font-bold active:scale-95 transition-transform bg-blue-600 flex justify-center items-center">
          <span id="modal-btn-text">ยืนยัน</span>
          <div id="modal-spinner" class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin hidden ml-2"></div>
        </button>
      </div>
    </div>
  </div>

  <!-- Firebase & App Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, writeBatch, increment, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyADKt7-BEYafDN7gx16CCnMah_BKV-GJmQ",
      authDomain: "wttt-c46a5.firebaseapp.com",
      projectId: "wttt-c46a5",
      storageBucket: "wttt-c46a5.firebasestorage.app",
      messagingSenderId: "372907513409",
      appId: "1:372907513409:web:3501b786049ecdd20d18c0",
      measurementId: "G-DY53QB2KBR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- Global State ---
    window.customers = [];
    window.transactions = [];
    window.users = []; 
    window.globalStock = { orange: 0, purple: 0, crate: 0 }; 
    window.currentUser = null; 

    window.currentView = 'loading';
    window.selectedZone = 'ทั้งหมด';
    window.searchQuery = '';
    window.reportPeriod = 'day';
    window.selectedCustomerId = null;

    // Delivery Form State (ปรับตัวแปรฝั่งถังส่วนตัวใหม่)
    window.deliveries = { orange: 0, purple: 0, crate: 0 };
    window.returns = { orange: 0, purple: 0, crate: 0 };
    window.ownTakeWash = 0;    // รับมาล้าง (คิดเงิน)
    window.ownTakeRefill = 0;  // รับมาล้าง+เติม (คิดเงิน)
    window.ownDeliverDone = 0; // ส่งคืน (ไม่คิดเงิน)
    window.paymentStatus = 'paid';
    window.txNote = '';

    // Customer Form State
    window.formName = ''; window.formPhone = ''; window.formZone = '';
    
    // User Form State
    window.editingUserId = null;
    window.newUserRole = 'staff'; window.newUserName = ''; window.newUserPin = '';

    // Export State
    const initDate = new Date();
    window.exportStartDate = new Date(initDate.getFullYear(), initDate.getMonth(), 1).toISOString().split('T')[0];
    window.exportEndDate = initDate.toISOString().split('T')[0];

    window.prices = { orange: 15, purple: 15, crate: 30, ownWash: 5, ownRefill: 15 };

    let loaded = { cust: false, tx: false, users: false, stock: false };
    let isAppInitialized = false;

    // --- Real-time Listeners ---
    onSnapshot(collection(db, "customers"), (snap) => { window.customers = snap.docs.map(d => ({ id: d.id, ...d.data() })); checkLoad('cust'); });
    onSnapshot(collection(db, "transactions"), (snap) => { window.transactions = snap.docs.map(d => ({ id: d.id, ...d.data() })); checkLoad('tx'); });
    onSnapshot(collection(db, "users"), (snap) => { 
      window.users = snap.docs.map(d => ({ id: d.id, ...d.data() })); 
      if (window.currentUser) {
        const updatedMe = window.users.find(u => u.id === window.currentUser.id);
        if (updatedMe) window.currentUser = updatedMe;
      }
      checkLoad('users'); 
    });
    onSnapshot(doc(db, "system", "global_stock"), (docSnap) => { 
      if(docSnap.exists()) window.globalStock = docSnap.data(); 
      else window.globalStock = { orange: 0, purple: 0, crate: 0 };
      checkLoad('stock'); 
    });

    function checkLoad(module) {
      loaded[module] = true;
      if (loaded.cust && loaded.tx && loaded.users && loaded.stock) {
        const loader = document.getElementById('loading-screen');
        if (loader && !loader.classList.contains('hidden')) {
          loader.style.opacity = '0';
          setTimeout(() => {
            loader.classList.add('hidden');
            document.getElementById('bottom-nav').classList.remove('hidden');
          }, 500);
        }
        
        if (!isAppInitialized) {
          isAppInitialized = true;
          initializeAppFlow();
        } else {
          window.render();
        }
      }
    }

    function initializeAppFlow() {
      if (window.users.length === 0) {
        window.switchView('setupAdmin');
        return;
      }
      const savedUserId = localStorage.getItem('water_app_user_id');
      if (savedUserId) {
        const user = window.users.find(u => u.id === savedUserId);
        if (user) {
          window.currentUser = user;
          window.switchView('list');
          return;
        }
      }
      window.switchView('login');
    }

    // --- Helpers ---
    const safeNum = (val) => (isNaN(Number(val)) ? 0 : Number(val));
    window.safeNum = safeNum;

    window.formatDate = (ts) => {
      if (!ts) return '-';
      try {
        const d = new Date(ts);
        const dd = String(d.getDate()).padStart(2, '0');
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const yy = (d.getFullYear() + 543).toString().slice(-2);
        const hr = String(d.getHours()).padStart(2, '0');
        const mn = String(d.getMinutes()).padStart(2, '0');
        return `${dd}/${mm}/${yy} ${hr}:${mn}`;
      } catch(e) { return '-'; }
    };

    let toastTimer = null;
    window.showToast = function(message, type = 'success') {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = message;
      toast.className = `fixed top-4 left-1/2 z-50 px-6 py-3 rounded-full shadow-2xl font-bold flex items-center text-white pointer-events-none w-max max-w-[90%] ${type === 'error' ? 'bg-red-500' : 'bg-green-600'}`;
      document.getElementById('toast-icon').innerHTML = type === 'error' ? '<i data-lucide="alert-circle" class="w-5 h-5"></i>' : '<i data-lucide="check-circle" class="w-5 h-5"></i>';
      lucide.createIcons();
      toast.style.transform = 'translate(-50%, 0)';
      toast.style.opacity = '1';
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.style.transform = 'translate(-50%, -150px)';
        toast.style.opacity = '0';
      }, 2500);
    };

    let confirmCallback = null;
    window.showModal = function(title, msg, confirmText, danger, onConfirm) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-title').className = `font-bold text-xl mb-2 ${danger ? 'text-red-600' : 'text-gray-800'}`;
      document.getElementById('modal-msg').innerHTML = msg; // Allowed HTML for bolding
      document.getElementById('modal-btn-text').innerText = confirmText;
      const btn = document.getElementById('modal-confirm-btn');
      btn.className = `flex-1 text-white py-3.5 rounded-xl font-bold active:scale-95 transition-transform flex justify-center items-center ${danger ? 'bg-red-500' : 'bg-blue-600'}`;
      confirmCallback = onConfirm;
      document.getElementById('confirm-modal').classList.remove('hidden');
    };

    window.closeModal = function() {
      document.getElementById('confirm-modal').classList.add('hidden');
      document.getElementById('modal-spinner').classList.add('hidden');
      document.getElementById('modal-btn-text').classList.remove('hidden');
      confirmCallback = null;
    };

    document.getElementById('modal-confirm-btn').addEventListener('click', async () => {
      if (confirmCallback) {
        document.getElementById('modal-spinner').classList.remove('hidden');
        document.getElementById('modal-btn-text').classList.add('hidden');
        await confirmCallback();
      }
      window.closeModal();
    });

    // --- Navigation & Routing ---
    window.switchView = function(viewName, param = null) {
      window.currentView = viewName;
      if (param) window.selectedCustomerId = param;

      const navContainer = document.getElementById('bottom-nav');
      if (window.currentUser) {
        navContainer.innerHTML = `
          <button onclick="window.switchView('list')" class="flex flex-col items-center p-2 ${viewName==='list'?'text-blue-600':'text-gray-400'} transition-colors"><i data-lucide="home" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-bold">ลูกค้า</span></button>
          <button onclick="window.switchView('historyAll')" class="flex flex-col items-center p-2 ${viewName==='historyAll'?'text-blue-600':'text-gray-400'} transition-colors"><i data-lucide="file-text" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-bold">บิลทั้งหมด</span></button>
          <button onclick="window.switchView('reports')" class="flex flex-col items-center p-2 ${viewName==='reports'?'text-blue-600':'text-gray-400'} transition-colors"><i data-lucide="bar-chart-2" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-bold">รายงาน</span></button>
          ${window.currentUser.role === 'admin' ? `
            <button onclick="window.switchView('adminStock')" class="flex flex-col items-center p-2 ${viewName==='adminStock'?'text-blue-600':'text-gray-400'} transition-colors"><i data-lucide="database" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-bold">สต๊อก</span></button>
          ` : `
            <button onclick="window.switchView('stats')" class="flex flex-col items-center p-2 ${viewName==='stats'?'text-blue-600':'text-gray-400'} transition-colors"><i data-lucide="trending-up" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-bold">สถิติ</span></button>
          `}
        `;
      }

      if (['setupAdmin', 'login', 'addCustomer', 'editCustomer', 'delivery', 'history', 'stockList'].includes(viewName)) {
        navContainer.classList.add('hidden');
      } else {
        navContainer.classList.remove('hidden');
      }

      window.render();
    };

    // --- Action Functions ---
    window.logout = function() {
      localStorage.removeItem('water_app_user_id');
      window.currentUser = null;
      window.switchView('login');
      window.showToast('ออกจากระบบแล้ว');
    };

    window.loginUser = function(e) {
      e.preventDefault();
      const userId = document.getElementById('login-user-select').value;
      const pin = document.getElementById('login-pin').value.trim();
      if (!userId || !pin) return;

      const user = window.users.find(u => u.id === userId);
      if (user && user.pin === pin) {
        window.currentUser = user;
        localStorage.setItem('water_app_user_id', user.id);
        window.showToast(`ยินดีต้อนรับคุณ ${user.name}`);
        window.switchView('list');
      } else {
        window.showToast('รหัส PIN ไม่ถูกต้อง', 'error');
      }
    };

    window.setupFirstAdmin = async function(e) {
      e.preventDefault();
      const name = document.getElementById('setup-name').value.trim();
      const pin = document.getElementById('setup-pin').value.trim();
      if (!name || !pin) return;
      const btn = document.getElementById('btn-setup-admin');
      btn.innerHTML = '<div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>';

      try {
        const docRef = await addDoc(collection(db, "users"), { name, pin, role: 'admin' });
        await setDoc(doc(db, "system", "global_stock"), { orange: 0, purple: 0, crate: 0 });
        window.showToast('สร้างผู้ดูแลระบบคนแรกเรียบร้อย!');
        window.currentUser = { id: docRef.id, name, pin, role: 'admin' };
        localStorage.setItem('water_app_user_id', docRef.id);
        window.switchView('list');
      } catch (err) {
        window.showToast('เกิดข้อผิดพลาด', 'error');
        btn.innerText = 'เริ่มต้นใช้งาน';
      }
    };

    // User Management
    window.saveStaff = async function(e) {
      e.preventDefault();
      if(!window.newUserName || !window.newUserPin) return window.showToast('กรุณากรอกข้อมูลให้ครบ', 'error');
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const originalText = submitBtn.innerText;
      submitBtn.innerHTML = '<div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>';
      submitBtn.disabled = true;

      try {
        if (window.editingUserId) {
          await updateDoc(doc(db, "users", window.editingUserId), { name: window.newUserName, pin: window.newUserPin, role: window.newUserRole });
          window.showToast('แก้ไขข้อมูลพนักงานสำเร็จ');
        } else {
          await addDoc(collection(db, "users"), { name: window.newUserName, pin: window.newUserPin, role: window.newUserRole });
          window.showToast('เพิ่มพนักงานสำเร็จ');
        }
        window.cancelEditStaff();
      } catch(error) { 
        window.showToast('เกิดข้อผิดพลาด', 'error'); 
        submitBtn.innerText = originalText; submitBtn.disabled = false;
      }
    };

    window.editStaff = function(id) {
      const u = window.users.find(x => x.id === id);
      if(!u) return;
      window.editingUserId = u.id; window.newUserName = u.name; window.newUserPin = u.pin; window.newUserRole = u.role;
      window.render();
    };

    window.cancelEditStaff = function() {
      window.editingUserId = null; window.newUserName = ''; window.newUserPin = ''; window.newUserRole = 'staff';
      window.render();
    };

    window.deleteStaff = function(id) {
      if (id === window.currentUser.id) return window.showToast('ไม่สามารถลบบัญชีของตัวเองที่กำลังใช้งานอยู่ได้', 'error');
      const u = window.users.find(x => x.id === id);
      window.showModal('ลบพนักงาน?', `คุณต้องการลบพนักงานชื่อ "${u.name}" ใช่หรือไม่?`, 'ลบข้อมูล', true, async () => {
        try {
          await deleteDoc(doc(db, "users", id));
          window.showToast('ลบพนักงานสำเร็จ');
        } catch(error) { window.showToast('เกิดข้อผิดพลาดในการลบ', 'error'); }
      });
    };

    // --- Admin Delete All Transactions ---
    window.clearAllTransactions = function() {
      if(window.currentUser.role !== 'admin') return;
      window.showModal('ล้างประวัติบิลทั้งหมด?', 'รายการบิลที่ผ่านมาทั้งหมดจะถูกลบทิ้งอย่างถาวร (ยอดหนี้และสต๊อกลูกค้าปัจจุบันจะไม่หาย) คุณแน่ใจหรือไม่?', 'ล้างบิลทั้งหมด', true, async () => {
        window.showToast('กำลังล้างข้อมูลบิล กรุณารอสักครู่...');
        try {
          const batchArray = [];
          let currentBatch = writeBatch(db);
          let count = 0;

          for (const tx of window.transactions) {
            currentBatch.delete(doc(db, "transactions", tx.id));
            count++;
            if (count === 400) {
              batchArray.push(currentBatch);
              currentBatch = writeBatch(db);
              count = 0;
            }
          }
          if (count > 0) batchArray.push(currentBatch);
          
          for (const b of batchArray) {
            await b.commit();
          }
          window.showToast('ล้างประวัติบิลสำเร็จเรียบร้อย');
        } catch (error) {
          window.showToast('เกิดข้อผิดพลาดในการล้างข้อมูล', 'error');
        }
      });
    };

    // --- Direct Input Actions ---
    window.setGlobalStock = async function(item, val) {
      if(!window.currentUser || window.currentUser.role !== 'admin') return;
      try { 
        const newVal = Math.max(0, safeNum(val));
        await setDoc(doc(db, "system", "global_stock"), { [item]: newVal }, { merge: true }); 
      } 
      catch(e) { window.showToast('อัปเดตสต๊อกไม่สำเร็จ', 'error'); }
    };

    window.updateGlobalStock = async function(item, delta) {
      if(!window.currentUser || window.currentUser.role !== 'admin') return;
      try { await setDoc(doc(db, "system", "global_stock"), { [item]: increment(delta) }, { merge: true }); } 
      catch(e) { window.showToast('อัปเดตสต๊อกไม่สำเร็จ', 'error'); }
    };

    window.setQty = function(targetObj, item, val) {
      window[targetObj][item] = Math.max(0, safeNum(val));
      window.render();
    };

    window.setOwnQty = function(field, val) {
      window[field] = Math.max(0, safeNum(val));
      window.render();
    };

    window.updateQty = function(targetObj, item, delta) {
      window[targetObj][item] = Math.max(0, safeNum(window[targetObj][item]) + delta);
      window.render();
    };

    window.updateOwnQty = function(field, delta) {
      window[field] = Math.max(0, safeNum(window[field]) + delta);
      window.render();
    };


    // --- Delivery / Customer Actions ---
    window.openAddCustomer = function() {
      window.formName = ''; 
      window.formPhone = ''; 
      window.formZone = window.selectedZone === 'ทั้งหมด' ? '' : window.selectedZone;
      window.selectedCustomerId = null;
      window.switchView('addCustomer');
    };

    window.openEditCustomer = function() {
      const cust = window.customers.find(c => c.id === window.selectedCustomerId);
      if (cust) {
        window.formName = cust.name;
        window.formPhone = cust.phone || '';
        window.formZone = cust.zone === 'อื่นๆ' ? '' : (cust.zone || '');
        window.switchView('editCustomer');
      } else {
        window.showToast('ไม่พบข้อมูลลูกค้า', 'error');
      }
    };

    window.deleteCustomer = function() {
      const cust = window.customers.find(c => c.id === window.selectedCustomerId);
      if (!cust) return;

      window.showModal('ลบลูกค้ารายนี้?', `คุณต้องการลบรายชื่อ "${cust.name}" ใช่หรือไม่? (ประวัติบิลจะยังคงอยู่)`, 'ลบข้อมูล', true, async () => {
        try {
          await deleteDoc(doc(db, "customers", window.selectedCustomerId));
          window.showToast('ลบลูกค้าออกจากระบบแล้ว');
          window.switchView('list');
        } catch (error) {
          window.showToast('เกิดข้อผิดพลาดในการลบข้อมูล', 'error');
        }
      });
    };

    window.saveCustomer = async function(e, isEdit) {
      e.preventDefault();
      const name = document.getElementById('form-name').value.trim();
      const phone = document.getElementById('form-phone').value.trim();
      const zone = document.getElementById('form-zone').value.trim() || 'อื่นๆ';
      if (!name) return;

      window.formName = name; window.formPhone = phone; window.formZone = zone;

      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.innerHTML = '<div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>';
      submitBtn.disabled = true;

      try {
        if (isEdit) {
          await updateDoc(doc(db, "customers", window.selectedCustomerId), { name, phone, zone });
          window.showToast('อัปเดตข้อมูลลูกค้าเรียบร้อยแล้ว');
        } else {
          await addDoc(collection(db, "customers"), { name, phone, zone, debt: 0, stockOrange: 0, stockPurple: 0, stockCrate: 0, stockOwnBottle: 0 });
          window.showToast('เพิ่มลูกค้าใหม่เรียบร้อยแล้ว');
        }
        window.formName = ''; window.formPhone = ''; window.formZone = '';
        window.selectedZone = zone; window.searchQuery = ''; window.switchView('list');
      } catch (error) {
        window.showToast('เกิดข้อผิดพลาดในการบันทึก', 'error');
        submitBtn.innerText = 'บันทึกข้อมูล';
        submitBtn.disabled = false;
      }
    };

    window.goToDelivery = function(custId) {
      window.selectedCustomerId = custId;
      window.deliveries = { orange: 0, purple: 0, crate: 0 };
      window.returns = { orange: 0, purple: 0, crate: 0 };
      window.ownTakeWash = 0; window.ownTakeRefill = 0; window.ownDeliverDone = 0;
      window.paymentStatus = 'paid'; window.txNote = '';
      window.switchView('delivery');
    };

    window.submitDelivery = async function() {
      const cust = window.customers.find(c => c.id === window.selectedCustomerId);
      if (!cust) return window.showToast('ไม่พบข้อมูลลูกค้า', 'error');

      const btn = document.getElementById('btn-submit-delivery');
      if(btn) btn.innerHTML = '<div class="w-6 h-6 border-2 border-white border-t-transparent rounded-full animate-spin"></div>';

      // คำนวณเงิน: สินค้าโรงงาน + บริการรับถังมาทำ
      const factoryTotal = (window.deliveries.orange * window.prices.orange) + (window.deliveries.purple * window.prices.purple) + (window.deliveries.crate * window.prices.crate);
      const ownServiceTotal = (window.ownTakeWash * window.prices.ownWash) + (window.ownTakeRefill * window.prices.ownRefill);
      const calcTotal = factoryTotal + ownServiceTotal;
      
      const currentDebt = safeNum(cust.debt);
      let addedDebt = 0, amountCollected = 0, newDebt = currentDebt;

      if (window.paymentStatus === 'paid') {
        amountCollected = calcTotal + currentDebt; addedDebt = -currentDebt; newDebt = 0;
      } else {
        addedDebt = calcTotal; newDebt = currentDebt + addedDebt;
      }

      // คำนวณสต๊อก
      const calcStock = (old, del, ret) => Math.max(0, safeNum(old) + safeNum(del) - safeNum(ret));
      const newOrange = calcStock(cust.stockOrange, window.deliveries.orange, window.returns.orange);
      const newPurple = calcStock(cust.stockPurple, window.deliveries.purple, window.returns.purple);
      const newCrate = calcStock(cust.stockCrate, window.deliveries.crate, window.returns.crate);
      
      // ถังส่วนตัว: ของเดิม + รับมาทำเพิ่ม - ส่งคืนกลับไปแล้ว
      const newOwnBottle = Math.max(0, safeNum(cust.stockOwnBottle) + safeNum(window.ownTakeWash) + safeNum(window.ownTakeRefill) - safeNum(window.ownDeliverDone));

      try {
        const batch = writeBatch(db);
        batch.update(doc(db, "customers", cust.id), { debt: newDebt, stockOrange: newOrange, stockPurple: newPurple, stockCrate: newCrate, stockOwnBottle: newOwnBottle });

        const txRef = doc(collection(db, "transactions"));
        batch.set(txRef, {
          customerId: cust.id, customerName: cust.name, zone: cust.zone,
          deliveries: {...window.deliveries}, returns: {...window.returns}, 
          ownTakeWash: window.ownTakeWash, ownTakeRefill: window.ownTakeRefill, ownDeliverDone: window.ownDeliverDone,
          paymentStatus: window.paymentStatus, totalAmount: calcTotal, 
          amountCollected, addedDebt, status: 'active', timestamp: Date.now(),
          note: window.txNote, createdBy: window.currentUser.name
        });

        const stockRef = doc(db, "system", "global_stock");
        batch.set(stockRef, {
          orange: increment(-window.deliveries.orange), purple: increment(-window.deliveries.purple), crate: increment(-window.deliveries.crate)
        }, { merge: true });

        await batch.commit();
        window.showToast(`บันทึกการส่งให้ ${cust.name} เรียบร้อย!`);
        window.switchView('list');
      } catch (error) {
        window.showToast('บันทึกไม่สำเร็จ ตรวจสอบอินเทอร์เน็ต', 'error');
        if(btn) btn.innerText = 'บันทึกรายการ';
      }
    };

    window.voidTransaction = function(txId) {
      const tx = window.transactions.find(t => t.id === txId);
      if (!tx) return;

      window.showModal('ต้องการยกเลิกบิลนี้?', 'ระบบจะดึงสต๊อกและยอดหนี้กลับ (สำหรับแอดมินเท่านั้น)', 'ยืนยันยกเลิกบิล', true, async () => {
        if(window.currentUser.role !== 'admin') return window.showToast('สิทธิ์ไม่เพียงพอ แจ้งแอดมินเพื่อยกเลิก', 'error');

        try {
          const batch = writeBatch(db);
          const cust = window.customers.find(c => c.id === tx.customerId);
          
          if (cust) {
            const revOrange = Math.max(0, safeNum(cust.stockOrange) - safeNum(tx.deliveries?.orange) + safeNum(tx.returns?.orange));
            const revPurple = Math.max(0, safeNum(cust.stockPurple) - safeNum(tx.deliveries?.purple) + safeNum(tx.returns?.purple));
            const revCrate = Math.max(0, safeNum(cust.stockCrate) - safeNum(tx.deliveries?.crate) + safeNum(tx.returns?.crate));
            const revDebt = Math.max(0, safeNum(cust.debt) - safeNum(tx.addedDebt));
            
            // Revert ถังลูกค้าแบบรวม Logic เก่าและใหม่ (กันพลาด)
            const revOwn = Math.max(0, safeNum(cust.stockOwnBottle) 
              - safeNum(tx.ownTakeWash) - safeNum(tx.ownTakeRefill) + safeNum(tx.ownDeliverDone) 
              + safeNum(tx.ownDeliverWash) + safeNum(tx.ownDeliverRefill) - safeNum(tx.ownReturn) 
            );
            
            batch.update(doc(db, "customers", cust.id), { debt: revDebt, stockOrange: revOrange, stockPurple: revPurple, stockCrate: revCrate, stockOwnBottle: revOwn });
          }
          
          batch.set(doc(db, "system", "global_stock"), {
            orange: increment(safeNum(tx.deliveries?.orange)), purple: increment(safeNum(tx.deliveries?.purple)), crate: increment(safeNum(tx.deliveries?.crate))
          }, { merge: true });

          batch.update(doc(db, "transactions", tx.id), { status: 'voided' });
          await batch.commit();

          window.showToast('ยกเลิกบิลและดึงสต๊อกกลับสำเร็จ');
          window.render();
        } catch (error) { window.showToast('เกิดข้อผิดพลาดในการยกเลิก', 'error'); }
      });
    };

    window.downloadExcelRange = function() {
      const startDateVal = document.getElementById('export-start-date').value;
      const endDateVal = document.getElementById('export-end-date').value;

      if (!startDateVal || !endDateVal) return window.showToast("กรุณาเลือกช่วงเวลาให้ครบถ้วน", "error");

      const startTimestamp = new Date(startDateVal + "T00:00:00").getTime();
      const endTimestamp = new Date(endDateVal + "T23:59:59").getTime();

      if (startTimestamp > endTimestamp) return window.showToast("วันที่เริ่มต้นต้องไม่มากกว่าสิ้นสุด", "error");

      const txList = window.transactions.filter(t => t.timestamp >= startTimestamp && t.timestamp <= endTimestamp);
      if(txList.length === 0) return window.showToast("ไม่มีบิลในช่วงเวลานี้", "error");

      const headers = [
        'วันที่และเวลา', 'ชื่อลูกค้า', 'โซน', 'พนักงานที่ส่ง', 'สถานะบิล', 'การจ่ายเงิน', 
        'ส่งน้ำ(ส้ม)', 'รับคืน(ส้ม)', 'ส่งน้ำ(ม่วง)', 'รับคืน(ม่วง)', 'ส่งน้ำ(ลัง)', 'รับคืน(ลัง)', 
        'รับถังมา(ล้าง5฿)', 'รับถังมา(ล้าง+เติม15฿)', 'ส่งคืนลูกค้า(ถังส่วนตัว)', 
        'ยอดเงินสดที่เก็บ(บาท)', 'ค้างจ่ายเพิ่ม(บาท)', 'หมายเหตุ'
      ];
      
      const rows = txList.map(tx => [
        `"${window.formatDate(tx.timestamp)}"`, `"${tx.customerName}"`, `"${tx.zone}"`, `"${tx.createdBy || '-'}"`, 
        tx.status === 'voided' ? 'ยกเลิก' : 'ปกติ', tx.paymentStatus === 'paid' ? 'จ่ายแล้ว' : 'ค้างจ่าย',
        safeNum(tx.deliveries?.orange), safeNum(tx.returns?.orange), safeNum(tx.deliveries?.purple), safeNum(tx.returns?.purple), safeNum(tx.deliveries?.crate), safeNum(tx.returns?.crate), 
        (safeNum(tx.ownTakeWash) || safeNum(tx.ownDeliverWash)), (safeNum(tx.ownTakeRefill) || safeNum(tx.ownDeliverRefill)), (safeNum(tx.ownDeliverDone) || safeNum(tx.ownReturn)),
        safeNum(tx.amountCollected), safeNum(tx.addedDebt), `"${tx.note || ''}"`
      ].join(','));

      const blob = new Blob(['\uFEFF' + headers.join(',') + '\n' + rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a'); link.href = url; link.download = `รายงานส่งน้ำ_${startDateVal}_ถึง_${endDateVal}.csv`; link.click(); URL.revokeObjectURL(url);
      window.showToast('ดาวน์โหลดไฟล์ Excel สำเร็จ');
    };

    // --- Views Rendering ---
    let activeId = null;
    let cursorStart = null;
    let cursorEnd = null;

    window.render = function() {
      // 1. จำตำแหน่งเคอร์เซอร์กรณีพิมพ์อยู่แล้วจอกระพริบ
      if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA' || document.activeElement.tagName === 'SELECT')) {
        activeId = document.activeElement.id;
        try {
           cursorStart = document.activeElement.selectionStart;
           cursorEnd = document.activeElement.selectionEnd;
        } catch(e) {}
      } else {
        activeId = null;
      }

      // 2. จำตำแหน่ง Scroll ของแถบเลือกซอย
      const zc = document.getElementById('zone-scroll-container');
      if (zc) window.lastZoneScroll = zc.scrollLeft;

      const container = document.getElementById('app-container');
      if (!container) return;

      if (window.currentView === 'loading') container.innerHTML = '';
      else if (window.currentView === 'setupAdmin') renderSetupAdmin(container);
      else if (window.currentView === 'login') renderLogin(container);
      else if (window.currentView === 'list') renderList(container);
      else if (window.currentView === 'addCustomer' || window.currentView === 'editCustomer') renderCustomerForm(container);
      else if (window.currentView === 'delivery') renderDelivery(container);
      else if (window.currentView === 'history') renderHistory(container);
      else if (window.currentView === 'historyAll') renderHistoryAll(container);
      else if (window.currentView === 'reports') renderReports(container);
      else if (window.currentView === 'stats') renderStats(container);
      else if (window.currentView === 'stockList') renderStockList(container);
      else if (window.currentView === 'adminStock') renderAdminStock(container);

      lucide.createIcons();

      // 3. คืนค่า Scroll ให้แถบซอย
      setTimeout(() => {
        const nzc = document.getElementById('zone-scroll-container');
        if (nzc && window.lastZoneScroll !== undefined) {
          nzc.scrollLeft = window.lastZoneScroll;
        }
      }, 0);

      // 4. คืนค่าการโฟกัสและเคอร์เซอร์
      if (activeId) {
        const el = document.getElementById(activeId);
        if (el) {
          el.focus();
          try {
            if (cursorStart !== null && cursorEnd !== null) el.setSelectionRange(cursorStart, cursorEnd);
          } catch(e) {}
        }
      }
    };

        startDate = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
      } else if (window.reportPeriod === 'week') { 
        const wd = new Date(d); wd.setDate(d.getDate() - d.getDay()); wd.setHours(0,0,0,0); startDate = wd.getTime(); 
      } else if (window.reportPeriod === 'month') {
        startDate = new Date(d.getFullYear(), d.getMonth(), 1).getTime();
      } else if (window.reportPeriod === 'year') {
        startDate = new Date(d.getFullYear(), 0, 1).getTime();
      }

      const txForReport = window.transactions.filter(t => t.timestamp >= startDate && t.timestamp <= endDate);
      const validTx = txForReport.filter(t => t.status !== 'voided');

      const stats = validTx.reduce((acc, tx) => {
        acc.rev += safeNum(tx.amountCollected); 
        acc.debt += safeNum(tx.addedDebt) > 0 ? safeNum(tx.addedDebt) : 0;
        acc.dO += safeNum(tx.deliveries?.orange); acc.dP += safeNum(tx.deliveries?.purple); acc.dC += safeNum(tx.deliveries?.crate);
        acc.rO += safeNum(tx.returns?.orange); acc.rP += safeNum(tx.returns?.purple); acc.rC += safeNum(tx.returns?.crate);
        acc.oW += safeNum(tx.ownTakeWash) || safeNum(tx.ownDeliverWash); 
        acc.oR += safeNum(tx.ownTakeRefill) || safeNum(tx.ownDeliverRefill); 
        acc.oRet += safeNum(tx.ownDeliverDone) || safeNum(tx.ownReturn);
        return acc;
      }, { rev: 0, debt: 0, dO: 0, dP: 0, dC: 0, rO: 0, rP: 0, rC: 0, oW: 0, oR: 0, oRet: 0 });

      const totalDel = stats.dO + stats.dP + stats.dC;
      const ownRev = (stats.oW * window.prices.ownWash) + (stats.oR * window.prices.ownRefill);

      const activeCustomers = window.customers.filter(c => safeNum(c.debt) > 0 || safeNum(c.stockOrange) > 0 || safeNum(c.stockPurple) > 0 || safeNum(c.stockCrate) > 0 || safeNum(c.stockOwnBottle) > 0)
        .sort((a, b) => safeNum(b.debt) - safeNum(a.debt));

      const totalCurrentDebt = activeCustomers.reduce((sum, c) => sum + safeNum(c.debt), 0);
      const tO = activeCustomers.reduce((sum, c) => sum + safeNum(c.stockOrange), 0);
      const tP = activeCustomers.reduce((sum, c) => sum + safeNum(c.stockPurple), 0);
      const tC = activeCustomers.reduce((sum, c) => sum + safeNum(c.stockCrate), 0);
      const tOwn = activeCustomers.reduce((sum, c) => sum + safeNum(c.stockOwnBottle), 0);

      container.innerHTML = `
        <div class="p-4 max-w-md mx-auto pb-24">
          <div class="mb-6 flex items-end justify-between bg-blue-600 text-white p-5 rounded-b-3xl shadow-md -mt-4 -mx-4 pt-8">
            <div><h1 class="text-2xl font-black tracking-tight">รายงานและบัญชี</h1></div>
          </div>
          
          <div class="bg-white p-4 rounded-3xl shadow-sm border border-gray-100 mb-6">
            <h3 class="text-sm font-bold text-gray-800 mb-3 flex items-center"><i data-lucide="calendar" class="w-4 h-4 mr-2 text-blue-500"></i> โหลดข้อมูลเข้า Excel</h3>
            <div class="grid grid-cols-2 gap-2 mb-3">
              <div>
                <label class="text-[10px] font-bold text-gray-400 ml-1">ตั้งแต่วันที่</label>
                <input type="date" id="export-start-date" value="${window.exportStartDate}" onchange="window.exportStartDate=this.value" class="w-full px-3 py-2 text-sm rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 bg-gray-50 outline-none" />
              </div>
              <div>
                <label class="text-[10px] font-bold text-gray-400 ml-1">ถึงวันที่</label>
                <input type="date" id="export-end-date" value="${window.exportEndDate}" onchange="window.exportEndDate=this.value" class="w-full px-3 py-2 text-sm rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 bg-gray-50 outline-none" />
              </div>
            </div>
            <button onclick="window.downloadExcelRange()" class="w-full bg-green-600 text-white py-2.5 rounded-xl text-sm font-bold shadow-sm active:scale-95 flex items-center justify-center transition-transform"><i data-lucide="download" class="w-4 h-4 mr-1.5"></i> ดาวน์โหลดช่วงเวลานี้</button>
          </div>

          <h3 class="text-sm font-bold text-gray-800 mb-3 ml-1">สรุปยอดขายบนแอป</h3>
          <div class="flex bg-gray-200 p-1 rounded-xl mb-4 shadow-inner">
            ${['day', 'week', 'month', 'year'].map(p => `
              <button onclick="window.reportPeriod='${p}'; window.render();" class="flex-1 py-2 text-sm font-bold rounded-lg transition-colors ${window.reportPeriod === p ? 'bg-white text-blue-700 shadow-sm' : 'text-gray-500'}">
                ${p === 'day' ? 'วันนี้' : p === 'week' ? 'สัปดาห์' : p === 'month' ? 'เดือน' : 'ปี'}
              </button>
            `).join('')}
          </div>

          <div class="grid grid-cols-2 gap-4 mb-4">
            <div class="bg-white p-4 rounded-3xl shadow-sm border border-gray-100 flex flex-col justify-center">
              <span class="text-gray-500 text-[10px] font-bold mb-1 flex items-center uppercase tracking-wider"><i data-lucide="check-circle" class="w-3 h-3 mr-1 text-green-500"></i> เก็บเงินสดได้</span>
              <span class="text-2xl font-black text-green-600">${stats.rev.toLocaleString()} ฿</span>
            </div>
            <div class="bg-white p-4 rounded-3xl shadow-sm border border-gray-100 flex flex-col justify-center">
              <span class="text-gray-500 text-[10px] font-bold mb-1 flex items-center uppercase tracking-wider"><i data-lucide="alert-circle" class="w-3 h-3 mr-1 text-red-500"></i> ค้างจ่ายเพิ่มบิลนี้</span>
              <span class="text-2xl font-black text-red-500">${stats.debt.toLocaleString()} ฿</span>
            </div>
          </div>

          <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 mb-4">
            <h3 class="font-bold text-gray-800 mb-4 flex items-center"><i data-lucide="package" class="w-4.5 h-4.5 mr-2 text-blue-500"></i> รายการส่งน้ำ (ออก ${totalDel})</h3>
            <div class="space-y-4">
              <div>
                <div class="flex justify-between text-sm font-bold text-gray-700 mb-1"><span class="flex items-center text-orange-600"><i data-lucide="droplet" class="w-3.5 h-3.5 mr-1"></i> ถังส้ม</span><span>ส่ง ${stats.dO} / คืน ${stats.rO}</span></div>
                <div class="w-full bg-gray-100 rounded-full h-2 flex"><div class="bg-orange-500 h-2 transition-all duration-500" style="width: ${totalDel ? (stats.dO/totalDel)*100 : 0}%"></div></div>
              </div>
              <div>
                <div class="flex justify-between text-sm font-bold text-gray-700 mb-1"><span class="flex items-center text-purple-600"><i data-lucide="droplet" class="w-3.5 h-3.5 mr-1"></i> ถังม่วง</span><span>ส่ง ${stats.dP} / คืน ${stats.rP}</span></div>
                <div class="w-full bg-gray-100 rounded-full h-2 flex"><div class="bg-purple-600 h-2 transition-all duration-500" style="width: ${totalDel ? (stats.dP/totalDel)*100 : 0}%"></div></div>
              </div>
              <div>
                <div class="flex justify-between text-sm font-bold text-gray-700 mb-1"><span class="flex items-center text-amber-700"><i data-lucide="package" class="w-3.5 h-3.5 mr-1"></i> แบบลัง</span><span>ส่ง ${stats.dC} / คืน ${stats.rC}</span></div>
                <div class="w-full bg-gray-100 rounded-full h-2 flex"><div class="bg-amber-700 h-2 transition-all duration-500" style="width: ${totalDel ? (stats.dC/totalDel)*100 : 0}%"></div></div>
              </div>
            </div>
          </div>

          <div class="bg-indigo-50 p-5 rounded-3xl shadow-sm border border-indigo-100 mb-4">
            <h3 class="font-bold text-indigo-900 mb-3 flex items-center justify-between">
              <span class="flex items-center"><i data-lucide="archive" class="w-4.5 h-4.5 mr-2 text-indigo-600"></i> บริการถังส่วนตัวลูกค้า</span>
              <span class="text-sm font-black text-indigo-700 bg-white px-2 py-1 rounded-lg shadow-sm">+${ownRev} ฿</span>
            </h3>
            <div class="space-y-1 text-xs font-bold text-indigo-800">
              <div class="flex justify-between py-1 border-b border-indigo-100/50"><span>รับมาล้าง (5฿)</span><span>${stats.oW}</span></div>
              <div class="flex justify-between py-1 border-b border-indigo-100/50"><span>รับมาล้าง+เติม (15฿)</span><span>${stats.oR}</span></div>
              <div class="flex justify-between py-1 text-gray-500"><span>ส่งคืนเสร็จแล้ว</span><span>${stats.oRet}</span></div>
            </div>
          </div>

          <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 mb-4">
            <h3 class="font-bold text-gray-800 mb-4 flex items-center"><i data-lucide="users" class="w-4.5 h-4.5 mr-2 text-indigo-500"></i> สรุปยอดค้าง ณ ปัจจุบัน (ทุกบ้าน)</h3>
            <div class="mb-4 pb-4 border-b border-gray-100">
              <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-bold text-gray-600">หนี้รวม:</span>
                <span class="text-lg font-black text-red-600">${totalCurrentDebt.toLocaleString()} ฿</span>
              </div>
              <div class="flex justify-between items-center">
                <span class="text-sm font-bold text-gray-600">ถัง/ลัง ค้าง:</span>
                <div class="flex gap-1 text-[10px] font-bold flex-wrap justify-end">
                  ${tO>0 ? `<span class="text-orange-600 bg-orange-50 px-1.5 py-0.5 rounded">ส้ม ${tO}</span>` : ''}
                  ${tP>0 ? `<span class="text-purple-600 bg-purple-50 px-1.5 py-0.5 rounded">ม่วง ${tP}</span>` : ''}
                  ${tC>0 ? `<span class="text-amber-700 bg-amber-50 px-1.5 py-0.5 rounded">ลัง ${tC}</span>` : ''}
                  ${tOwn>0 ? `<span class="text-indigo-700 bg-indigo-50 px-1.5 py-0.5 rounded border border-indigo-100"><i data-lucide="archive" class="w-2.5 h-2.5 inline mr-0.5"></i>ลูกค้า ${tOwn}</span>` : ''}
                </div>
              </div>
            </div>
            <div class="space-y-3 max-h-80 overflow-y-auto pr-1 no-scrollbar">
              ${activeCustomers.length === 0 ? `<p class="text-sm text-gray-400 text-center py-4">ไม่มีข้อมูลคงค้าง</p>` : activeCustomers.map(c => `
                <div onclick="window.goToDelivery('${c.id}')" class="flex flex-col p-3 bg-gray-50 rounded-xl border border-gray-100 active:bg-gray-200 cursor-pointer transition-colors">
                  <div class="flex justify-between items-start mb-2">
                    <span class="font-bold text-gray-800 text-sm truncate pr-2">${c.name}</span>
                    <span class="font-bold text-red-500 text-sm shrink-0">${safeNum(c.debt) > 0 ? `${safeNum(c.debt).toLocaleString()} ฿` : '0 ฿'}</span>
                  </div>
                  <div class="flex gap-1.5 text-[9px] font-bold flex-wrap">
                    ${safeNum(c.stockOrange) > 0 ? `<span class="flex items-center text-orange-600 bg-orange-100/50 px-1 rounded"><i data-lucide="droplet" class="w-2.5 h-2.5 mr-0.5"></i> ${c.stockOrange}</span>` : ''}
                    ${safeNum(c.stockPurple) > 0 ? `<span class="flex items-center text-purple-600 bg-purple-100/50 px-1 rounded"><i data-lucide="droplet" class="w-2.5 h-2.5 mr-0.5"></i> ${c.stockPurple}</span>` : ''}
                    ${safeNum(c.stockCrate) > 0 ? `<span class="flex items-center text-amber-700 bg-amber-100/50 px-1 rounded"><i data-lucide="package" class="w-2.5 h-2.5 mr-0.5"></i> ${c.stockCrate}</span>` : ''}
                    ${safeNum(c.stockOwnBottle) > 0 ? `<span class="flex items-center text-indigo-600 bg-indigo-100/50 px-1 rounded border border-indigo-200/50"><i data-lucide="archive" class="w-2.5 h-2.5 mr-0.5"></i> ส่วนตัว ${c.stockOwnBottle}</span>` : ''}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderStats(container) {
      container.innerHTML = `
        <div class="p-4 max-w-md mx-auto pb-24">
          <div class="mb-6 flex items-end bg-indigo-600 text-white p-5 rounded-b-3xl shadow-md -mt-4 -mx-4 pt-8">
            <div><h1 class="text-2xl font-black tracking-tight flex items-center"><i data-lucide="trending-up" class="w-6 h-6 mr-2"></i> ข้อมูลพนักงาน</h1></div>
          </div>
          <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 mb-4 text-center">
            <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full mx-auto flex items-center justify-center mb-2"><i data-lucide="user" class="w-8 h-8"></i></div>
            <h2 class="font-bold text-xl text-gray-800">${window.currentUser.name}</h2>
            <p class="text-sm text-gray-500 mb-4">พนักงานส่งน้ำ</p>
            <button onclick="window.logout()" class="px-6 py-2 bg-red-50 text-red-600 rounded-xl font-bold text-sm border border-red-100">ออกจากระบบ</button>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
