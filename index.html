  <script>
    (function() {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#2563eb';
      ctx.fillRect(0, 0, 512, 512); 
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(256, 100);
      ctx.bezierCurveTo(256, 100, 140, 280, 140, 360);
      ctx.arc(256, 360, 116, Math.PI, 0, true);
      ctx.fill();

      const iconUrl = canvas.toDataURL('image/png');
      const manifest = {
        name: "โรงงานน้ำดื่ม แม่จว้า หมู่ 8",
        short_name: "ระบบน้ำดื่ม",
        start_url: window.location.pathname,
        display: "standalone",
        background_color: "#2563eb",
        theme_color: "#2563eb",
        icons: [{ src: iconUrl, sizes: "512x512", type: "image/png", purpose: "any maskable" }]
      };

      const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
      const manifestUrl = URL.createObjectURL(blob);

      let m = document.createElement('link'); m.rel = 'manifest'; m.href = manifestUrl; document.head.appendChild(m);
      let a = document.createElement('link'); a.rel = 'apple-touch-icon'; a.href = iconUrl; document.head.appendChild(a);
    })();
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, writeBatch, increment, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyADKt7-BEYafDN7gx16CCnMah_BKV-GJmQ",
      authDomain: "wttt-c46a5.firebaseapp.com",
      projectId: "wttt-c46a5",
      storageBucket: "wttt-c46a5.firebasestorage.app",
      messagingSenderId: "372907513409",
      appId: "1:372907513409:web:3501b786049ecdd20d18c0"
    };

    const app = initializeApp(firebaseConfig);
    const db = initializeFirestore(app, {
      localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()})
    });

    const SUPER_ADMIN_ACCOUNT = { id: 'super_admin_fixed_id', name: 'ผู้ดูแลระบบสูงสุด', pin: '1617', role: 'super_admin' };

    window.customers = []; window.transactions = []; window.users = []; 
    window.globalStock = { orange: 0, purple: 0, crate: 0, promptpayNumber: '' }; 
    window.currentUser = null; 

    window.currentView = 'loading'; window.selectedZone = 'ทั้งหมด'; window.searchQuery = ''; window.selectedCustomerId = null;

    window.reportMode = 'daily'; 
    const initD = new Date();
    const dStr = initD.getFullYear() + '-' + String(initD.getMonth()+1).padStart(2,'0') + '-' + String(initD.getDate()).padStart(2,'0');
    const mStr = initD.getFullYear() + '-' + String(initD.getMonth()+1).padStart(2,'0') + '-01';
    window.reportDailyDate = dStr; window.reportCustomStart = mStr; window.reportCustomEnd = dStr;
    window.exportStartDate = mStr; window.exportEndDate = dStr;

    window.deliveries = { orange: 0, purple: 0, crate: 0 }; window.returns = { orange: 0, purple: 0, crate: 0 };
    window.ownTakeWash = 0; window.ownTakeRefill = 0; window.ownDeliverDone = 0; window.ownTakeUnpaid = 0; window.ownDeliverPayWash = 0; window.ownDeliverPayRefill = 0;
    window.extraFees = { fineBottle: 0, fineCap: 0, fineTank: 0, fineTankCap: 0, depositCrate: 0, depositTank: 0 };
    window.toggleState = { own: false, return: false, extra: false };

    window.ownBottlePayMode = 'pay_now'; window.isRemoteArea = false; window.cashReceived = ''; window.paymentStatus = 'paid'; window.paymentMethod = 'cash'; window.txNote = '';

    window.formName = ''; window.formPhone = ''; window.formZone = '';
    window.formDebt = 0; window.formStockOrange = 0; window.formStockPurple = 0; window.formStockCrate = 0; window.formStockOwnBottle = 0;

    window.editingUserId = null; window.newUserRole = 'staff'; window.newUserName = ''; window.newUserPin = '';
    window.prices = { orange: 15, purple: 15, crate: 30, ownWash: 5, ownRefill: 15 };
    window.extraPrices = { fineBottle: 20, fineCap: 5, fineTank: 100, fineTankCap: 20, depositCrate: 300, depositTank: 100 };

    let loaded = { cust: false, tx: false, users: false, stock: false };
    let isAppInitialized = false;

    window.vibrate = function(pattern = 30) { if (navigator.vibrate) navigator.vibrate(pattern); };
    window.hideKeyboard = function() { if (document.activeElement && typeof document.activeElement.blur === 'function') document.activeElement.blur(); };

    window.transitionWithLoading = function(viewName, msg) {
      window.hideKeyboard();
      const loader = document.getElementById('loading-screen');
      const loaderText = document.getElementById('loading-text');
      if (loaderText) loaderText.innerText = msg || 'กำลังประมวลผล...';
      
      loader.classList.remove('hidden');
      void loader.offsetWidth; 
      loader.style.opacity = '1'; loader.style.transform = 'scale(1)';
      
      setTimeout(() => {
        window.switchView(viewName);
        setTimeout(() => {
          loader.style.opacity = '0'; loader.style.transform = 'scale(1.05)';
          setTimeout(() => { loader.classList.add('hidden'); }, 500);
        }, 400); 
      }, 300); 
    };

    onSnapshot(collection(db, "customers"), (snap) => { window.customers = snap.docs.map(d => ({ id: d.id, ...d.data() })); checkLoad('cust'); });
    onSnapshot(collection(db, "transactions"), (snap) => { window.transactions = snap.docs.map(d => ({ id: d.id, ...d.data() })); checkLoad('tx'); });
    onSnapshot(collection(db, "users"), (snap) => { 
      window.users = snap.docs.map(d => ({ id: d.id, ...d.data() })); 
      if (window.currentUser && window.currentUser.role !== 'super_admin') {
        const updatedMe = window.users.find(u => u.id === window.currentUser.id);
        if (updatedMe) window.currentUser = updatedMe;
      }
      checkLoad('users'); 
    });
    onSnapshot(doc(db, "system", "global_stock"), (docSnap) => { 
      if(docSnap.exists()) window.globalStock = docSnap.data(); 
      else window.globalStock = { orange: 0, purple: 0, crate: 0, promptpayNumber: '' };
      checkLoad('stock'); 
    });

    function checkLoad(module) {
      loaded[module] = true;
      if (loaded.cust && loaded.tx && loaded.users && loaded.stock) {
        const loader = document.getElementById('loading-screen');
        if (loader && !loader.classList.contains('hidden') && !isAppInitialized) {
          setTimeout(() => {
            loader.style.opacity = '0'; loader.style.transform = 'scale(1.05)';
            setTimeout(() => { loader.classList.add('hidden'); }, 500);
          }, 400);
        }
        if (!isAppInitialized) {
          isAppInitialized = true;
          initializeAppFlow();
        } else if (window.currentView !== 'loading') {
          window.render();
        }
      }
    }

    function checkWelcomeToast() {
      const welcomeName = sessionStorage.getItem('show_welcome_toast');
      if (welcomeName) {
        setTimeout(() => window.showToast(welcomeName.includes('เรียบร้อย') || welcomeName.includes('สำเร็จ') ? welcomeName : `เข้าสู่ระบบสำเร็จ: ${welcomeName}`), 600);
        sessionStorage.removeItem('show_welcome_toast');
      }
    }

    function initializeAppFlow() {
      const savedUserId = localStorage.getItem('water_app_user_id');
      if (savedUserId === SUPER_ADMIN_ACCOUNT.id) {
        window.currentUser = SUPER_ADMIN_ACCOUNT;
        window.switchView('list');
        checkWelcomeToast(); return;
      }
      if (savedUserId) {
        const user = window.users.find(u => u.id === savedUserId);
        if (user) {
          window.currentUser = user; window.switchView('list');
          checkWelcomeToast(); return;
        }
      }
      window.switchView('login');
    }

    const safeNum = (val) => { const parsed = parseInt(val, 10); return isNaN(parsed) ? 0 : parsed; };

    window.formatDate = (ts) => {
      if (!ts) return '-';
      try {
        const d = new Date(ts);
        const dd = String(d.getDate()).padStart(2, '0');
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const yyyy = d.getFullYear() + 543; 
        const hr = String(d.getHours()).padStart(2, '0');
        const mn = String(d.getMinutes()).padStart(2, '0');
        return `${dd}/${mm}/${yyyy} ${hr}:${mn}`;
      } catch(e) { return '-'; }
    };

    window.generatePromptPayPayload = function(promptpayId, amount) {
      let id = promptpayId.replace(/[^0-9]/g, ''); let billerId = '';
      if (id.length === 13) { billerId = '0213' + id; } 
      else if (id.length === 10) { billerId = '01130066' + id.substring(1); } 
      else { return null; }

      let merchantInfo = '0016A000000677010111' + billerId;
      let payload = '00020101021229' + merchantInfo.length.toString().padStart(2, '0') + merchantInfo + '5802TH5303764';

      if (amount > 0) {
        let amountStr = Number(amount).toFixed(2);
        payload += '54' + amountStr.length.toString().padStart(2, '0') + amountStr;
      }
      payload += '6304';
      let crc = 0xFFFF;
      for (let i = 0; i < payload.length; i++) {
        crc ^= payload.charCodeAt(i) << 8;
        for (let j = 0; j < 8; j++) {
          if ((crc & 0x8000) !== 0) { crc = (crc << 1) ^ 0x1021; } else { crc = crc << 1; }
        }
      }
      crc = (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
      return payload + crc;
    };

    let toastTimer = null;
    window.showToast = function(message, type = 'success') {
      window.vibrate(type === 'error' ? [50, 50, 50] : 30);
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = message;
      document.getElementById('toast-icon').innerHTML = type === 'error' ? '<i data-lucide="alert-circle" class="w-5 h-5"></i>' : '<i data-lucide="check-circle" class="w-5 h-5"></i>';
      lucide.createIcons();

      toast.classList.remove('bg-red-500', 'bg-emerald-600', '-translate-y-[200%]', 'opacity-0');
      toast.classList.add(type === 'error' ? 'bg-red-500' : 'bg-emerald-600', 'translate-y-0', 'opacity-100');
      
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('-translate-y-[200%]', 'opacity-0');
      }, 3000);
    };

    let confirmCallback = null;
    window.showModal = function(title, msg, confirmText, danger, onConfirm) {
      window.vibrate(50); window.hideKeyboard(); 
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-title').className = `font-bold text-xl mb-2 ${danger ? 'text-red-600' : 'text-gray-800'}`;
      document.getElementById('modal-msg').innerHTML = msg; 
      document.getElementById('modal-btn-text').innerText = confirmText;
      const btn = document.getElementById('modal-confirm-btn');
      btn.className = `flex-1 text-white py-3.5 rounded-xl font-bold active:scale-95 transition-transform flex justify-center items-center ${danger ? 'bg-red-500' : 'bg-blue-600'}`;
      confirmCallback = onConfirm;
      document.getElementById('confirm-modal').classList.remove('hidden');
    };

    window.closeModal = function() {
      document.getElementById('confirm-modal').classList.add('hidden');
      document.getElementById('modal-spinner').classList.add('hidden');
      document.getElementById('modal-btn-text').classList.remove('hidden');
      confirmCallback = null;
    };

    document.getElementById('modal-confirm-btn').addEventListener('click', async () => {
      window.vibrate(30);
      if (confirmCallback) {
        document.getElementById('modal-spinner').classList.remove('hidden');
        document.getElementById('modal-btn-text').classList.add('hidden');
        await confirmCallback();
      }
      window.closeModal();
    });

    window.switchView = function(viewName, param = null) {
      window.vibrate(20); window.hideKeyboard(); 
      if(window.currentUser && !['admin', 'super_admin'].includes(window.currentUser.role) && ['reports', 'adminStock', 'stockList'].includes(viewName)) {
        return window.showToast('คุณไม่มีสิทธิ์เข้าถึงหน้านี้', 'error');
      }

      window.currentView = viewName;
      if (param) window.selectedCustomerId = param;

      const appCont = document.getElementById('app-container');
      if (appCont) {
        appCont.classList.remove('page-transition'); void appCont.offsetWidth; appCont.classList.add('page-transition');
      }

      const navContainer = document.getElementById('bottom-nav');
      const sideNav = document.getElementById('side-nav');
      
      if (window.currentUser) {
        const isAdmin = ['admin', 'super_admin'].includes(window.currentUser.role);
        const menuItems = isAdmin ? [
          { id: 'list', icon: 'home', label: 'ลูกค้า' },
          { id: 'historyAll', icon: 'file-text', label: 'บิลล่าสุด' },
          { id: 'reports', icon: 'bar-chart-2', label: 'รายงาน' },
          { id: 'adminStock', icon: 'database', label: 'จัดการ' }
        ] : [
          { id: 'list', icon: 'home', label: 'ลูกค้า' },
          { id: 'historyAll', icon: 'file-text', label: 'บิลล่าสุด' },
          { id: 'stats', icon: 'user', label: 'โปรไฟล์ฉัน' }
        ];

        navContainer.innerHTML = menuItems.map(m => `
          <button onclick="window.switchView('${m.id}')" class="flex flex-col items-center p-2 ${viewName===m.id?'text-blue-600':'text-gray-400'} active:scale-90 transition-all">
            <i data-lucide="${m.icon}" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-bold">${m.label}</span>
          </button>
        `).join('');

        sideNav.innerHTML = `
          <div class="p-6 flex items-center gap-4 bg-slate-950 border-b border-slate-800">
             <div class="bg-blue-600 p-2.5 rounded-2xl text-white shadow-lg shadow-blue-600/30"><i data-lucide="droplet" class="w-7 h-7"></i></div>
             <div>
               <h1 class="font-black text-white text-lg tracking-tight leading-tight">แม่จว้า ม.8</h1>
               <p class="text-[11px] text-blue-400 font-black uppercase tracking-widest mt-1">${window.currentUser.name}</p>
             </div>
          </div>
          <div class="p-5 space-y-2 flex-1 mt-2 overflow-y-auto no-scrollbar">
             <p class="text-[10px] text-slate-500 font-black uppercase tracking-widest mb-4 px-2">เมนูหลัก</p>
             ${menuItems.map(m => `
               <button onclick="window.switchView('${m.id}')" class="w-full flex items-center gap-4 px-4 py-4 rounded-2xl font-bold transition-all ${viewName===m.id?'bg-blue-600 text-white shadow-lg shadow-blue-600/30 scale-100':'text-slate-400 hover:bg-slate-800 hover:text-white hover:scale-[1.02]'}">
                 <i data-lucide="${m.icon}" class="w-5 h-5"></i> <span class="text-[15px]">${m.label}</span>
               </button>
             `).join('')}
          </div>
          <div class="p-5 border-t border-slate-800 bg-slate-900">
             <button onclick="window.logout()" class="w-full flex items-center justify-center gap-3 px-4 py-4 rounded-2xl font-black text-red-400 hover:bg-red-500 hover:text-white transition-all hover:shadow-lg hover:shadow-red-500/30">
               <i data-lucide="log-out" class="w-5 h-5"></i> ออกจากระบบ
             </button>
          </div>
        `;
      }

      if (viewName === 'login') {
        navContainer.classList.add('hidden');
        sideNav.classList.add('!hidden'); 
      } else {
        sideNav.classList.remove('!hidden'); 
        if (['addCustomer', 'editCustomer', 'delivery', 'history'].includes(viewName)) {
          navContainer.classList.add('hidden');
        } else {
          navContainer.classList.remove('hidden');
        }
      }

      window.render();
      document.getElementById('main-wrapper').scrollTo(0, 0); 
    };

    window.logout = function() {
      window.vibrate(50);
      localStorage.removeItem('water_app_user_id');
      window.currentUser = null;
      window.transitionWithLoading('login', 'กำลังออกจากระบบ...');
    };

    window.loginUser = function() {
      window.vibrate(30); window.hideKeyboard(); 

      const userId = document.getElementById('login-user-select').value;
      const pinInput = document.getElementById('login-pin');
      const pin = pinInput ? pinInput.value.trim() : '';
      
      if (!userId) return window.showToast('กรุณาเลือกชื่อผู้ใช้งานด้วยครับ', 'error');
      if (!pin) return window.showToast('กรุณากรอกรหัส PIN', 'error');

      const submitBtn = document.getElementById('btn-login');
      let originalText = 'เข้าสู่ระบบ';
      if(submitBtn) {
        originalText = submitBtn.innerText;
        submitBtn.innerHTML = '<div class="w-6 h-6 border-2 border-white border-t-transparent rounded-full animate-spin"></div>';
        submitBtn.disabled = true;
      }

      const loader = document.getElementById('loading-screen');
      const loaderText = document.getElementById('loading-text');
      if (loaderText) loaderText.innerText = 'กำลังตรวจสอบข้อมูล...';
      loader.classList.remove('hidden'); void loader.offsetWidth;
      loader.style.opacity = '1'; loader.style.transform = 'scale(1)';

      setTimeout(() => {
        if (userId === SUPER_ADMIN_ACCOUNT.id) {
          if (pin === SUPER_ADMIN_ACCOUNT.pin) {
            localStorage.setItem('water_app_user_id', SUPER_ADMIN_ACCOUNT.id);
            window.currentUser = SUPER_ADMIN_ACCOUNT;
            window.showToast('เข้าสู่ระบบสิทธิ์สูงสุดสำเร็จ');
            window.transitionWithLoading('list', 'กำลังเข้าสู่ระบบ...');
            return;

    window.updateChangeDisplay = function() {

      const factoryTotal = (window.deliveries.orange * pOrange) + (window.deliveries.purple * pPurple) + (window.deliveries.crate * pCrate);
      const ownServiceTotal = (window.ownTakeWash * window.prices.ownWash) + (window.ownTakeRefill * window.prices.ownRefill) + (window.ownDeliverPayWash * window.prices.ownWash) + (window.ownDeliverPayRefill * window.prices.ownRefill);

      const calcTotal = factoryTotal + ownServiceTotal + extraTotal;
      const totalToCollect = window.paymentStatus === 'support' ? 0 : calcTotal + safeNum(cust.debt);
      const changeAmount = window.cashReceived !== '' ? (safeNum(window.cashReceived) - totalToCollect) : 0;

          displayBox.innerHTML = changeAmount >= 0 
            ? `💵 ทอนเงินลูกค้า: <span class="text-3xl md:text-4xl font-black text-emerald-600 block mt-2">${changeAmount.toLocaleString()} ฿</span>` 
            : `⚠️ เงินไม่พอ: ขาดอีก <span class="text-xl md:text-2xl font-black text-red-600 ml-1 block mt-1">${Math.abs(changeAmount).toLocaleString()} ฿</span>`;
        }
      }

    window.submitDelivery = async function() {
      window.vibrate([30, 50, 30]); window.hideKeyboard(); 

      const cust = window.customers.find(c => c.id === window.selectedCustomerId);
      if (!cust) return window.showToast('ไม่พบข้อมูลลูกค้า', 'error');

      const pOrange = window.prices.orange + (window.isRemoteArea ? 5 : 0);
      const pPurple = window.prices.purple + (window.isRemoteArea ? 5 : 0);
      const pCrate = window.prices.crate + (window.isRemoteArea ? 10 : 0);

      const factoryTotal = (window.deliveries.orange * pOrange) + (window.deliveries.purple * pPurple) + (window.deliveries.crate * pCrate);
      const ownServiceTotal = (window.ownTakeWash * window.prices.ownWash) + (window.ownTakeRefill * window.prices.ownRefill) + (window.ownDeliverPayWash * window.prices.ownWash) + (window.ownDeliverPayRefill * window.prices.ownRefill);
      const extraTotal = (window.extraFees.fineBottle * window.extraPrices.fineBottle) + (window.extraFees.fineCap * window.extraPrices.fineCap) + (window.extraFees.fineTank * window.extraPrices.fineTank) + (window.extraFees.fineTankCap * window.extraPrices.fineTankCap) + (window.extraFees.depositCrate * window.extraPrices.depositCrate) + (window.extraFees.depositTank * window.extraPrices.depositTank);

      const calcTotal = factoryTotal + ownServiceTotal + extraTotal;
      
      const currentDebt = safeNum(cust.debt);
      let addedDebt = 0, amountCollected = 0, newDebt = currentDebt;

      if (window.paymentStatus === 'paid') {
        amountCollected = calcTotal + currentDebt; addedDebt = -currentDebt; newDebt = 0;
      } else if (window.paymentStatus === 'support') {
        amountCollected = 0; addedDebt = 0; newDebt = currentDebt;
      } else {
        amountCollected = 0; addedDebt = calcTotal; newDebt = currentDebt + addedDebt;
      }

      const calcStock = (old, del, ret) => Math.max(0, safeNum(old) + safeNum(del) - safeNum(ret));
      const newOrange = calcStock(cust.stockOrange, window.deliveries.orange, window.returns.orange);
      const newPurple = calcStock(cust.stockPurple, window.deliveries.purple, window.returns.purple);
      const newCrate = calcStock(cust.stockCrate, window.deliveries.crate, window.returns.crate);
      const newOwnBottle = Math.max(0, safeNum(cust.stockOwnBottle) + safeNum(window.ownTakeWash) + safeNum(window.ownTakeRefill) + safeNum(window.ownTakeUnpaid) - safeNum(window.ownDeliverDone) - safeNum(window.ownDeliverPayWash) - safeNum(window.ownDeliverPayRefill));

      const btn1 = document.getElementById('btn-submit-delivery'); const btn2 = document.getElementById('btn-submit-delivery-desktop');
      if(btn1) { btn1.innerHTML = '<div class="w-6 h-6 border-2 border-white border-t-transparent rounded-full animate-spin"></div>'; btn1.disabled = true; }
      if(btn2) { btn2.innerHTML = '<div class="w-6 h-6 border-2 border-white border-t-transparent rounded-full animate-spin"></div>'; btn2.disabled = true; }

      const loader = document.getElementById('loading-screen');
      const loaderText = document.getElementById('loading-text');
      if (loaderText) loaderText.innerText = 'กำลังบันทึกข้อมูล...';
      loader.classList.remove('hidden'); void loader.offsetWidth; loader.style.opacity = '1'; loader.style.transform = 'scale(1)';

      setTimeout(async () => {
        try {
          const batch = writeBatch(db);
          batch.update(doc(db, "customers", cust.id), { debt: newDebt, stockOrange: newOrange, stockPurple: newPurple, stockCrate: newCrate, stockOwnBottle: newOwnBottle });

          const txRef = doc(collection(db, "transactions"));
          batch.set(txRef, {
            customerId: cust.id, customerName: cust.name, zone: cust.zone, deliveries: {...window.deliveries}, returns: {...window.returns}, 
            ownTakeWash: window.ownTakeWash, ownTakeRefill: window.ownTakeRefill, ownDeliverDone: window.ownDeliverDone, ownTakeUnpaid: window.ownTakeUnpaid, ownDeliverPayWash: window.ownDeliverPayWash, ownDeliverPayRefill: window.ownDeliverPayRefill,
            extraFees: {...window.extraFees}, 
            isRemoteArea: window.isRemoteArea, paymentStatus: window.paymentStatus, paymentMethod: window.paymentStatus === 'paid' ? window.paymentMethod : null,
            totalAmount: calcTotal, amountCollected, addedDebt, status: 'active', timestamp: Date.now(), note: window.txNote, createdBy: window.currentUser.name
          });

          batch.set(doc(db, "system", "global_stock"), { orange: increment(-window.deliveries.orange), purple: increment(-window.deliveries.purple), crate: increment(-window.deliveries.crate) }, { merge: true });

          await batch.commit();
          sessionStorage.setItem('show_welcome_toast', `บันทึกการส่งให้ ${cust.name} เรียบร้อย!`);
          window.location.reload(); 
        } catch (error) {
          loader.style.opacity = '0'; setTimeout(() => loader.classList.add('hidden'), 300);
          window.showToast('บันทึกไม่สำเร็จ ตรวจสอบสัญญาณอินเทอร์เน็ต', 'error');
          if(btn1) { btn1.innerText = 'บันทึกรายการ'; btn1.disabled = false; }
          if(btn2) { btn2.innerText = 'บันทึกรายการ'; btn2.disabled = false; }
        }
      }, 300); 
    };

            const revOrange = Math.max(0, safeNum(cust.stockOrange) - safeNum(tx.deliveries?.orange) + safeNum(tx.returns?.orange));
            const revPurple = Math.max(0, safeNum(cust.stockPurple) - safeNum(tx.deliveries?.purple) + safeNum(tx.returns?.purple));
            const revCrate = Math.max(0, safeNum(cust.stockCrate) - safeNum(tx.deliveries?.crate) + safeNum(tx.returns?.crate));
            const revDebt = Math.max(0, safeNum(cust.debt) - safeNum(tx.addedDebt));
            const revOwn = Math.max(0, safeNum(cust.stockOwnBottle) - safeNum(tx.ownTakeWash) - safeNum(tx.ownTakeRefill) - safeNum(tx.ownTakeUnpaid) + safeNum(tx.ownDeliverDone) + safeNum(tx.ownDeliverPayWash) + safeNum(tx.ownDeliverPayRefill));
            batch.update(doc(db, "customers", cust.id), { debt: revDebt, stockOrange: revOrange, stockPurple: revPurple, stockCrate: revCrate, stockOwnBottle: revOwn });
          }
          batch.set(doc(db, "system", "global_stock"), { orange: increment(safeNum(tx.deliveries?.orange)), purple: increment(safeNum(tx.deliveries?.purple)), crate: increment(safeNum(tx.deliveries?.crate)) }, { merge: true });
          batch.update(doc(db, "transactions", tx.id), { status: 'voided' });
          await batch.commit();
          window.showToast('ยกเลิกบิลและดึงสต๊อกกลับสำเร็จ'); window.render();
        } catch (error) { window.showToast('เกิดข้อผิดพลาดในการยกเลิก', 'error'); }
      });
    };

    window.downloadExcelRange = function() {
      window.vibrate(30);
      const startDateVal = document.getElementById('export-start-date').value; const endDateVal = document.getElementById('export-end-date').value;
      if (!startDateVal || !endDateVal) return window.showToast("กรุณาเลือกช่วงเวลาให้ครบถ้วน", "error");

      const startTimestamp = new Date(startDateVal + "T00:00:00").getTime(); const endTimestamp = new Date(endDateVal + "T23:59:59").getTime();
      if (startTimestamp > endTimestamp) return window.showToast("วันที่เริ่มต้นต้องไม่มากกว่าสิ้นสุด", "error");

      const txList = window.transactions.filter(t => t.timestamp >= startTimestamp && t.timestamp <= endTimestamp);
      if(txList.length === 0) return window.showToast("ไม่มีบิลในช่วงเวลานี้", "error");

      const headers = [ 'วันที่และเวลา', 'ชื่อลูกค้า', 'โซน', 'พนักงานที่ส่ง', 'สถานะบิล', 'การจ่ายเงิน', 'พื้นที่ห่างไกล', 'ส่งน้ำ(ส้ม)', 'รับคืน(ส้ม)', 'ส่งน้ำ(ม่วง)', 'รับคืน(ม่วง)', 'ส่งน้ำ(ลัง)', 'รับคืน(ลัง)', 'รับมาทำ(จ่ายเลย5฿)', 'รับมาทำ(จ่ายเลย15฿)', 'รับมาทำ(ยังไม่เก็บเงิน)', 'ส่งคืน(เก็บเงิน5฿)', 'ส่งคืน(เก็บเงิน15฿)', 'ส่งคืน(จ่ายเงินแล้ว)', 'ปรับขวด(20)', 'ปรับฝาขวด(5)', 'ปรับถัง(100)', 'ปรับฝาถัง(20)', 'มัดจำลัง(300)', 'มัดจำถัง(100)', 'มูลค่าบิล(บาท)', 'เก็บเงินสด(บาท)', 'โอนQR(บาท)', 'ค้างจ่ายเพิ่ม(บาท)', 'หมายเหตุ' ];
      const rows = txList.map(tx => {
        const paymentStr = tx.paymentStatus === 'paid' ? 'จ่ายแล้ว' : (tx.paymentStatus === 'support' ? 'สนับสนุน(ฟรี)' : 'ค้างจ่าย');
        const cashAmt = (tx.paymentStatus === 'paid' && tx.paymentMethod !== 'qr') ? safeNum(tx.amountCollected) : 0;
        const qrAmt = (tx.paymentStatus === 'paid' && tx.paymentMethod === 'qr') ? safeNum(tx.amountCollected) : 0;
        return [
          `"${window.formatDate(tx.timestamp)}"`, `"${tx.customerName}"`, `"${tx.zone}"`, `"${tx.createdBy || '-'}"`, 
          tx.status === 'voided' ? 'ยกเลิก' : 'ปกติ', paymentStr, tx.isRemoteArea ? 'ใช่ (+ค่าส่ง)' : 'ปกติ',
          safeNum(tx.deliveries?.orange), safeNum(tx.returns?.orange), safeNum(tx.deliveries?.purple), safeNum(tx.returns?.purple), safeNum(tx.deliveries?.crate), safeNum(tx.returns?.crate), 
          safeNum(tx.ownTakeWash), safeNum(tx.ownTakeRefill), safeNum(tx.ownTakeUnpaid), safeNum(tx.ownDeliverPayWash), safeNum(tx.ownDeliverPayRefill), safeNum(tx.ownDeliverDone),
          safeNum(tx.extraFees?.fineBottle), safeNum(tx.extraFees?.fineCap), safeNum(tx.extraFees?.fineTank), safeNum(tx.extraFees?.fineTankCap), safeNum(tx.extraFees?.depositCrate), safeNum(tx.extraFees?.depositTank),
          safeNum(tx.totalAmount), cashAmt, qrAmt, safeNum(tx.addedDebt), `"${tx.note || ''}"`
        ].join(',');
      });

      const blob = new Blob(['\uFEFF' + headers.join(',') + '\n' + rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a'); link.href = url; link.download = `รายงานส่งน้ำ_${startDateVal}_ถึง_${endDateVal}.csv`; link.click(); URL.revokeObjectURL(url);
      window.showToast('ดาวน์โหลดไฟล์ Excel สำเร็จ');
    };

    // ✅ ฟังก์ชันกรองรายชื่อลูกค้าแบบเรียลไทม์ (ไม่ทำให้แป้นพิมพ์ค้างหรือหลุด)
    window.filterCustomers = function(query) {
      window.searchQuery = query;
      const q = query.toLowerCase();
      const cards = document.querySelectorAll('.customer-card');
      let visible = 0;
      cards.forEach(card => {
        const name = card.getAttribute('data-name').toLowerCase();
        const zone = card.getAttribute('data-zone').toLowerCase();
        const phone = card.getAttribute('data-phone').toLowerCase();
        if (name.includes(q) || zone.includes(q) || phone.includes(q)) {
          card.style.display = '';
          visible++;
        } else {
          card.style.display = 'none';
        }
      });
      const emptyMsg = document.getElementById('empty-customer-msg');
      if (emptyMsg) emptyMsg.style.display = visible === 0 ? '' : 'none';
      const clearBtn = document.getElementById('clear-search-btn');
      if (clearBtn) clearBtn.style.display = query ? '' : 'none';
    };

    window.render = function() {
      const zc = document.getElementById('zone-scroll-container');
      if (zc) window.lastZoneScroll = zc.scrollLeft;

      const container = document.getElementById('app-container');
      if (!container) return;

      if (window.currentView === 'loading') container.innerHTML = '';
      else if (window.currentView === 'login') renderLogin(container);
      else if (window.currentView === 'list') renderList(container);
      else if (window.currentView === 'addCustomer' || window.currentView === 'editCustomer') renderCustomerForm(container);
      else if (window.currentView === 'delivery') renderDelivery(container);
      else if (window.currentView === 'history') renderHistory(container);
      else if (window.currentView === 'historyAll') renderHistoryAll(container);
      else if (window.currentView === 'reports') renderReports(container);
      else if (window.currentView === 'stats') renderStats(container);
      else if (window.currentView === 'adminStock') renderAdminStock(container);

      lucide.createIcons();

      setTimeout(() => {
        const activeTab = document.getElementById('selected-zone-tab');
        if (activeTab) { activeTab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' }); } 
        else { const nzc = document.getElementById('zone-scroll-container'); if (nzc && window.lastZoneScroll !== undefined) nzc.scrollLeft = window.lastZoneScroll; }
      }, 50);
    };

    function renderLogin(container) {
      container.innerHTML = `
        <div class="p-4 md:p-8 max-w-sm mx-auto min-h-screen flex flex-col justify-center pb-20">
          <div class="text-center mb-8">
            <div class="bg-blue-100 text-blue-600 w-24 h-24 rounded-[2rem] flex items-center justify-center mx-auto mb-6 shadow-sm"><i data-lucide="droplet" class="w-12 h-12"></i></div>
            <h1 class="text-2xl font-black text-blue-900 leading-tight">ระบบงาน<br/>โรงงานน้ำดื่ม แม่จว้า หมู่ 8</h1>
          </div>
          <div class="bg-white p-6 md:p-8 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-gray-100">
            <div class="mb-4">
              <label class="block text-gray-700 text-sm font-bold mb-2">เลือกผู้ใช้งาน</label>
              <select id="login-user-select" class="w-full px-4 py-3.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 text-base font-bold bg-gray-50 outline-none transition-all cursor-pointer hover:border-blue-400">
                <option value="">-- เลื่อนเพื่อเลือกชื่อ --</option>
                <option value="${SUPER_ADMIN_ACCOUNT.id}" class="font-bold text-red-600">👑 ผู้ดูแลระบบสูงสุด (Super Admin)</option>
                ${window.users.map(u => `<option value="${u.id}">${u.name} (${u.role === 'admin' ? 'แอดมิน' : 'พนักงาน'})</option>`).join('')}
              </select>
            </div>
            <div class="mb-8">
              <label class="block text-gray-700 text-sm font-bold mb-2">รหัส PIN</label>
              <input type="password" pattern="[0-9]*" inputmode="numeric" id="login-pin" onkeypress="if(event.key === 'Enter') { window.loginUser(); return false; }" class="w-full px-4 py-3.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 text-3xl font-black tracking-[0.5em] text-center outline-none bg-gray-50 transition-all hover:border-blue-400" placeholder="****" />
            </div>
            <button type="button" id="btn-login" onclick="window.loginUser()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-600/30 active:scale-95 transition-all text-lg flex justify-center items-center hover:bg-blue-700">เข้าสู่ระบบ</button>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
